# This repo's own tools, pinned, and its two checks. `.chezmoiroot` keeps it out of the source state.
[tools]
chezmoi = "2.72.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
zizmor = "1.30.1"

[tasks.lint]
description = "Shell, zsh, JSON, TOML and workflow checks"
run = [
  "shellcheck -x home/.chezmoiscripts/* .github/*.sh .claude/hooks/*.sh",
  "shfmt -d -i 2 -ci -sr home/.chezmoiscripts/* .github/*.sh .claude/hooks/*.sh",
  "for f in $(git ls-files 'home/dot_z*'); do zsh -n \"$f\" || exit 1; done",
  # The JSON under home/ is templates; apply-check parses what they render.
  "for f in $(git ls-files '*.json' ':!home/'); do jq -e . \"$f\" > /dev/null || exit 1; done",
  "for f in $(git ls-files '*.toml'); do mise config get --file \"$f\" > /dev/null || exit 1; done",
  # Rules that would otherwise be prose: a mode comes from the source name, never the checkout;
  # the terminal owns the palette, so no hex colour, with or without Ghostty's bare `RRGGBB`;
  # scripts stay flat and never call chezmoi (the outer apply holds its lock); a run_onchange_
  # script never exits early (an early exit records its hash, so it would never retry).
  "test -z \"$(git ls-files -s home | awk '$1 != 100644')\"",
  "! git grep -nE '#[0-9a-fA-F]{6}([^0-9a-fA-F]|$)|^[a-z-]+ *= *([0-9]+=)?[0-9a-fA-F]{6} *$' -- home",
  "test -z \"$(find home/.chezmoiscripts -mindepth 1 -type d)\"",
  "! grep -nE '^[^#]*\\bchezmoi\\b' home/.chezmoiscripts/*",
  "! grep -nE '^[^#]*\\bexit( +0)?( *;|$| *#)' home/.chezmoiscripts/run_onchange_*",
  # The floor is what makes a program run at apply: only the files CLAUDE.md names may, so no
  # template executes a command and chezmoi runs no hook.
  "! git grep -nE '\\{\\{[^}]*[[:space:](|](exec|output|outputList|onepassword[A-Za-z]*)[[:space:]})]' -- home",
  "! grep -n '^\\[hooks' home/.chezmoi.toml.tmpl",
  # ~/.zshenv's shims serve every shell: an activate in .zshrc pins the desktop app's agents.
  "! grep -n '^[^#]*mise activate' home/dot_zshrc",
  "actionlint",
  "zizmor --offline .github/",
]

[tasks.apply-check]
description = "Apply the source into a temporary home and check what verify cannot"
run = ".github/apply-check.sh"

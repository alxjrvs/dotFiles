# This repo's own tools, pinned, and its two checks. CI runs both tasks; so does an agent before
# a PR. Not part of the source state: `.chezmoiroot` puts that in home/.
[tools]
chezmoi = "2.72.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
actionlint = "1.7.12"
zizmor = "1.30.1"

[tasks.lint]
description = "Shell, zsh syntax, JSON and workflow checks"
run = [
  "shellcheck -x home/.chezmoiscripts/* .github/*.sh .claude/*.sh install.sh",
  # install.sh is chezmoi's generated hook (tabs) and stays as generated.
  "shfmt -d -i 2 -ci -sr home/.chezmoiscripts/ .github/*.sh .claude/*.sh",
  "for f in $(git ls-files 'home/dot_z*'); do zsh -n \"$f\" || exit 1; done",
  # The JSON under home/ is templates; apply-check parses what they render.
  "for f in $(git ls-files '*.json' ':!home/'); do jq -e . \"$f\" > /dev/null || exit 1; done",
  "actionlint",
  "zizmor --offline .github/",
]

[tasks.apply-check]
description = "Apply the source into a temporary home and check what verify cannot"
run = ".github/apply-check.sh"

name: agent-auto-merge

# An agent's pull request merges itself once `lint` passes, so no agent has to remember to ask for
# it: from a `claude/` branch of this repo, opened with the owner's token, into main, not a draft,
# and only when every path it changes is on the allowlist below. Everything else is the floor,
# never switched on here: a path nobody thought about is one `chezmoi update`, upkeep, CI or a
# session may run. A later push that leaves the allowlist switches this workflow's own auto-merge
# back off; an agent the owner asked may still turn it on.
# `pull_request_target`, so main's copy of this file judges the PR: under `pull_request` a PR that
# edited the allowlist below would be judged by its own edit. Safe because no step checks out the PR.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] the job reads the PR's file list and never checks it out
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  auto-merge:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          # Whole paths, never a directory: chezmoi runs a `run_` or `modify_` name wherever it sits.
          # Nothing reads these at apply, upkeep, CI or session start.
          allow='^(README\.md|LICENSE|home/Screenshots/\.keep)$'
          # A list that failed, came back empty or is shorter than the PR is no proof, so it is the
          # floor. A rename counts under both names: its old path is a deletion.
          files=$(gh api "repos/$REPO/pulls/$N/files" --paginate \
            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv') || files=
          changed=$(gh api "repos/$REPO/pulls/$N" --jq .changed_files) || changed=
          paths=$(tr '\t' '\n' <<< "$files" | grep -v '^$' || true)
          if [ -n "$paths" ] && [ "$(wc -l <<< "$files" | tr -d ' ')" = "$changed" ] &&
            ! grep -qvE "$allow" <<< "$paths"; then
            gh pr merge "$PR" --auto --squash
          else
            echo "Off the allowlist, or the file list is unproven: it merges only when the owner asked."
            by=$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest.enabledBy.login // ""')
            if [[ $by == github-actions* ]]; then gh pr merge "$PR" --disable-auto; fi
          fi
        env:
          PR: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

name: lint

# Mirrors the local lefthook pre-commit gate (shellcheck + shfmt + biome +
# gitleaks + settings.json validity) on every push to main and every PR. Lint
# only — never runs `boom source` or mutates anything. (The engine and its tests
# live in the boom repo; this repo is just boom's config.)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the gate-the-gate step below diffs against the merge
          # base, which a depth-1 checkout does not have.
          fetch-depth: 0

      # The agent completion path here is deliberately review-free: one required
      # context (`lint`), no required reviewers, auto-merge on. That is what lets
      # an unattended agent land work — and it means the PR that `lint` gates can
      # edit `lint` itself. Delete the steps, get a green check, auto-merge.
      #
      # This makes that visible rather than silent: touching the gate requires
      # saying so in the PR title. It is not airtight, and cannot be from inside
      # the workflow — a PR that removes THIS step also removes the check that
      # would have caught it. The airtight version is a ruleset
      # `file_path_restriction` on `.github/**`, which is repo config rather than
      # something a commit can carry, and is a deliberate decision to make rather
      # than a default to inherit.
      #
      # The PR title goes through the environment, never interpolated into the
      # script: `${{ }}` in a `run:` block is a shell-injection sink.
      - name: gate changes to the gate
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Fetched explicitly: in a stack the base is another topic branch, not
          # main, and checkout does not necessarily have it.
          git fetch --no-tags --quiet origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- \
            .github/ lefthook.yml scripts/ dot-claude/hooks/)
          [ -n "$changed" ] || exit 0
          # Declared = a bare `ci:`, or any conventional-commit title carrying an
          # explicit scope. A scope is the smallest thing that makes the change
          # legible in a squashed merge log, which is the whole point: `fix:`
          # alone says nothing about having touched the gate, `fix(guards):` does.
          if printf '%s' "$PR_TITLE" | grep -qE '^(ci|build)(\(.+\))?!?:|^[a-z]+\(.+\)!?:'; then
            echo "gate change declared in the PR title — allowed:"
            echo "$changed"
            exit 0
          fi
          echo "This PR changes the gate itself:"
          echo "$changed"
          echo
          echo "A PR that edits the checks gating it can turn them off and still go green."
          echo "Declare it in the title so the change is legible in the merge log:"
          echo "  ci: <what>            for a change to the gate itself"
          echo "  <type>(<scope>): ...  for a change that happens to touch it"
          exit 1

      # Set mise up (PATH + shims) but skip the full `mise install` — we only
      # need the lint tools, not the whole toolchain (node, bun, neovim…).
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: Install lint tools
        run: mise install shellcheck shfmt gitleaks jq taplo biome actionlint

      # Same file set as lefthook.yml's shell globs, resolved via git.
      - name: shellcheck
        run: git ls-files -z '*.sh' 'git-template/hooks/*' | xargs -0 shellcheck -x
      - name: shfmt
        run: git ls-files -z '*.sh' 'git-template/hooks/*' | xargs -0 shfmt -d -i 2 -ci -sr

      # JS/TS/JSON lint + format gate (the boom hooks + settings.json). Mirrors
      # lefthook's biome-check; bare `biome check` uses biome.json and respects
      # .gitignore, so it never touches node_modules / worktrees.
      - name: biome
        run: biome check

      # Scan the current tree (not full history) — mirrors the pre-commit secret
      # gate without risking flaky failures on old history.
      - name: gitleaks
        run: gitleaks detect --no-git --redact --no-banner

      # The workflow files are the entire remote gate, and until now they were
      # the only config in this repo with no linter — a typo in an `if:`, a bad
      # `needs:`, a malformed `permissions:` block all landed silently. This
      # tool was already declared in mise.toml, checksummed in mise.lock, and
      # excluded from brew-drift BECAUSE mise owns it; it was simply never run.
      # It also covers the embedded shell in every `run:` by shelling out to
      # shellcheck, which the `*.sh` glob above cannot reach.
      - name: actionlint
        run: actionlint

      # Same script lefthook and `boom verify` run. Previously this block
      # transcribed lefthook's checks line for line, including the deny-floor
      # loop and its comments; the word "Mirrors" appearing in a CI file is a
      # standing invitation for the two to diverge.
      - name: settings.json guardrails
        run: scripts/settings-guardrails.sh dot-claude/settings.json

      # The boomfile.toml IS the repo — gate that every tracked TOML parses, so a
      # syntax error is caught here, not at `boom source` time on a real machine.
      # --no-schema = pure syntax (hermetic, offline). Mirrors lefthook's toml-validity.
      - name: TOML validity
        run: git ls-files -z '*.toml' | xargs -0 taplo check --no-schema

      # Same script lefthook runs. Two assertions, not one: structural validity
      # does not catch a `~` in a path value, and that is the bug that cost 28
      # days of un-run `boom verify`.
      - name: plist validity
        run: git ls-files -z 'launchd/*.plist' | xargs -0 scripts/plist-validity.sh

      - name: zsh syntax
        run: |
          command -v zsh > /dev/null 2>&1 || sudo apt-get install -y -qq zsh
          for f in $(git ls-files '*.zsh' '.zshrc' '.zprofile' '.zshenv'); do
            zsh -n "$f" || { echo "zsh syntax error in $f"; exit 1; }
          done

      # Same script lefthook's pre-commit runs, so a green commit is a green build
      # by construction. The ceilings, the capped set, and the reasoning for all
      # three (why a ceiling, why per-file, why an explicit list, why the date ban)
      # live in the script — one copy, so they cannot drift apart.
      - name: always-loaded context budget
        run: scripts/context-budget.sh

      # A skill's `description` frontmatter is injected into EVERY session; only the
      # body is on-demand. So a description is always-loaded context and gets a cap,
      # while the body it belongs to stays free. All four house skills exceeded this
      # before the rewrite (108/83/79/73 words) — `agent-friendly-repo` was
      # enumerating ruleset internals and naming which CLAUDE.md sections it
      # implements, both body material. The trigger phrases are the load-bearing
      # half: they are what a session matches on, so they stay and prose goes.
      #
      # This cannot cover ~/.claude/skills — a runner has no home dir to inspect, so
      # unmanaged skill dirs are invisible here BY CONSTRUCTION. That check lives in
      # boomfile.toml as a `verify` step; see the Claude section.
      # Same script lefthook now runs. This check used to live here alone,
      # which made it the one gate that failed only after a push.
      - name: skill description cap
        run: git ls-files -z 'dot-claude/skills/*/SKILL.md' | xargs -0 scripts/skill-description-cap.sh

      # README's forking list, enforced rather than maintained. CI runs it too
      # because a fork's first commit is exactly where this matters.
      - name: identity drift
        run: scripts/identity-drift.sh

      # The index is generated; a stale one means someone edited headings without
      # regenerating, and a stale index is worse than none.
      - name: DECISIONS table of contents
        run: scripts/decisions-toc.sh --check

      # Asserts the shared assertions themselves: a gate handed a missing path
      # or an empty file list must fail, not print `ok`. In CI specifically,
      # because CI is where these scripts are handed a literal path or a
      # `$(git ls-files …)` expansion that can be empty.
      - name: gate regression tests
        run: scripts/tests/gates.sh

      # verify-gate.sh is a Stop hook — it runs every turn and can BLOCK one, so its no-op
      # paths and its once-per-session loop-breaker are the load-bearing cases. A gate that
      # can block forever strands a session, which is worse than no gate at all.
      - name: verify-gate regression tests
        run: dot-claude/hooks/tests/verifygate.sh

      - name: guard regression tests
        run: dot-claude/hooks/tests/run.sh

      # worktree-freshness.sh is the only hook here that WRITES to a git worktree,
      # so it gets asserted like one: `ff_virgin_behind` proves it actually
      # fast-forwards, the `skip_*` cases prove it is not a blunt `reset --hard`.
      # A step in THIS job for the same reason as the one above — the required
      # context is ["lint"], so a separate job would not be a required check.
      - name: worktree-freshness regression tests
        run: dot-claude/hooks/tests/freshness.sh

      # worktree-port.sh is asserted the same way: `emits_block` and `writes_env`
      # prove it actually assigns and persists a block, and `skip_env_symlink`
      # proves it cannot write through a linked .env into the primary checkout.
      - name: worktree-port regression tests
        run: dot-claude/hooks/tests/port.sh

      # worktree-remove-guard.sh: the only irreversible action here with no PR
      # and no reflog behind it. Its load-bearing cases are the seven DENY ones;
      # the two `_dead` cases are what prove it reads liveness rather than
      # refusing every removal, which would make the guard unusable.
      - name: worktree-remove guard regression tests
        run: dot-claude/hooks/tests/wtremove.sh

      # repo-scope-guard.sh: the widest hole the audit found, since
      # `.claude/settings.local.json` had `Bash(gh api *)` pre-approved. Its
      # load-bearing cases are the twelve DENY ones; the owned-org ALLOW cases
      # prove it reads the owner rather than refusing every write.
      - name: repo-scope guard regression tests
        run: dot-claude/hooks/tests/reposcope.sh

      # The canary's suite, whose polarity is inverted from every other one here:
      # its load-bearing cases are the ones where the canary must FAIL, because an
      # always-green canary reports all-clear forever. A step in THIS job for the
      # same reason as the others — the required context is ["lint"].
      - name: claude-canary regression tests
        run: dot-claude/hooks/tests/canary.sh

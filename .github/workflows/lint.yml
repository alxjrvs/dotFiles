name: lint

# `lint` is the check the ruleset requires. The Mac is the one host, so CI is a Mac.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also installs every tool the machine's mise config names, so a renamed tool fails here and
      # not on the next apply.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache_key: mise-${{ hashFiles('mise.toml', 'home/dot_config/mise/config.toml') }}
        env:
          MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/home/dot_config/mise/config.toml
      - run: mise run lint
      - run: mise run apply-check

name: lint

# RUNS the local lefthook pre-commit gate on every push to main and every PR — the
# same roster, not a second copy of it — plus the two checks that are genuinely
# remote-only. Read-only: `boom source` appears once, under `--dry-run`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Job-wide, not just on the install step: mise installs on DEMAND through its
    # shims, so the first `jq` a guard runs later triggers an install of its own.
    env:
      # Honour mise.lock on the runner. `lockfile = true` lives in
      # mise-settings.toml, which is symlinked on the machine and never reaches
      # CI — so every `mise install` here resolved "latest" through the GitHub
      # API and ran the rate limit to zero. Do not disable attestation
      # verification to dodge that: the lock records HOW each tool was verified,
      # so verifying less is exactly what it exists to prevent.
      MISE_LOCKFILE: "1"
    steps:
      - uses: actions/checkout@v7

      # Set mise up (PATH + shims) but skip the full `mise install` — we only
      # need the lint tools, not the whole toolchain (node, bun, neovim…).
      - uses: jdx/mise-action@v4
        with:
          install: false
      # Every guard here fails OPEN without jq, by design, so a tool that failed
      # to install reads as a guard regression rather than a missing tool. That
      # is why the check below is not optional. GITHUB_TOKEN bills these calls to
      # this repo rather than a shared anonymous pool.
      - name: Install lint tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise install shellcheck shfmt gitleaks jq taplo biome actionlint lefthook \
            || { sleep 20; mise install shellcheck shfmt gitleaks jq taplo biome actionlint lefthook; }
          # RUN each tool, never `command -v`: mise puts a SHIM on PATH whether or
          # not the tool behind it installed, so `command -v` passes on absence.
          for t in shellcheck shfmt gitleaks jq taplo biome actionlint lefthook; do
            "$t" --version > /dev/null 2>&1 || { echo "::error::$t did not install"; exit 1; }
          done
          # lefthook's own roster runs `zsh -n` over the shell payload, and a
          # runner has no zsh. Installed here rather than inside that command so
          # a missing package fails at setup with a clear message.
          command -v zsh > /dev/null 2>&1 || sudo apt-get install -y -qq zsh

      # ONE ROSTER. Every check below used to be spelled twice — once in
      # lefthook.yml against `{staged_files}`, once here against a
      # `git ls-files` expansion — with nothing asserting the two agreed. They
      # had already drifted in both directions: `brew-drift` existed only in
      # lefthook, `boomfile-sources` only here. Running lefthook's own roster is
      # what makes that class impossible rather than merely unlikely.
      #
      # `--all-files` because there is no index on a runner: bare
      # `lefthook run pre-commit` would hand every `glob:`-scoped command an
      # empty file list and report success for inspecting nothing — the same
      # vacuous pass that `dot-claude/hooks/verify-gate.sh` was fixed for.
      #
      # `brew-drift` no-ops here by design (no brew on a runner, and it says so
      # rather than passing silently). The `commit-msg` stage is not part of
      # `run pre-commit` and is only meaningful on a real commit.
      - name: lefthook pre-commit (the whole local gate)
        run: lefthook run pre-commit --all-files

      # NOT part of that roster, deliberately: lefthook runs
      # `gitleaks protect --staged`, which reads the index. A runner has no
      # index, and the useful remote question is different anyway — does the
      # CURRENT TREE contain a secret, rather than does this commit add one.
      # Same tool, different verb, so it stays its own step.
      - name: gitleaks
        run: gitleaks detect --no-git --redact --no-banner

      # THE ARTIFACT, not the assertions about it. Everything above lints files;
      # this is the only step that asks the engine whether `boomfile.toml` still
      # APPLIES — every declared source, the glob fan-outs, link and dir modes,
      # the `absent` path, hook resolution and the package manifests, all
      # resolved by the thing that will resolve them on a real machine.
      #
      # It replaced scripts/boomfile-sources.sh, which hand-reimplemented one slice of
      # this (src-path existence, including its own glob-expansion branch) while
      # lefthook.yml claimed in a comment that `boom source --dry-run` was already the
      # validator for this file. Nothing ran it. Now something does.
      #
      # Safe on a runner, by construction and not by hope: `--dry-run` makes run steps
      # no-ops (run.ts refuses to spawn a shell under it), and `osx_default` and
      # `launchd` are OS-gated to darwin, so on ubuntu they report and change nothing.
      # Both repo hooks honour `api.dryRun` too.
      #
      # Installed through boom's own published bootstrap, pinned to the same tag
      # README documents — so this step also proves the documented fresh-machine
      # install path still works. install.sh verifies the binary against the release's
      # SHA256SUMS and refuses to install unverified.
      - name: boomfile applies
        env:
          BOOM_CONFIG: ${{ github.workspace }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/alxjrvs/boom/v0.30.0/install.sh | sh
          "$HOME/.local/bin/boom" source --dry-run

      # NOT redundant with the lefthook roster above, and this is the one place
      # the duplication is deliberate. Lefthook's `hook-tests` command runs
      # `all.sh --changed <files>`, which selects suites by reading each one's
      # `covers:` lines — a latency optimisation that TRUSTS those lines. A wrong
      # or missing `covers:` silently narrows what ran, and the failure mode is a
      # regression sailing through a green gate.
      #
      # Bare `all.sh` takes no argument and runs the whole roster, discovered
      # from the directory. That is the merge gate, and it is immune to a
      # `covers:` line being wrong. ~16s to make the selective run's one
      # assumption non-load-bearing.
      - name: hook regression tests (full roster, no `covers:` selection)
        run: dot-claude/hooks/tests/all.sh


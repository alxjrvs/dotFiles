name: lint

# `lint` is the status check the main ruleset requires, so it is the summary job; the work runs
# in two jobs behind it. Static checks on ubuntu, where the tools are packaged; then the source
# rendered, applied and verified on each target OS, with the applied shell and git config
# exercised.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y -q shellcheck shfmt zsh jq
      - run: shellcheck -x home/.chezmoiscripts/* .github/gate.sh install.sh
      # install.sh is chezmoi-generated (tabs) and stays as generated; the scripts are ours.
      - run: shfmt -d -i 2 -ci -sr home/.chezmoiscripts/ .github/gate.sh
      - run: for f in home/dot_zshrc home/dot_zprofile; do zsh -n "$f"; done
      - run: for f in $(git ls-files '*.json'); do jq -e . "$f" > /dev/null; done

  apply:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOME_T: ${{ github.workspace }}/../home
      CHEZMOI_ARGS: --config ${{ github.workspace }}/../chezmoi.toml --persistent-state ${{ github.workspace }}/../chezmoi.db --destination ${{ github.workspace }}/../home
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y -q zsh
      - run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mkdir -p "$HOME_T"
      # init renders home/.chezmoi.toml.tmpl; apply lays down every file, externals included.
      - run: chezmoi init --source "$GITHUB_WORKSPACE" $CHEZMOI_ARGS
      - run: chezmoi $CHEZMOI_ARGS apply --exclude scripts
      - run: chezmoi $CHEZMOI_ARGS verify --exclude scripts
      # The applied shell must start with none of the guarded tools present.
      - run: HOME="$HOME_T" zsh -l -i -c 'echo shell ok'
      # What verify cannot check: git parses the rendered XDG file, gh is the last github.com
      # helper in it, and the template took this OS's branch: darwin signs, a container does not.
      - run: |
          export HOME="$HOME_T" XDG_CONFIG_HOME="$HOME_T/.config"
          test "$(git config --global --get-all credential.https://github.com.helper | tail -1)" = '!gh auth git-credential'
          [ "$RUNNER_OS" = macOS ] && want=true || want=
          test "$(git config --global --get commit.gpgSign)" = "$want"
      # The Mac-only scripts are ignored by target name; only Linux exercises that.
      - if: runner.os == 'Linux'
        run: test "$(chezmoi $CHEZMOI_ARGS managed --include scripts | sort | tr '\n' ' ')" = '.chezmoiscripts/30-mise.sh .chezmoiscripts/50-provision.sh '

  lint:
    needs: [static, apply]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.static.result }}" = success && test "${{ needs.apply.result }}" = success

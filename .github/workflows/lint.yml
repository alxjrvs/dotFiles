name: lint

# RUNS the local lefthook pre-commit gate on every push to main and every PR — the
# same roster, not a second copy of it — plus the two checks that are genuinely
# remote-only. Read-only: chezmoi appears once, under `--dry-run`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Job-wide, not just on the install step: mise installs on DEMAND through its
    # shims, so the first `jq` a guard runs later triggers an install of its own.
    env:
      # The machine's global mise config IS the repo file; point the runner at it so
      # `mise install` resolves the same pins and reads mise.lock beside it, instead
      # of resolving through the GitHub API and running the rate limit to zero. Do
      # not disable attestation verification to dodge that: the lock records HOW
      # each tool was verified, so verifying less is exactly what it exists to prevent.
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/home/dot_config/mise/config.toml
      MISE_LOCKFILE: "1"
    steps:
      - uses: actions/checkout@v7

      # Set mise up (PATH + shims) but skip the full `mise install` — we only
      # need the lint tools, not the whole toolchain (node, bun, neovim…).
      - uses: jdx/mise-action@v4
        with:
          install: false
          # A mise tag exists before its assets are uploaded (v2026.9.3, 2026-09-08:
          # every job 404'd for a while); a day-old release always has them.
          minimum_release_age: 24h
      # Every guard here fails OPEN without jq, by design, so a tool that failed
      # to install reads as a guard regression rather than a missing tool. That
      # is why the check below is not optional. GITHUB_TOKEN bills these calls to
      # this repo rather than a shared anonymous pool.
      - name: Install lint tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise install shellcheck shfmt gitleaks jq taplo biome actionlint lefthook \
            || { sleep 20; mise install shellcheck shfmt gitleaks jq taplo biome actionlint lefthook; }
          # RUN each tool, never `command -v`: mise puts a SHIM on PATH whether or
          # not the tool behind it installed, so `command -v` passes on absence.
          for t in shellcheck shfmt gitleaks jq taplo biome actionlint lefthook; do
            "$t" --version > /dev/null 2>&1 || { echo "::error::$t did not install"; exit 1; }
          done
          # lefthook's own roster runs `zsh -n` over the shell payload, and a
          # runner has no zsh. Installed here rather than inside that command so
          # a missing package fails at setup with a clear message.
          command -v zsh > /dev/null 2>&1 || sudo apt-get install -y -qq zsh

      # ONE ROSTER. A check spelled here and in lefthook.yml is two rosters
      # that nothing asserts agree, and they drift in both directions. Running
      # lefthook's own roster is what makes that class impossible rather than
      # merely unlikely.
      #
      # `--all-files` because there is no index on a runner: bare
      # `lefthook run pre-commit` would hand every `glob:`-scoped command an
      # empty file list and report success for inspecting nothing — the same
      # vacuous pass that `home/dot_claude/hooks/verify-gate.sh` was fixed for.
      #
      # The `commit-msg` stage is not part of `run pre-commit` and is only
      # meaningful on a real commit.
      - name: lefthook pre-commit (the whole local gate)
        run: lefthook run pre-commit --all-files

      # NOT part of that roster, deliberately: lefthook runs
      # `gitleaks git --staged`, which reads the index. A runner has no
      # index, and the useful remote question is different anyway — does the
      # CURRENT TREE contain a secret, rather than does this commit add one.
      # Same tool, different verb, so it stays its own step.
      - name: gitleaks
        run: gitleaks dir . --redact --no-banner --config home/dot_config/gitleaks/gitleaks.toml

      # THE ARTIFACT, not the assertions about it: the one step that asks the engine
      # whether the source state still applies, resolved by the thing that resolves it
      # on a real machine. `init` renders the real config template, so the check runs
      # in the machine's mode and the state DB lands beside that config, out of the
      # checkout. Safe on a runner: `--dry-run` runs no script, the darwin gates render
      # empty on Linux, and `.chezmoiignore` drops the macOS-only targets but
      # deliberately not `Library`, so the verify timer's template is rendered here.
      # One github.com call remains: an `archive-file` external's tarball is read to
      # know its entries even under `--exclude externals`. The version is pinned by
      # hand — Renovate reads `uses:` lines only; bump it with the Brewfile's.
      - name: chezmoi applies
        run: |
          mise install chezmoi@2.66.0
          mise exec chezmoi@2.66.0 -- chezmoi init --source "$PWD" --destination "$RUNNER_TEMP/home" --config "$RUNNER_TEMP/chezmoi.toml"
          mise exec chezmoi@2.66.0 -- chezmoi --config "$RUNNER_TEMP/chezmoi.toml" --destination "$RUNNER_TEMP/home" apply --dry-run --verbose --exclude externals
          mise exec chezmoi@2.66.0 -- chezmoi --config "$RUNNER_TEMP/chezmoi.toml" --destination "$RUNNER_TEMP/home" managed | sed 's/^/  /'


name: lint

# The local lefthook gate, re-run on a runner; `lint` is the status check the main ruleset requires.
# `apply-linux` is the only Linux test this repo can have: the source rendered and applied on
# ubuntu, then the shell and git config exercised from the applied home.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner image ships Homebrew off PATH.
      - run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - run: brew install lefthook gitleaks shellcheck zsh
      # --all-files: nothing is staged on a runner, so every glob would otherwise see nothing.
      - run: lefthook run pre-commit --all-files
      # The roster's gitleaks scans the staged diff, which is empty here; this scans the tree.
      - run: gitleaks dir . --redact --no-banner

  apply-linux:
    runs-on: ubuntu-latest
    env:
      CHEZMOI_ARGS: --config ${{ github.workspace }}/../chezmoi.toml --persistent-state ${{ github.workspace }}/../chezmoi.db --destination ${{ github.workspace }}/../home
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y -q zsh
      - run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - run: mkdir -p "$GITHUB_WORKSPACE/../home"
      # init renders home/.chezmoi.toml.tmpl; apply lays down every non-Mac file, externals included.
      - run: "$HOME/.local/bin/chezmoi" init --source "$GITHUB_WORKSPACE" $CHEZMOI_ARGS
      - run: "$HOME/.local/bin/chezmoi" $CHEZMOI_ARGS ignored
      - run: "$HOME/.local/bin/chezmoi" $CHEZMOI_ARGS apply --exclude scripts
      - run: "$HOME/.local/bin/chezmoi" $CHEZMOI_ARGS verify --exclude scripts
      # The applied shell must start with none of the guarded tools present.
      - run: HOME="$GITHUB_WORKSPACE/../home" zsh -l -i -c 'echo "shell ok: $SHELL"'
      # The Mac half of git config is absent here; the include must be silently skipped.
      # --includes: `--global` alone defaults to --no-includes.
      - run: |
          export HOME="$GITHUB_WORKSPACE/../home"
          test "$(git config --global --includes --get user.name)" = alxjrvs
          test -z "$(git config --global --includes --get commit.gpgSign)"
          test "$(git config --global --includes --get-all credential.https://github.com.helper | tail -1)" = '!gh auth git-credential'

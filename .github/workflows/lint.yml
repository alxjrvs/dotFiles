name: lint

# Runs the local lefthook pre-commit gate on every push to main and every PR (the same roster,
# not a second copy), plus the two checks that are genuinely remote-only. On macOS, because the
# tree is macOS-only and a Linux runner would need every script gated and every Mac path ignored.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # brew, unpinned: the same source the machine gets chezmoi from, and the linters' output
      # does not change meaningfully across patch versions.
      - name: Install tools
        run: brew install shellcheck shfmt gitleaks jq taplo actionlint lefthook chezmoi

      # ONE ROSTER: lefthook's own. `--all-files` because a runner has no index; bare
      # `run pre-commit` would hand every `glob:` command an empty file list and pass.
      - name: lefthook pre-commit (the whole local gate)
        run: lefthook run pre-commit --all-files

      # The roster runs `gitleaks git --staged`, which reads the index. The remote question is
      # different: does the CURRENT TREE contain a secret.
      - name: gitleaks
        run: gitleaks dir . --redact --no-banner --config home/dot_config/gitleaks/gitleaks.toml

      # The one step that asks the engine whether the source state still applies. `--dry-run`
      # runs no script; it renders every file and template into a temp destination. Externals
      # are excluded, though chezmoi still reads each archive's index to know its entries.
      - name: chezmoi applies
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          : > "$RUNNER_TEMP/chezmoi.toml"
          chezmoi --source "$PWD" --config "$RUNNER_TEMP/chezmoi.toml" --destination "$RUNNER_TEMP/home" apply --dry-run --verbose --exclude externals
          chezmoi --source "$PWD" --config "$RUNNER_TEMP/chezmoi.toml" --destination "$RUNNER_TEMP/home" managed | sed 's/^/  /'

name: lint

# Mirrors the local lefthook pre-commit gate on every push to main and every PR.
# Lint only — never runs `boom source` or mutates anything.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Job-wide, not just on the install step: mise installs on DEMAND through its
    # shims, so the first `jq` a guard runs later triggers an install of its own.
    env:
      # Honour mise.lock on the runner. `lockfile = true` lives in
      # mise-settings.toml, which is symlinked on the machine and never reaches
      # CI — so every `mise install` here resolved "latest" through the GitHub
      # API and ran the rate limit to zero. Do not disable attestation
      # verification to dodge that: the lock records HOW each tool was verified,
      # so verifying less is exactly what it exists to prevent.
      MISE_LOCKFILE: "1"
    steps:
      - uses: actions/checkout@v7

      # Set mise up (PATH + shims) but skip the full `mise install` — we only
      # need the lint tools, not the whole toolchain (node, bun, neovim…).
      - uses: jdx/mise-action@v4
        with:
          install: false
      # Every guard here fails OPEN without jq, by design, so a tool that failed
      # to install reads as a guard regression rather than a missing tool. That
      # is why the check below is not optional. GITHUB_TOKEN bills these calls to
      # this repo rather than a shared anonymous pool.
      - name: Install lint tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mise install shellcheck shfmt gitleaks jq taplo biome actionlint \
            || { sleep 20; mise install shellcheck shfmt gitleaks jq taplo biome actionlint; }
          # RUN each tool, never `command -v`: mise puts a SHIM on PATH whether or
          # not the tool behind it installed, so `command -v` passes on absence.
          for t in shellcheck shfmt gitleaks jq taplo biome actionlint; do
            "$t" --version > /dev/null 2>&1 || { echo "::error::$t did not install"; exit 1; }
          done

      # Same file set as lefthook.yml's shell globs, resolved via git.
      - name: shellcheck
        run: git ls-files -z '*.sh' 'git-template/hooks/*' | xargs -0 shellcheck -x
      - name: shfmt
        run: git ls-files -z '*.sh' 'git-template/hooks/*' | xargs -0 shfmt -d -i 2 -ci -sr

      # Mirrors lefthook's biome-check; bare `biome check` uses biome.json and
      # respects .gitignore, so it never touches node_modules / worktrees.
      - name: biome
        run: biome check

      # The current tree, not full history — mirrors the pre-commit secret gate
      # without risking flaky failures on old history.
      - name: gitleaks
        run: gitleaks detect --no-git --redact --no-banner

      # The workflow files are the rest of the remote gate. actionlint also
      # covers the embedded shell in every `run:` by shelling out to shellcheck,
      # which the `*.sh` glob above cannot reach.
      - name: actionlint
        run: actionlint

      # Same script lefthook and `boom verify` run — one copy of the assertions,
      # so the three call sites cannot drift.
      - name: settings.json guardrails
        run: scripts/settings-guardrails.sh dot-claude/settings.json

      # A TOML syntax error is caught here, not at `boom source` time on a real
      # machine. --no-schema = pure syntax (hermetic, offline).
      - name: TOML validity
        run: git ls-files -z '*.toml' | xargs -0 taplo check --no-schema

      # Same script lefthook runs. Two assertions, not one: structural validity
      # does not catch a `~` in a path value, which launchd never expands.
      - name: plist validity
        run: git ls-files -z 'launchd/*.plist' | xargs -0 scripts/plist-validity.sh

      - name: zsh syntax
        run: |
          command -v zsh > /dev/null 2>&1 || sudo apt-get install -y -qq zsh
          for f in $(git ls-files '*.zsh' '.zshrc' '.zprofile' '.zshenv'); do
            zsh -n "$f" || { echo "zsh syntax error in $f"; exit 1; }
          done

      # Same script lefthook's pre-commit runs. The ceilings, the capped set and
      # the reasoning for each live in the script — one copy, so they cannot
      # drift apart.
      - name: always-loaded context budget
        run: scripts/context-budget.sh

      # taplo proving boomfile.toml parses says nothing about whether the payload
      # paths it names are there. A missing src fails `boom source` partway
      # through, on a real machine, after it has already changed things.
      - name: boomfile sources exist
        run: scripts/boomfile-sources.sh

      # The rules directory is exempt from the byte ceiling on exactly one
      # condition: every rule is path-scoped, so it costs nothing until a
      # matching file is read. This is that condition.
      - name: rules are path-scoped
        run: scripts/rules-scoped.sh

      # A skill's or agent's `description` frontmatter is injected into EVERY
      # session; only the body is on-demand. So the description gets a cap while
      # the body it belongs to stays free.
      #
      # This cannot cover ~/.claude/skills — a runner has no home dir to inspect,
      # so unmanaged skill dirs are invisible here BY CONSTRUCTION. That check is
      # a `verify` step in boomfile.toml.
      - name: skill + agent description cap
        run: git ls-files -z 'dot-claude/skills/*/SKILL.md' 'dot-claude/agents/*.md' | xargs -0 scripts/description-cap.sh

      # README's forking list, enforced rather than maintained. CI runs it too
      # because a fork's first commit is exactly where this matters.
      - name: identity drift
        run: scripts/identity-drift.sh

      # Asserts the shared assertions themselves: a gate handed a missing path
      # or an empty file list must fail, not print `ok`. In CI specifically,
      # because CI is where these scripts are handed a literal path or a
      # `$(git ls-files …)` expansion that can be empty.
      - name: gate regression tests
        run: scripts/tests/gates.sh


      # One step in THIS job, not a job of its own: the required context is
      # ["lint"], so a separate job would not be a required check.
      - name: hook regression tests
        run: dot-claude/hooks/tests/all.sh


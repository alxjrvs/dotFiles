name: lint

# Mirrors the local lefthook pre-commit gate (shellcheck + shfmt + biome +
# gitleaks + settings.json validity) on every push to main and every PR. Lint
# only — never runs `boom apply` or mutates anything. (The engine and its tests
# live in the boom repo; this repo is just boom's config.)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Set mise up (PATH + shims) but skip the full `mise install` — we only
      # need the lint tools, not the whole toolchain (node, bun, neovim…).
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: Install lint tools
        run: mise install shellcheck shfmt gitleaks jq taplo biome

      # Same file set as lefthook.yml's shell globs, resolved via git.
      - name: shellcheck
        run: shellcheck -x $(git ls-files '*.sh' 'git-template/hooks/*')
      - name: shfmt
        run: shfmt -d -i 2 -ci -sr $(git ls-files '*.sh' 'git-template/hooks/*')

      # JS/TS/JSON lint + format gate (the boom hooks + settings.json). Mirrors
      # lefthook's biome-check; bare `biome check` uses biome.json and respects
      # .gitignore, so it never touches node_modules / worktrees.
      - name: biome
        run: biome check

      # Scan the current tree (not full history) — mirrors the pre-commit secret
      # gate without risking flaky failures on old history.
      - name: gitleaks
        run: gitleaks detect --no-git --redact --no-banner

      - name: settings.json validity
        run: jq -e . dot-claude/settings.json > /dev/null

      # Mirrors lefthook's settings-json-validity: the same content guardrails
      # boomfile.toml's `boom verify` runs against the live
      # ~/.claude/settings.json (MCP auto-approve keys, osxkeychain git-helper
      # regression, Fable pinned as default model, secret-path deny floor),
      # applied here to the committed file so CI catches drift immediately, not
      # just the nightly launchd verify run on the live machine.
      - name: settings.json content guardrails
        run: |
          f=dot-claude/settings.json
          ! grep -qE '(enableAllProjectMcpServers|enabledMcpjsonServers)' "$f" || { echo "forbidden auto-approve MCP key in $f"; exit 1; }
          grep -q 'op-agent git-credential' "$f" || { echo "agent git helper not wired to op-agent git-credential in $f"; exit 1; }
          # op-guard.sh is the allow-list that makes `op` usable without
          # reopening the stdout leak, and `permissions.allow` pre-approves
          # `Bash(op run:*)` on the strength of it. Un-wiring the hook while
          # leaving the allow entry is the single edit that turns this change
          # from narrower into wider, so it is asserted rather than trusted.
          grep -q 'op-guard.sh' "$f" || { echo "op-guard PreToolUse hook not wired in $f, but permissions.allow pre-approves Bash(op run:*)"; exit 1; }
          ! grep -q 'osxkeychain' "$f" || { echo "forbidden osxkeychain git helper (cached-PAT regression) in $f"; exit 1; }
          ! grep -qE '"model"[[:space:]]*:[[:space:]]*"[^"]*fable' "$f" || { echo "Fable pinned as default model in $f"; exit 1; }
          # The deny floor. Until 2026-08-05 this array had no assertion at all:
          # it could be deleted wholesale and every gate here stayed green. These
          # entries are the Bash path to a resolved secret — `op-agent header` and
          # `op-agent git-credential get` each print a live credential to stdout,
          # and stdout is model context. `op-agent header` is the exact command
          # that leaked a PAT into a transcript on 2026-07-25; that postmortem
          # produced a prose rule and no deny entry, which is the gap this closes.
          #
          # ARRAY-AWARE, not a substring grep (changed 2026-08-08). `grep -qF
          # '"Bash(op:*)"'` only asks whether the string appears anywhere in the
          # file, so moving an entry out of `deny` and into `allow` inverted the
          # control while all three gates stayed green. `jq index` asserts
          # membership of the deny ARRAY, and passing the value via --arg means it
          # is data rather than a pattern — which is what `-F` was working around.
          #
          # All SEVEN entries, not three: the keychain read, both `Read()` rules,
          # and `Bash(~/.local/bin/op-agent:*)` were previously deletable with
          # every gate green.
          for d in \
            'Bash(security find-generic-password:*)' \
            'Bash(op read:*)' \
            'Bash(op item get:*)' \
            'Bash(op document get:*)' \
            'Bash(op-agent:*)' \
            'Bash(~/.local/bin/op-agent:*)' \
            'Bash(git credential:*)' \
            'Read(~/.ssh/id_*)' \
            'Read(~/.aws/credentials)' \
            'Bash(*/op *)' \
            'Bash(*/op-agent *)'; do
            jq -e --arg d "$d" '.permissions.deny | index($d)' "$f" > /dev/null \
              || { echo "missing deny entry $d in .permissions.deny of $f (secret-path floor)"; exit 1; }
          done

      # The boomfile.toml IS the repo — gate that every tracked TOML parses, so a
      # syntax error is caught here, not at `boom apply` time on a real machine.
      # --no-schema = pure syntax (hermetic, offline). Mirrors lefthook's toml-validity.
      - name: TOML validity
        run: taplo check --no-schema $(git ls-files '*.toml')

      # launchd does NOT expand `~` or `$HOME` in plist values: it fails the job
      # with EX_CONFIG (78) BEFORE running it, so the only symptom is a job that
      # silently never runs. com.alxjrvs.boom-verify.plist reported runs=0 from
      # 2026-07-10 to 2026-08-08 for exactly this reason, while the identical bug
      # had already been found and fixed in the capslock plist on 2026-07-13 and
      # not carried across. 28 days of `boom verify` guardrails never executing.
      #
      # Structural validity does NOT catch it — both plists parsed cleanly
      # throughout — so this is deliberately two assertions. `plutil` is macOS
      # only; plistlib is the portable equivalent for this runner.
      - name: plist validity
        run: |
          for f in $(git ls-files 'launchd/*.plist'); do
            python3 -c "import plistlib,sys; plistlib.load(open(sys.argv[1],'rb'))" "$f"
            ! grep -nE '<string>[~$]' "$f" || { echo "launchd does not expand ~ or \$HOME in $f — use an absolute path (EX_CONFIG 78, job silently never runs)"; exit 1; }
          done

      # The interactive shell payload runs on EVERY shell startup and was linted
      # by nothing. shellcheck's file set is `*.sh`, and shellcheck cannot parse
      # zsh at all ("Unknown shell: zsh"), so excluding these files was correct —
      # but nothing replaced it. `zsh -n` is the native no-exec syntax check.
      - name: zsh syntax
        run: |
          command -v zsh > /dev/null 2>&1 || sudo apt-get install -y -qq zsh
          for f in $(git ls-files '*.zsh' '.zshrc' '.zprofile' '.zshenv'); do
            zsh -n "$f" || { echo "zsh syntax error in $f"; exit 1; }
          done

      # The two PreToolUse guards are the only deterministic enforcement in the
      # setup — and they shipped untested, which is how a `--dry-run` substring in
      # an unrelated commit message came to disable the direct-push-to-main rule.
      # A step in THIS job, not a new one: the required context is ["lint"], so a
      # separate job would not be a required check.
      - name: guard regression tests
        run: dot-claude/hooks/tests/run.sh

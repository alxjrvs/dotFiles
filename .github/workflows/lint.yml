name: lint

# Mirrors the local lefthook pre-commit gate (shellcheck + shfmt + biome +
# gitleaks + settings.json validity) on every push to main and every PR. Lint
# only — never runs `boom source` or mutates anything. (The engine and its tests
# live in the boom repo; this repo is just boom's config.)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Set mise up (PATH + shims) but skip the full `mise install` — we only
      # need the lint tools, not the whole toolchain (node, bun, neovim…).
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: Install lint tools
        run: mise install shellcheck shfmt gitleaks jq taplo biome

      # Same file set as lefthook.yml's shell globs, resolved via git.
      - name: shellcheck
        run: shellcheck -x $(git ls-files '*.sh' 'git-template/hooks/*')
      - name: shfmt
        run: shfmt -d -i 2 -ci -sr $(git ls-files '*.sh' 'git-template/hooks/*')

      # JS/TS/JSON lint + format gate (the boom hooks + settings.json). Mirrors
      # lefthook's biome-check; bare `biome check` uses biome.json and respects
      # .gitignore, so it never touches node_modules / worktrees.
      - name: biome
        run: biome check

      # Scan the current tree (not full history) — mirrors the pre-commit secret
      # gate without risking flaky failures on old history.
      - name: gitleaks
        run: gitleaks detect --no-git --redact --no-banner

      # Same script lefthook and `boom verify` run. Previously this block
      # transcribed lefthook's checks line for line, including the deny-floor
      # loop and its comments; the word "Mirrors" appearing in a CI file is a
      # standing invitation for the two to diverge.
      - name: settings.json guardrails
        run: scripts/settings-guardrails.sh dot-claude/settings.json

      # The boomfile.toml IS the repo — gate that every tracked TOML parses, so a
      # syntax error is caught here, not at `boom source` time on a real machine.
      # --no-schema = pure syntax (hermetic, offline). Mirrors lefthook's toml-validity.
      - name: TOML validity
        run: taplo check --no-schema $(git ls-files '*.toml')

      # launchd does NOT expand `~` or `$HOME` in plist values: it fails the job
      # with EX_CONFIG (78) BEFORE running it, so the only symptom is a job that
      # silently never runs. com.alxjrvs.boom-verify.plist reported runs=0 from
      # 2026-07-10 to 2026-08-08 for exactly this reason, while the identical bug
      # had already been found and fixed in the capslock plist on 2026-07-13 and
      # not carried across. 28 days of `boom verify` guardrails never executing.
      #
      # Structural validity does NOT catch it — both plists parsed cleanly
      # throughout — so this is deliberately two assertions. `plutil` is macOS
      # only; plistlib is the portable equivalent for this runner.
      - name: plist validity
        run: |
          for f in $(git ls-files 'launchd/*.plist'); do
            python3 -c "import plistlib,sys; plistlib.load(open(sys.argv[1],'rb'))" "$f"
            ! grep -nE '<string>[~$]' "$f" || { echo "launchd does not expand ~ or \$HOME in $f — use an absolute path (EX_CONFIG 78, job silently never runs)"; exit 1; }
          done

      # The interactive shell payload runs on EVERY shell startup and was linted
      # by nothing. shellcheck's file set is `*.sh`, and shellcheck cannot parse
      # zsh at all ("Unknown shell: zsh"), so excluding these files was correct —
      # but nothing replaced it. `zsh -n` is the native no-exec syntax check.
      - name: zsh syntax
        run: |
          command -v zsh > /dev/null 2>&1 || sudo apt-get install -y -qq zsh
          for f in $(git ls-files '*.zsh' '.zshrc' '.zprofile' '.zshenv'); do
            zsh -n "$f" || { echo "zsh syntax error in $f"; exit 1; }
          done

      # Same script lefthook's pre-commit runs, so a green commit is a green build
      # by construction. The ceilings, the capped set, and the reasoning for all
      # three (why a ceiling, why per-file, why an explicit list, why the date ban)
      # live in the script — one copy, so they cannot drift apart.
      - name: always-loaded context budget
        run: scripts/context-budget.sh

      # A skill's `description` frontmatter is injected into EVERY session; only the
      # body is on-demand. So a description is always-loaded context and gets a cap,
      # while the body it belongs to stays free. All four house skills exceeded this
      # before the rewrite (108/83/79/73 words) — `agent-friendly-repo` was
      # enumerating ruleset internals and naming which CLAUDE.md sections it
      # implements, both body material. The trigger phrases are the load-bearing
      # half: they are what a session matches on, so they stay and prose goes.
      #
      # This cannot cover ~/.claude/skills — a runner has no home dir to inspect, so
      # unmanaged skill dirs are invisible here BY CONSTRUCTION. That check lives in
      # boomfile.toml as a `verify` step; see the Claude section.
      - name: skill description cap
        run: |
          fail=0
          for f in dot-claude/skills/*/SKILL.md; do
            [ -f "$f" ] || continue
            d=$(awk '/^description:/{sub(/^description:[[:space:]]*/,""); print; exit}' "$f")
            [ -n "$d" ] || { echo "$f: frontmatter has no description:"; fail=1; continue; }
            w=$(printf '%s' "$d" | wc -w | tr -d ' ')
            if [ "$w" -gt 60 ]; then
              echo "$f: description is $w words (cap 60) — it loads into EVERY session"
              fail=1
            else
              echo "ok $f ($w words)"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # The two PreToolUse guards are the only deterministic enforcement in the
      # setup — and they shipped untested, which is how a `--dry-run` substring in
      # an unrelated commit message came to disable the direct-push-to-main rule.
      # A step in THIS job, not a new one: the required context is ["lint"], so a
      # separate job would not be a required check.
      - name: guard regression tests
        run: dot-claude/hooks/tests/run.sh

      # worktree-freshness.sh is the only hook here that WRITES to a git worktree,
      # so it gets asserted like one: `ff_virgin_behind` proves it actually
      # fast-forwards, the `skip_*` cases prove it is not a blunt `reset --hard`.
      # A step in THIS job for the same reason as the one above — the required
      # context is ["lint"], so a separate job would not be a required check.
      - name: worktree-freshness regression tests
        run: dot-claude/hooks/tests/freshness.sh

      # worktree-publish.sh is the only hook here that writes to a REMOTE, so it
      # is asserted that way: `publishes_unpushed` proves it actually publishes,
      # and the `skip_*`/`never_force` cases prove it is not an indiscriminate
      # `push --force`. A step in THIS job for the same reason as the two above —
      # the required context is ["lint"], so a separate job would not be required.
      - name: worktree-publish regression tests
        run: dot-claude/hooks/tests/publish.sh

      # worktree-port.sh is asserted the same way: `emits_block` and `writes_env`
      # prove it actually assigns and persists a block, and `skip_env_symlink`
      # proves it cannot write through a linked .env into the primary checkout.
      - name: worktree-port regression tests
        run: dot-claude/hooks/tests/port.sh

      # worktree-remove-guard.sh: the only irreversible action here with no PR
      # and no reflog behind it. Its load-bearing cases are the seven DENY ones;
      # the two `_dead` cases are what prove it reads liveness rather than
      # refusing every removal, which would make the guard unusable.
      - name: worktree-remove guard regression tests
        run: dot-claude/hooks/tests/wtremove.sh

      # repo-scope-guard.sh: the widest hole the audit found, since
      # `.claude/settings.local.json` had `Bash(gh api *)` pre-approved. Its
      # load-bearing cases are the twelve DENY ones; the owned-org ALLOW cases
      # prove it reads the owner rather than refusing every write.
      - name: repo-scope guard regression tests
        run: dot-claude/hooks/tests/reposcope.sh

      # The canary's suite, whose polarity is inverted from every other one here:
      # its load-bearing cases are the ones where the canary must FAIL, because an
      # always-green canary reports all-clear forever. A step in THIS job for the
      # same reason as the others — the required context is ["lint"].
      - name: claude-canary regression tests
        run: dot-claude/hooks/tests/canary.sh

name: lint

# One job, because `lint` is the status check the main ruleset requires: three static checks,
# then the source rendered and applied on ubuntu with the applied shell and git config exercised.
# That apply is the test of the container path. Secrets are GitHub's push protection, on the
# repo, not a step here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      HOME_T: ${{ github.workspace }}/../home
      CHEZMOI_ARGS: --config ${{ github.workspace }}/../chezmoi.toml --persistent-state ${{ github.workspace }}/../chezmoi.db --destination ${{ github.workspace }}/../home
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y -q shellcheck zsh jq
      - run: shellcheck -x home/.chezmoiscripts/* home/dot_local/bin/* install.sh
      - run: for f in home/dot_zshrc home/dot_zprofile; do zsh -n "$f"; done
      - run: for f in $(git ls-files '*.json'); do jq -e . "$f" > /dev/null; done

      - run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mkdir -p "$HOME_T"
      # init renders home/.chezmoi.toml.tmpl; apply lays down every non-Mac file, externals included.
      - run: chezmoi init --source "$GITHUB_WORKSPACE" $CHEZMOI_ARGS
      - run: chezmoi $CHEZMOI_ARGS ignored
      - run: chezmoi $CHEZMOI_ARGS apply --exclude scripts
      - run: chezmoi $CHEZMOI_ARGS verify --exclude scripts
      # The applied shell must start with none of the guarded tools present.
      - run: HOME="$HOME_T" zsh -l -i -c 'echo shell ok'
      # One git config template: the Mac-only signing block must not render here, and gh must
      # be the last helper for github.com. The runner exports its own XDG_CONFIG_HOME.
      - run: |
          export HOME="$HOME_T" XDG_CONFIG_HOME="$HOME_T/.config"
          git config --global --list --show-origin
          test "$(git config --global --get user.name)" = alxjrvs
          test -z "$(git config --global --get commit.gpgSign)"
          test "$(git config --global --get-all credential.https://github.com.helper | tail -1)" = '!gh auth git-credential'

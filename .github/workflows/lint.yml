name: lint

# The local lefthook gate, re-run on a runner; `lint` is the status check the main ruleset requires.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner image ships Homebrew off PATH.
      - run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - run: brew install lefthook gitleaks shellcheck
      # --all-files: a runner has no index, so the shellcheck glob would otherwise see nothing.
      - run: lefthook run pre-commit --all-files
      # The gate scans the index; the remote question is whether the tree holds a secret.
      - run: gitleaks dir . --redact --no-banner

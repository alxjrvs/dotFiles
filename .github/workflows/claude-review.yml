name: claude-review

# Adversarial PR review, run in CI instead of on this laptop.
#
# STATUS: manual-trigger only, deliberately. This is the mechanism AND the experiment for
# retiring `dot-claude/hooks/pr-review.sh` (234 lines of bash + pr-review-settings.json + three
# PostToolUse handlers). It is not yet on `pull_request`, and the local hook is untouched, so
# nothing double-reviews. See "Before switching over" below.
#
# Why move it at all — two of the three reasons the local hook exists are now dead:
#
#   1. "Running it locally is subscription-covered, whereas an agent in GitHub Actions bills
#      metered money — roughly 1,600 paid runs per half-year at 8.8 PRs/day."
#      FALSIFIED. Authenticating with an OAuth token uses the Claude subscription rather than
#      API billing (code.claude.com/docs/en/github-actions#manage-costs). That number was the
#      load-bearing argument.
#   2. "A commit status posted with your own token is a valid required_status_checks context,
#      so a ruleset can eventually require it."
#      RETIRED 2026-08-17, when the commit status was removed. Nothing left to preserve.
#   3. "covered ~2% of PRs, because it waited to be invoked by hand."
#      This argues FOR automation, not against it. A pull_request trigger covers 100% with no
#      PR_REVIEW_REPOS allowlist to maintain.
#
# The prize is structural, not the deleted bash. A GitHub runner has no login keychain, no
# op-agent and no PAT — so the 2026-07-25 exfil postmortem (poisoned input reaching a
# credential, DECISIONS.md) DISSOLVES rather than being mitigated by configuration. It also
# fixes the stack-scoping defect already flagged: a pull_request event is scoped to its own
# base, so stacked layers stop re-reviewing each other.
#
# Before switching over, measure the one open question (E2): whether subscription-token Action
# runs draw on the same weekly limits as interactive sessions at ~8.8 PRs/day. The docs don't
# say, and it is the only surviving argument for keeping the review local. Run this manually on
# a few PRs, compare `/insights` before and after, then either:
#   - add `pull_request: [opened, synchronize, ready_for_review, reopened]` here and delete
#     hooks/pr-review.sh + pr-review-settings.json + the three PostToolUse handlers, or
#   - delete this file and keep the local hook, recording the measurement in DECISIONS.md.
#
# Accept going in: this does not restore a blocking check. Even the managed Code Review product
# completes its check run neutral by design, so that leg is dead either way.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth, not an API key — this is the whole point of reason (1) above.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ inputs.pr }}
          # The inline-comment tool must be allowed explicitly; the action's docs are firm that
          # without it the review runs and then has no way to post what it found.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

name: bootstrap

# A fresh Mac, rehearsed: the README's installer and first apply on a clean runner, then a second
# apply and verify for idempotency, when machine setup changes. Not a required check: it
# installs every cask and takes a while.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - home/.chezmoiscripts/**
      - home/.chezmoi.toml.tmpl
      - home/.chezmoidata.toml
      - home/.chezmoiremove
      - home/dot_config/homebrew/Brewfile
      - home/dot_config/mise/**
      - home/Library/**
      - .github/workflows/bootstrap.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The README's installer
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
      - name: The first apply, from this checkout
        run: |
          ~/.local/bin/chezmoi init --apply --no-tty \
            --source "$GITHUB_WORKSPACE"
      # `init --source` records no source, so every later command names it. From here chezmoi is
      # mise's: the first apply removed the installer's copy.
      - name: The first apply leaves nothing to verify
        run: ~/.local/share/mise/shims/chezmoi verify --source "$GITHUB_WORKSPACE"
      - name: Only mise's chezmoi is left
        run: '[ ! -e ~/.local/bin/chezmoi ]'
      - name: A second apply changes nothing, and verify agrees
        run: |
          ~/.local/share/mise/shims/chezmoi apply --no-tty --source "$GITHUB_WORKSPACE"
          ~/.local/share/mise/shims/chezmoi verify --source "$GITHUB_WORKSPACE"

name: dependabot-auto-merge

# Hands Dependabot's minor and patch action bumps to GitHub's auto-merge, which still waits for the
# required `lint` check. `pull_request`, never `pull_request_target`: the job never checks out the
# PR, and a Dependabot run's token takes the permissions granted here.
on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
      # An allowlist, so an update type it cannot classify stays a manual PR.
      - if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        # The title alone: a Dependabot body is release notes, and gate.sh squashes with the body.
        run: gh pr merge --auto --squash --body "" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}

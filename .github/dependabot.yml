# Only the actions in .github/workflows, pinned by commit: nothing else here is a dependency
# Dependabot understands. A week's cooldown lets a compromised release be caught first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

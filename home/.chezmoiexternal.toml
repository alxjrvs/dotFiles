# The Claude Code statusline: two scripts from a tag tarball, straight onto PATH under the names
# dot_claude/settings.json calls. Bump the tag in both entries after reading what changed.
[".local/bin/claude-statusline"]
    type = "archive-file"
    url = "https://github.com/TheGnarCo/claude-statusline/archive/refs/tags/v1.1.1.tar.gz"
    path = "claude-statusline-1.1.1/statusline.sh"
    executable = true

[".local/bin/claude-subagent-statusline"]
    type = "archive-file"
    url = "https://github.com/TheGnarCo/claude-statusline/archive/refs/tags/v1.1.1.tar.gz"
    path = "claude-statusline-1.1.1/subagent-statusline.sh"
    executable = true

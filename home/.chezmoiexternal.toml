# Externals: content chezmoi fetches rather than tracks. `archive-file` pulls one file out of
# a tag tarball, so a bump is a URL change that chezmoi re-fetches on the next apply and
# `chezmoi verify` checks — a `git-repo` external pinned by `--branch` would keep the first
# clone forever and verify nothing. Bump the tag in both entries, after reading what changed.
#
# The Claude Code statusline. Two self-contained scripts (bash + jq), 755 upstream; they go
# straight onto PATH under the names dot_claude/settings.json calls. Not a mise entry: the
# repo publishes tags with no release asset.
[".local/bin/claude-statusline"]
    type = "archive-file"
    url = "https://github.com/TheGnarCo/claude-statusline/archive/refs/tags/v1.1.1.tar.gz"
    path = "claude-statusline-1.1.1/statusline.sh"
    executable = true

[".local/bin/claude-subagent-statusline"]
    type = "archive-file"
    url = "https://github.com/TheGnarCo/claude-statusline/archive/refs/tags/v1.1.1.tar.gz"
    path = "claude-statusline-1.1.1/subagent-statusline.sh"
    executable = true

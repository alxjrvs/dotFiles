# Only divergences, except `version`, which gh writes back and which has to stay LAST: gh
# APPENDS the key rather than replacing it in place, so a `version` anywhere but the final
# line gets a second copy on gh's first write, leaving this file permanently dirty.
pager: delta
aliases:
    co: pr checkout
    pv: pr view --web
    pc: pr create --fill
    is: issue search --state=open
    il: issue list
    pl: pr list
    rc: repo clone
version: "1"

# gitleaks — the config the git template hook reads in repos that declare none of their
# own (~/.config/gitleaks/gitleaks.toml), and this repo's lefthook and CI pass explicitly.
# Deliberately NOT exported as GITLEAKS_CONFIG: that variable outranks a repo's own
# .gitleaks.toml, so a shell-wide export would silently discard every other repo's
# allowlists and rules.
#
# Only divergences from gitleaks' own default ruleset, which `useDefault` keeps whole.
title = "alxjrvs"

[extend]
useDefault = true

# A `${VAR}` placeholder in a tracked `.mcp.json` is not a secret today and becomes one
# tomorrow: a later `claude mcp add` can expand it and write the resolved token back into
# the tracked file (Claude Code #18692). The canonical `op run --env-file=F -- SERVER`
# pattern needs no placeholder in `.mcp.json` at all, and a `headersHelper` needs none
# either.
[[rules]]
id = "mcp-json-env-placeholder"
description = "${VAR} placeholder in a tracked .mcp.json — a later `claude mcp add` can expand it into a committed token. Use `op run --env-file` or a headersHelper instead."
# The match is the whole JSON string around the placeholder, not the placeholder alone:
# gitleaks' default global allowlist drops any finding that is exactly `${NAME}`, which is
# precisely the shape this rule exists for. Measured with 8.30.1 — the bare form reported
# "no leaks found" on a `.mcp.json` carrying `${GITHUB_TOKEN}`. scripts/tests/gates.sh
# drives this rule over a generated fixture so that regression cannot return.
regex = '''"[^"\n]*\$\{[A-Za-z_][A-Za-z0-9_]*(?::-[^}]*)?\}[^"\n]*"'''
path = '''(^|/)\.mcp\.json$'''
keywords = ["${"]

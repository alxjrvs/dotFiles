# starship prompt — the Claude statusline's visual grammar: a bold near-white identity (cwd),
# then muted-bracketed git chips in the statusline's colors (branch blue, untracked cyan,
# stashes magenta, additions green, deletions red).

add_newline = false
format = "$directory$git_branch$git_state$git_status $character"

# repo_root_style is muted so that inside a git worktree (e.g. .claude/worktrees/<name>) the
# leading path back to the real repo stays visible without competing with the bold part.
[directory]
truncation_length = 4
style = "bold white"
repo_root_style = "bright-black"
read_only = " "

# ASCII throughout, for the same reason the statusline uses an '@' sigil: a nerd-font glyph is
# tofu over SSH and in any terminal without FiraCode. `symbol` is a bare space, NOT starship's
# default branch glyph. No leading space: the `directory` module already trails one.
[git_branch]
symbol = " "
style = "blue"
format = '[\[](bright-black)[$symbol$branch]($style)[\]](bright-black)'

[git_state]
format = '[\[](bright-black)[$state]($style)[\]](bright-black)'

# Per-state glyphs colored to match the statusline's counters. The whole chip vanishes on a
# clean tree.
[git_status]
format = '([\[](bright-black)$conflicted$staged$modified$deleted$renamed$untracked$stashed$ahead_behind[\]](bright-black))'
conflicted = '[~$count](bold red)'
staged     = '[+$count](green)'
modified   = '[!$count](yellow)'
deleted    = '[-$count](red)'
renamed    = '[»$count](purple)'
untracked  = '[?$count](cyan)'
stashed    = '[*$count](purple)'
# ASCII, so ahead/behind survive a terminal without arrow glyphs; every other counter already
# carries a sigil. These three are OPTIONS consumed through the `$ahead_behind` VARIABLE in the
# format string: there is no `$ahead`, `$behind` or `$diverged` there, and an unmapped name
# renders as the empty string with no warning.
ahead      = '[^$count](green)'
behind     = '[v$count](red)'
diverged   = '[^$ahead_count](green)[v$behind_count](red)'

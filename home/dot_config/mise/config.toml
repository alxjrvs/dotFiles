# The runtimes; a project pins its own in its own mise.toml, and the CLIs are Brewfile formulae.
# `latest` is the decision: nothing here is pinned, and `mise upgrade` upgrades.
[settings]
# Client repos pin with .ruby-version and .nvmrc, which mise stopped reading in 2025.10.0. Python
# pins are uv's.
idiomatic_version_file_enable_tools = ["node", "ruby"]
# A week-old release, the cooldown Dependabot keeps, so a compromised release is caught first.
minimum_release_age = "7d"

[tools]
node = "lts"
# A shim for a client repo's .ruby-version to resolve through; without one, ruby is /usr/bin's.
ruby = "latest"
bun = "latest"
# Python and `uvx`, which many MCP servers launch with.
uv = "latest"

# What apply never does, run nightly by the upkeep LaunchAgent: each upgrade, then the converge.
# One that fails stops neither the rest nor the converge, and still fails the run into its issue.
# Apps that update themselves are left to it, and no running app is quit.
[tasks."upkeep:chezmoi"]
hide = true
run = "chezmoi upgrade"

[tasks."upkeep:mise"]
hide = true
# mise itself waits out the same week as its tools. Formulae and chezmoi ride homebrew-core's
# review and chezmoi's own releases, with no age gate.
run = ["mise self-update \"$(mise latest aqua:jdx/mise)\" --yes", "mise upgrade --yes"]

[tasks."upkeep:gh"]
hide = true
run = "gh extension upgrade --all"

[tasks."upkeep:brew"]
hide = true
run = [
  "brew update --quiet",
  "HOMEBREW_NO_UPGRADE_AUTO_UPDATES_CASKS=1 brew upgrade --no-quit --quiet",
  # A formula installed by hand is drift, removed on a personal Mac. stdin is closed: an
  # uninstaller may prompt.
  "if chezmoi data | jq -e '.personal != false' > /dev/null; then brew bundle cleanup --force --file=$HOME/.config/homebrew/Brewfile < /dev/null; fi",
]

[tasks.upkeep]
description = "Upgrade chezmoi, mise, its tools, gh extensions, formulae and casks, then converge"
run = """
failed=
for task in upkeep:chezmoi upkeep:mise upkeep:gh upkeep:brew; do
  mise run "$task" || failed="$failed $task"
done
source=$(chezmoi source-path)
# Never a main whose lint did not pass on Actions. A file edited by hand is skipped and fails the
# run by name, and everything else lands; --init re-renders a changed .chezmoi.toml.tmpl.
(cd "$source" && ../.github/main-green.sh) && chezmoi update --init --keep-going --no-tty ||
  failed="$failed converge"
# main's own linter pins, installed here outside the sandbox, so an agent's `mise run lint` runs.
mise -C "$source/.." install --yes || failed="$failed pins"
# Results, not files: every gated repo still matches gate.sh, and drift names its `!` fix.
chezmoi data | jq -r '.github, .ownedOrgs[]' | xargs "$source/../.github/gate.sh" --check ||
  failed="$failed gate"
[ -z "$failed" ] || { echo "upkeep failed:$failed" >&2 && exit 1; }
"""

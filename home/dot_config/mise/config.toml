# Every CLI and runtime; a project pins its own in its own mise.toml. `latest` is the decision:
# nothing here is pinned, and `mise upgrade` upgrades.
[tools]
node = "lts"
bun = "latest"
# Python and `uvx`, which many MCP servers launch with.
uv = "latest"

# Shell
atuin = "latest"
fzf = "latest"
starship = "latest"
zoxide = "latest"

# Git
gh = "latest"
delta = "latest"

# Files and text
bat = "latest"
fd = "latest"
jq = "latest"
ripgrep = "latest"
tealdeer = "latest"

# Editor
neovim = "latest"

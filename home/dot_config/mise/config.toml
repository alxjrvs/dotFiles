# ~/.config/mise/config.toml: every CLI and runtime, on every machine. A Mac's apps are
# Brewfile casks; a project pins its own versions in its own mise file. `mise upgrade` upgrades:
# `latest` is the decision, nothing here is pinned, and drift between the two hosts is accepted.
[tools]
node = "lts"
bun = "latest"

# Shell
atuin = "latest"
fzf = "latest"
starship = "latest"
zoxide = "latest"

# Git
gh = "latest"
delta = "latest"
lefthook = "latest"

# Files and text
bat = "latest"
eza = "latest"
fd = "latest"
jq = "latest"
ripgrep = "latest"
tealdeer = "latest"

# Editor, and the two linters CI runs
neovim = "latest"
shellcheck = "latest"
shfmt = "latest"

# What projects under ~/Code invoke; nvim reads none of them, its rule above still holds.
# marksman is one markdown LSP in one project's editor config and nothing here calls it:
# the next reader to confirm that is the one who deletes the line.
biome = "latest"
taplo = "latest"
marksman = "latest"

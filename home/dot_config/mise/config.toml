# ~/.config/mise/config.toml: every CLI and runtime, on every machine. A Mac's apps are
# Brewfile casks; a project pins its own versions in its own mise file. `mise upgrade` upgrades.
[tools]
node = "lts"
bun = "latest"

# Shell
atuin = "latest"
fzf = "latest"
starship = "latest"
zoxide = "latest"

# Git
gh = "latest"
delta = "latest"

# Files and text
bat = "latest"
eza = "latest"
fd = "latest"
jq = "latest"
ripgrep = "latest"

# Editor, and the two linters CI runs
neovim = "latest"
shellcheck = "latest"
shfmt = "latest"

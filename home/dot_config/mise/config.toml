# ~/.config/mise/config.toml: language toolchains and every dev CLI (the brew/mise split is
# CLAUDE.md's; the Brewfile header holds the upgrade doctrine). Exact pins keep every Mac
# identical; `mise upgrade --bump` moves them, in one commit, when you choose.
#
# ~/.zprofile puts `~/.local/share/mise/shims` on PATH for every login shell (scripts and git
# hooks included); ~/.zshrc runs `mise activate` for interactive ones. CI reads this same file
# through MISE_GLOBAL_CONFIG_FILE.
#
# Resolution order: registry short-name first (verified with `mise registry <name>`); fall
# back to `aqua:owner/repo`, then `github:`/`cargo:`/`npm:`, when the registry does not cover
# a tool or its alias is broken.

[tools]
# Only tools worth installing globally on every machine live here. Anything situational is
# `mise use <tool>` in that project.

# ── Language toolchains ───────────────────────────────────────────────
node = "25.9.0"
bun = "1.4.0"

# ── Shell-init-time tools (need PATH presence before ~/.zshrc runs) ──
atuin = "18.16.1"       # shell history sync
fzf = "0.73.1"          # `fzf --zsh` integration
zoxide = "0.9.9"        # frecency `cd`
starship = "1.25.1"     # prompt

# ── Git surface (used by prompt, lefthook, pre-commit) ────────────────
gh = "2.94.0"           # GH CLI
"aqua:github/github-mcp-server" = "1.7.0" # GitHub MCP server for Claude Code; registered by run_after_50-provision.sh
delta = "0.19.2"        # syntax-aware git pager
gitleaks = "8.30.1"     # `gitleaks git --staged` in lefthook and CI
lefthook = "2.1.9"      # repo-local pre-commit runner

# ── File / text / data tools ──────────────────────────────────────────
bat = "0.26.1"
fd = "10.4.2"
ripgrep = "15.1.0"
jq = "1.8.1"
eza = "0.23.4"
"aqua:dbrgn/tealdeer" = "1.8.1"           # fast `tldr` cheatsheets (binary: tldr)

# ── Linters / formatters ─────────────────────────────────────────────
shfmt = "3.13.1"
shellcheck = "0.11.0"
biome = "2.5.3"                           # JS/TS/JSON linter+formatter (lefthook + CI + nvim)
actionlint = "1.7.12"                     # GitHub Actions workflow linter (lefthook + CI)

# ── Neovim language servers (nvim/init.lua wires these in) ────────────
# rust-analyzer is not global: it comes with a per-project `rust` toolchain.
"npm:bash-language-server" = "5.6.0"
"npm:typescript-language-server" = "5.3.0"
"aqua:artempyanykh/marksman" = "2026-02-08" # markdown LSP (date-versioned upstream)
taplo = "0.10.0"                          # TOML LSP + formatter; registry alias → aqua:tamasfe/taplo (no -cli suffix)

# ── Editor ────────────────────────────────────────────────────────────
neovim = "0.12.3"                         # modal editor (binary: nvim)

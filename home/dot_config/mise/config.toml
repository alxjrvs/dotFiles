# ~/.config/mise/config.toml: every CLI and runtime, on every machine. A Mac's apps are
# Brewfile casks; a project pins its own tools in its own mise.toml, this repo's linters
# included. `mise upgrade` upgrades: `latest` is the decision, nothing here is pinned, and drift
# between the two hosts is accepted.
[tools]
node = "lts"
bun = "latest"
# Python and `uvx`, which many MCP servers launch with.
uv = "latest"

# Shell
atuin = "latest"
fzf = "latest"
starship = "latest"
zoxide = "latest"

# Git
gh = "latest"
delta = "latest"

# Files and text
ast-grep = "latest"
bat = "latest"
eza = "latest"
fd = "latest"
jq = "latest"
ripgrep = "latest"
tealdeer = "latest"

# Editor
neovim = "latest"

# Every CLI and runtime; a project pins its own in its own mise.toml. `latest` is the decision:
# nothing here is pinned, and `mise upgrade` upgrades.
[settings]
# Client repos pin with .ruby-version and .nvmrc, which mise stopped reading in 2025.10.0. Python
# pins are uv's.
idiomatic_version_file_enable_tools = ["node", "ruby"]

[tools]
node = "lts"
bun = "latest"
# Python and `uvx`, which many MCP servers launch with.
uv = "latest"

# Shell
atuin = "latest"
fzf = "latest"
starship = "latest"
zoxide = "latest"

# Git
gh = "latest"
delta = "latest"

# Files and text
bat = "latest"
fd = "latest"
jq = "latest"
ripgrep = "latest"
tealdeer = "latest"

# Editor
neovim = "latest"

# What apply never does, run nightly by the upkeep LaunchAgent: converge, then upgrade. Casks stay
# by hand, because a cask upgrade quits the running app.
[tasks.upkeep]
description = "Converge to main, then upgrade chezmoi, mise, its tools, gh extensions and formulae"
run = [
  # Drift is reported, never overwritten.
  "chezmoi verify || { chezmoi diff --no-pager; exit 1; }",
  "chezmoi update --force",
  "chezmoi upgrade",
  "mise self-update --yes",
  "mise upgrade --yes",
  "gh extension upgrade --all",
  "brew update --quiet",
  "brew upgrade --formula --quiet",
]

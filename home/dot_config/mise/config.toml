# The runtimes; a project pins its own with mise.toml or an idiomatic file, and the CLIs are
# Brewfile formulae. `latest` is the decision: nothing here is pinned, and `mise upgrade` upgrades.
[settings]
# Repos pin with .ruby-version, .nvmrc and .bun-version, which mise stopped reading in 2025.10.0.
# Python pins are uv's.
idiomatic_version_file_enable_tools = ["node", "ruby", "bun"]
# Precompiled rubies only: a source build links Homebrew kegs that brew cleanup later removes.
ruby.compile = false
# A week-old release, the cooldown Dependabot keeps, so a compromised release is caught first.
minimum_release_age = "7d"

[tools]
node = "lts"
# A shim for a client repo's .ruby-version to resolve through; without one, ruby is /usr/bin's.
ruby = "latest"
bun = "latest"
# Python and `uvx`, which many MCP servers launch with.
uv = "latest"
# `tsc`, and with TypeScript 7 its `tsc --lsp`, the language server the ts-native skills-directory
# plugin (~/.claude/skills/ts-native) runs for every repo's TS and JS edits.
"npm:typescript" = "latest"
# chezmoi's installer bootstraps it into ~/.local/bin; from the first apply on, this copy, checked
# by aqua's signature and held the week like every other tool, is the only one (.chezmoiremove
# deletes the bootstrap copy) and `mise upgrade` moves it.
chezmoi = "latest"

# What apply never does, run nightly by the upkeep LaunchAgent (on CachyOS, its systemd timer):
# each upgrade. One that fails stops none of the rest, and still fails the run. Apps that update
# themselves are left to it, and no running app is quit. Applying main stays `chezmoi update`, run by hand: nothing lands unattended.
[tasks."upkeep:mise"]
hide = true
# mise itself waits out the same week as its tools, chezmoi among them. Formulae ride
# homebrew-core's review, with no age gate.
# --no-plugins: a self-update otherwise git-pulls every plugin, a retired one included.
# reshim: a shim left by a retired tool shadows Homebrew's binary of the same name (a dead `gh`
# shim failed the bottle attestation check, every night from 2026-10-07).
run = ["mise self-update \"$(mise latest aqua:jdx/mise)\" --yes --no-plugins", "mise upgrade --yes", "mise reshim"]

# Upgrades what the Brewfile names and nothing else, uninstalling nothing. No running app is quit,
# and stdin is closed: a cask may prompt.
[tasks."upkeep:brew"]
hide = true
run = [
  "brew update --quiet",
  # Bottles must carry their build attestation.
  "HOMEBREW_VERIFY_ATTESTATIONS=1 HOMEBREW_NO_UPGRADE_AUTO_UPDATES_CASKS=1 HOMEBREW_NO_UPGRADE_QUIT_CASKS=1 brew bundle upgrade --quiet --file=$HOME/.config/homebrew/Brewfile < /dev/null",
  # gcloud's cask updates itself only through its own command, which the cask upgrade skips. The one
  # upgrade without the week's hold: gcloud's updater has no age gate.
  "if command -v gcloud > /dev/null; then gcloud components update --quiet; fi",
]

[tasks.upkeep]
description = "Upgrade mise and its tools (chezmoi among them), formulae and casks"
run = """
failed=
tasks=upkeep:mise
# Homebrew is the Mac's; CachyOS's packages upgrade through its own `pacman -Syu`.
[ "$(uname -s)" != Darwin ] || tasks="$tasks upkeep:brew"
for task in $tasks; do
  mise run "$task" || failed="$failed $task"
done
[ -z "$failed" ] || { echo "upkeep failed:$failed" >&2 && exit 1; }
"""

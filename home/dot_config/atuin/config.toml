# Atuin: only divergences from defaults. https://docs.atuin.sh/configuration/config/

keymap_mode = "vim-normal"
style = "compact"
inline_height = 20
# Scope search to the current repo; the daemon's in-memory index keeps that cheap.
workspaces = true
search_mode = "daemon-fuzzy"

# Drop typed secrets before they are stored: zsh's HIST_IGNORE_SPACE does not reach atuin's
# hook, and the default secrets_filter misses the `key: value` form. Top-level, not [history].
history_filter = [
  "(?i)(password|secret|token|apikey|api[_-]?key|pat)\\s*[:=]\\s*\\S+",
  "gh[oprsu]_[A-Za-z0-9]{20,}",
  "sk-[A-Za-z0-9_-]{20,}",
  "AKIA[0-9A-Z]{16}",
]

[daemon]
enabled = true
autostart = true

# Atuin: only divergences from defaults. https://docs.atuin.sh/configuration/config/

# Search opens in the vi mode Ctrl-R was pressed from.
keymap_mode = "auto"
# Enter runs the pick, Tab edits it. The code default is false; the sample file only seeds installs.
enter_accept = true
inline_height = 20
# Adds the current repo to the filter modes Ctrl-R cycles through.
workspaces = true

# secrets_filter (default on) already drops known token formats (GitHub, AWS, Slack, Stripe,
# npm, ...); these are the three it misses: the generic `key: value` form, sk- (OpenAI, Anthropic)
# keys and ops_ (1Password service-account) tokens. Top-level, not [history].
history_filter = [
  "(?i)(password|secret|token|apikey|api[_-]?key)\\s*[:=]\\s*\\S+",
  "\\bsk-[A-Za-z0-9_-]{20,}",
  "\\bops_[A-Za-z0-9_-]{20,}",
]

# Atuin: only divergences from defaults. https://docs.atuin.sh/configuration/config/

keymap_mode = "vim-normal"
inline_height = 20
# Adds the current repo to the filter modes Ctrl-R cycles through.
workspaces = true

# secrets_filter (default on) already drops known token formats (GitHub, AWS, Slack, Stripe,
# npm, ...); these are the two it misses: the generic `key: value` form and sk- (OpenAI,
# Anthropic) keys. Top-level, not [history].
history_filter = [
  "(?i)(password|secret|token|apikey|api[_-]?key)\\s*[:=]\\s*\\S+",
  "sk-[A-Za-z0-9_-]{20,}",
]

# Who this machine is: a fork edits this file and nothing else. Every key is required.
name = "alxjrvs"
email = "alxjrvs@gmail.com"
# GitHub: the user, and the organizations they administer. Agents treat repositories under
# either as the user's own source control (autoMode.environment).
github = "alxjrvs"
ownedOrgs = ["RANDSUM", "SalvageUnion-io", "BinfiniteLLC", "EmpokNor", "ThirdShap"]
# Commits sign with an SSH key held in 1Password: its public half, and the item that holds it.
signingKey = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKjF9JmW396EbH0n1zWeU7eT+2VvMFZAn+A1WKAi4tqT"
signingItem = { item = "GitHubSSH", vault = "Private" }
# GitHub orgs whose repos commit as workEmail (~/.config/git/work); every other repo commits as
# email. Adding an org is one entry here; workEmail may equal email.
workOrgs = ["Criterium-Engineers", "massgov-eotss", "TheGnarCo"]
workEmail = "alex@thegnar.co"
# Claude desktop accounts beyond the one the stock app holds, until Claude desktop signs in to
# several itself. Each becomes "~/Applications/Claude <name>.app", its icon the stock one with the
# hue turned `hue` degrees and the saturation times `saturation`. One account: [].
claudeProfiles = [{ name = "Binfinite", hue = -21, saturation = 1.3 }]

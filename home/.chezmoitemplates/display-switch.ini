{{- $usb := dig "maia" "dockUsb" "" . -}}
{{- $usbc := dig "maia" "usbcInput" "" . -}}
; display-switch (github.com/haimgel/display-switch): the BenQ GW3290QT follows the CalDigit TS4.
; The dock on this PC means the PC's input, DisplayPort (0x0f); the dock gone means a laptop has it,
; on USB-C. Both measured values live in ~/.config/chezmoi/chezmoi.toml's [data.maia] (MAIA.md).
{{- if $usb }}
usb_device = "{{ $usb }}"
{{- else }}
; usb_device waits for maia.dockUsb: `lsusb -d 2188:` lists the TS4's devices (vendor 2188).
{{- end }}
on_usb_connect = 0x0f
{{- if $usbc }}
on_usb_disconnect = {{ $usbc }}
{{- else }}
; on_usb_disconnect waits for maia.usbcInput, the USB-C input's code (likely 0x10 or 0x1b, unmeasured).
{{- end }}

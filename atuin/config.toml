# Atuin — minimal overrides. Everything else is upstream defaults.
# Full reference: https://docs.atuin.sh/configuration/config/

# Enter executes the selected line immediately (tab keeps the old "place in
# prompt for editing" behavior).

# Match the shell's vi-mode (zsh `bindkey -v`).
keymap_mode = "vim-normal"

# Compact rendering — less screen-takeover than the default full TUI.
style = "compact"
inline_height = 20

# Up arrow scopes to the current shell session (Ctrl-R stays full-history
# fuzzy). Matches muscle memory: "what did I just run" vs "what have I
# ever run".
filter_mode_shell_up_key_binding = "session"

# Scope history search/cycling to the current repo (git root) rather than
# globally — most Ctrl-R recall is "what did I run in this project".
workspaces = true

# Fuzzy search served from the daemon's in-memory index (nucleo — fzf's algorithm) instead of
# querying SQLite per keystroke. Landed in 18.13; installed here is 18.16.1.
#
# It was experimental at 18.3, which is the state most write-ups still describe — the 18.18
# config reference documents `[daemon]` as a standard section with no experimental disclaimer,
# so that caveat is stale rather than current.
#
# Justified against THIS setup rather than in general: `workspaces = true` above scopes recall
# per git root, and this machine accumulates a lot of them (every agent worktree is its own),
# so the query pattern is exactly the repeated scoped search a hot index accelerates. It also
# removes the per-command sync fork, ~40 ms of the measured ~250 ms shell startup.
search_mode = "daemon-fuzzy"

[daemon]
enabled = true
autostart = true

[sync]
# Atuin sync v2 (encrypted record sync). Required for cross-machine history.

[history]
# Drop accidentally-typed secrets BEFORE they're stored / synced. zsh's
# HIST_IGNORE_SPACE doesn't propagate to atuin's preexec hook.
secret_filters = [
  "(?i)(password|secret|token|apikey|api[_-]?key|pat)\\s*[:=]\\s*\\S+",
  "gh[oprsu]_[A-Za-z0-9]{20,}",
  "sk-[A-Za-z0-9_-]{20,}",
  "AKIA[0-9A-Z]{16}",
]

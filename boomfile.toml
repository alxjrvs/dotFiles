# boom's own self-wiring, folded into the reconcile it already runs (boom >= 0.14.0) —
# so these stop being hand-rolled `run`/plist steps below:
#   - skill_on_sync: regenerate ~/.claude/skills/boom/SKILL.md from the running binary each
#     sync, so the self-describing skill never lags a `boom upgrade` (replaces the
#     `boom skill --install` run step).
#   - upgrade_on_sync = "check": after a sync, warn (offline-safe, non-fatal) when a newer boom
#     ships — the exact stale-binary drift that let a 0.9.1 machine propagate renamed-away
#     command names before anyone noticed. ("auto" would self-upgrade instead of warning.)
#   - schedule: launchd timers running `boom <cmd>` on an interval. `code fetch` every 15m
#     `git fetch`es every ~/Code repo to keep origin/HEAD warm for agent worktree cuts
#     (replaces the agent-fetch plist + section). One array — any boom command can be scheduled.
[boom]
skill_on_sync = true
upgrade_on_sync = "check"
# Desktop-notify (macOS osascript) when a scheduled `boom verify` finds drift, so the
# boom-verify launchd timer's signal surfaces instead of dying in its log. (needs boom >= 0.17.0)
notify = true
# `code reap --push` daily, as a BACKSTOP to the publish-at-idle hook (see the end of this
# comment): Claude Code keeps an agent worktree whenever a commit reachable from
# HEAD is on no remote-tracking ref, and refuses to remove it ("Worktree kept at … — has commits
# that are not pushed anywhere") — which is what stops a finished subagent from being closed.
# Measured against 2.1.237 rather than inferred from the message: the client's check (`deleteJob`,
# gated on `rev-list --max-count=1 HEAD --not --remotes`) does carry a second, content-based escape
# — every commit patch-id-matching `origin/<default>` — but that escape is gated on the branch's
# upstream reading exactly `gone`, and an agent worktree is cut `--no-track`, so it has no upstream
# at all and the escape can never fire. Hence a squash-merged branch stays blocked even though its
# content landed. `force` does NOT help: it bypasses the `dirty` arm only, and there is no setting,
# keystroke or discard path for the unpushed arm — so the condition can only be falsified, never
# waived. That is the whole reason this timer exists.
#   `code reap` falsifies it correctly, and is smarter than the client: it re-decides by content
# (git patch-id), reads `gh stack` topology, and removes only clean, unlocked,
# already-merged-or-pushed worktrees, always leaving the branch ref — so it cannot lose a commit.
# Neither can the client, whose removal is `git worktree remove` semantics; the commits stay
# reachable in the clone either way, so this guard is refusing a delete to prevent a loss that
# would not actually happen here. `--push` covers the rest: a clean worktree whose commits exist
# nowhere but this machine is published first (never forced), so nothing is ever stuck
# un-closeable. It is outward-facing — those branches land on origin, including org repos — which
# is the deliberate trade for "closing a session is never blocked". Dirty trees, live sessions and
# detached HEADs are never pushed, and a stacked worktree is left for `gh stack submit`.
#   DAILY, and deliberately back to daily (it was briefly 1h on 2026-08-20). Tightening the sweep
# was the wrong axis: a sweep answers "eventually", and the actual requirement is "the delete I
# press right now must not be refused", which no interval satisfies — at 1h the wall still gets
# hit by hand, just less often, in exchange for 24x the background pushes. That requirement is met
# at its source instead, by `dot-claude/hooks/worktree-publish.sh`, which publishes a worktree's
# branch the moment its agent goes idle. So this timer is no longer the mechanism, it is the
# BACKSTOP — it covers exactly what the hook deliberately skips: stacked worktrees (which want
# `gh stack submit`), branches whose push was rejected or offline at idle, and worktrees left
# behind by sessions that predate the hook. Daily is the right cadence for a backstop, and each
# run walks every repo's worktrees in ~30s.
schedule = [
  { cmd = "code fetch", every = "15m" },
  # NOT "1d" — boom's schema accepts only s/m/h or a bare seconds count, so "1d" failed
  # validation and this timer never ran at all from the day it was added.
  { cmd = "code reap --push", every = "24h" },
]

[[section]]
name = "Shell + git"

[[section.link]]
src = ".zshrc"
dst = "~/.zshrc"

[[section.link]]
src = ".zprofile"
dst = "~/.zprofile"

[[section.link]]
src = ".zshenv"
dst = "~/.zshenv"

[[section.link]]
src = ".hushlogin"
dst = "~/.hushlogin"

[[section.link]]
src = ".gitconfig"
dst = "~/.gitconfig"

[[section.link]]
src = ".gitmessage"
dst = "~/.gitmessage"

# Global git excludes → git's XDG default. ONLY universal machine/editor
# cruft; repo-specific ignores live in each project's own .gitignore. (This
# used to be a `.gitignore → ~/.gitignore` link doubling as core.excludesfile,
# which leaked this repo's `.claude/` etc. into every repo on the machine.)
[[section.link]]
src = "git/ignore"
dst = "~/.config/git/ignore"

[[section.link]]
src = ".editorconfig"
dst = "~/.editorconfig"

[[section.link]]
src = ".ripgreprc"
dst = "~/.ripgreprc"

[[section.link]]
src = ".fdignore"
dst = "~/.fdignore"

# npm userconfig → its canonical native location (`npm config get userconfig` is
# ~/.npmrc; npm does NOT use XDG ~/.config/npm for the userconfig). Preferences
# only; the registry token is `${NPM_TOKEN}`, expanded by npm at read time and
# supplied on demand via `op run -- npm publish` — never plaintext in git.
[[section.link]]
src = "npm/npmrc"
dst = "~/.npmrc"

[[section.link]]
src = "git-template/hooks/pre-commit"
dst = "~/.config/git/template/hooks/pre-commit"

[[section]]
name = "SSH"

[[section.link]]
src = "ssh/config"
dst = "~/.ssh/config"
mode = "600"

[[section.link]]
src = "ssh/1password-agent.toml"
dst = "~/.config/1Password/ssh/agent.toml"

[[section]]
name = "Tools"

[[section.link]]
src = "mise.toml"
dst = "~/.config/mise/config.toml"

[[section.link]]
src = "mise-settings.toml"
dst = "~/.config/mise/conf.d/settings.toml"

# The lockfile, and this link is what makes it count. mise resolves a lockfile against the
# *config root*, which for the global config is ~/.config/mise/ — not this repo, because
# ~/.config/mise/config.toml is a symlink INTO the repo rather than the repo itself. Without
# this link, `lockfile = true` would happily maintain ~/.config/mise/mise.lock outside version
# control and the pinning would never actually be committed: the feature would look enabled and
# land nothing.
#
# Linked rather than copied so mise's own updates write through into the repo, keeping the
# committed lockfile current instead of immediately stale.
[[section.link]]
src = "mise.lock"
dst = "~/.config/mise/mise.lock"

[[section.link]]
src = "sheldon/plugins.toml"
dst = "~/.config/sheldon/plugins.toml"

[[section.link]]
src = "starship.toml"
dst = "~/.config/starship.toml"

[[section.link]]
src = "ghostty/config"
dst = "~/.config/ghostty/config"

[[section.link]]
src = "bat/config"
dst = "~/.config/bat/config"

[[section.link]]
src = "atuin/config.toml"
dst = "~/.config/atuin/config.toml"

[[section.link]]
src = "gh/config.yml"
dst = "~/.config/gh/config.yml"

[[section.link]]
src = "nvim/init.lua"
dst = "~/.config/nvim/init.lua"

[[section]]
name = "Claude"

[[section.link]]
src = "dot-claude/CLAUDE.md"
dst = "~/.claude/CLAUDE.md"

[[section.link]]
src = "dot-claude/settings.json"
dst = "~/.claude/settings.json"

# Shared parsing for both PreToolUse guards (quote-aware command splitting, token
# normalization). LOAD-BEARING: each guard sources it as
# `$(dirname "$0")/guard-lib.sh`, so if this link is missing they both fail OPEN
# and every push/checkout sails through. It must sit in the same directory as
# them. Not executable — it is sourced, never run.
[[section.link]]
src = "dot-claude/hooks/guard-lib.sh"
dst = "~/.claude/hooks/guard-lib.sh"

# PreToolUse guard referenced by settings.json `hooks.PreToolUse`: blocks an
# agent's `git push` / `gh pr create` when its branch is behind origin/HEAD, so
# it rebases onto the latest target before publishing. Logic lives in a script
# (not an inline settings.json string) because it parses stdin, fetches, and
# emits a deny-JSON verdict — too much for a legible one-liner.
[[section.link]]
src = "dot-claude/hooks/rebase-guard.sh"
dst = "~/.claude/hooks/rebase-guard.sh"
mode = "755"

# PreToolUse guard (runs before rebase-guard): blocks `git checkout/switch
# <default>` from inside a linked worktree, where it fails "'<default>' is already
# used by worktree". The single highest-frequency mechanical crash agents hit.
[[section.link]]
src = "dot-claude/hooks/worktree-checkout-guard.sh"
dst = "~/.claude/hooks/worktree-checkout-guard.sh"
mode = "755"

# PreToolUse guard (runs FIRST): the allow-list that makes `op` usable by agents.
# LOAD-BEARING, and in a way the other two guards are not. `permissions.allow`
# carries `Bash(op run:*)`, which pre-approves the shape this guard is what keeps
# safe — it denies `--no-masking`, a `--`-less invocation, and an env-dumping or
# `git`/`gh` child before the permission system is ever consulted. If this link
# goes missing, that pre-approval is left standing on its own.
#
# That is why it is a LINK and not a copy, and why `boom verify` is the backstop:
# an absent symlink is drift boom reports, so "the guard is gone" is a detected
# state rather than a silent one. Do not add `Bash(op run:*)` to `allow` anywhere
# this guard is not also installed.
[[section.link]]
src = "dot-claude/hooks/op-guard.sh"
dst = "~/.claude/hooks/op-guard.sh"
mode = "755"

# PostToolUse hook: after `gh pr create` / `git push`, run the adversarial review
# locally (subscription-covered, unlike an agent in GitHub Actions) and post it as
# a PR review. No commit status — it is advisory, no ruleset ever required it, and
# a check that cannot fail a merge only dilutes the checks list.
# Backgrounds itself so it can never block a turn.
[[section.link]]
src = "dot-claude/hooks/pr-review.sh"
dst = "~/.claude/hooks/pr-review.sh"
mode = "755"

# The reviewer's confinement boundary, loaded via `claude --settings`. It must sit
# beside pr-review.sh, which resolves it as `$(dirname "$0")/pr-review-settings.json`.
# `--allowedTools` alone does NOT confine (measured: it is additive pre-approval,
# so anything unlisted falls to the auto-mode classifier and runs). A bare tool
# name in `permissions.deny` does — deny is evaluated first, survives `auto`, and
# removes the tool from the model's context entirely.
[[section.link]]
src = "dot-claude/hooks/pr-review-settings.json"
dst = "~/.claude/hooks/pr-review-settings.json"

# SessionStart/SubagentStart hook: start an agent on CURRENT code. The client's
# `worktree.baseRef: "fresh"` cuts from the local `origin/<default>` ref and only
# refreshes it when .git/FETCH_HEAD is more than 24h old, so an agent can silently
# branch from a day-old base (measured against 2.1.237, both directions). This
# refreshes the ref in the primary checkout and fast-forwards a virgin worktree
# onto it. Unlike the PreToolUse guards it decides nothing — it only ever runs
# `git merge --ff-only`, so it cannot discard a commit.
[[section.link]]
src = "dot-claude/hooks/worktree-freshness.sh"
dst = "~/.claude/hooks/worktree-freshness.sh"
mode = "755"

# Stop/SessionEnd hook: publish an agent worktree's branch so DELETING the session
# is never refused. `deleteJob` keeps a worktree whenever a commit reachable from
# HEAD is on no remote-tracking ref, and its one content-based escape (patch-id vs
# origin/<default>) is gated on the branch's upstream reading exactly `gone` — which
# a `--no-track` agent branch has no upstream to ever satisfy. `force` bypasses the
# `dirty` arm only, never this one, and no setting or keystroke waives it, so the
# condition can only be falsified. There is also no hook ON the delete path:
# `WorktreeRemove` is dispatched from inside `removeAgentWorktree`, which is reached
# only AFTER the unpushed check has already refused. So the push has to be in place
# beforehand, and idle is the last moment that is true. Never forced, never the
# default branch, never a stack (that is `gh stack submit`'s job).
[[section.link]]
src = "dot-claude/hooks/worktree-publish.sh"
dst = "~/.claude/hooks/worktree-publish.sh"
mode = "755"

# Regression suite for the three PreToolUse guards. Linked so it can be run on the
# machine, not just in CI; `mode` keeps the runner executable.
[[section.link]]
src = "dot-claude/hooks/tests/run.sh"
dst = "~/.claude/hooks/tests/run.sh"
mode = "755"

[[section.link]]
src = "dot-claude/hooks/tests/cases.tsv"
dst = "~/.claude/hooks/tests/cases.tsv"

# worktree-freshness.sh's own suite. Separate from run.sh because that harness
# asserts on a PreToolUse `permissionDecision`; this hook mutates a worktree, so
# the assertion is which commit HEAD lands on.
[[section.link]]
src = "dot-claude/hooks/tests/freshness.sh"
dst = "~/.claude/hooks/tests/freshness.sh"
mode = "755"

# worktree-publish.sh's own suite, separate for the same reason: it asserts on which
# refs exist on a bare origin afterwards, which is neither a `permissionDecision`
# nor a HEAD commit. 9 of its 12 cases are "must NOT push", which a do-nothing hook
# passes trivially — `publishes_unpushed` is the load-bearing one, and the header
# records the negative control that proves the harness discriminates.
[[section.link]]
src = "dot-claude/hooks/tests/publish.sh"
dst = "~/.claude/hooks/tests/publish.sh"
mode = "755"

# Standing prompt for a bare `/loop`. `.claude/loop.md` is a real Claude Code
# config surface (the binary carries `<<loop.md>>` sentinels), so versioning it
# here beats retyping the condition each session. It is byte-capped — the client
# warns "loop.md was truncated to N bytes. Keep the task list concise" — so this
# stays a short task list, never a second CLAUDE.md.
[[section.link]]
src = "dot-claude/loop.md"
dst = "~/.claude/loop.md"

# A glob `src` places every match under `dst` (a directory) — the old `glob` resource, now
# just a `link` whose src carries a wildcard (boom >= 0.14.0).
[[section.link]]
src = "dot-claude/skills/*"
dst = "~/.claude/skills/"

# Skill refresh moved to the top-level `[boom] skill_on_sync = true` — boom regenerates its
# own SKILL.md from the running binary each sync, no `run` step needed.

[[section.run]]
# Claude Code CLI via the official native installer (self-updating); never
# brew/npm, whose builds do not auto-update. Only installs when `claude` is
# missing; the CLI updates itself thereafter.
#
# The predicate is `unless` rather than hand-rolled into `cmd` (boom >= 0.22): a skipped step
# now says so in the report instead of a `||` short-circuit pretending to converge. `timeout`
# because this is a network fetch piped to a shell — reachable from an unattended sync, where a
# hang would block the whole reconcile with nobody watching.
on = "sync"
unless = "command -v claude >/dev/null 2>&1"
timeout = 180
cmd = "curl -fsSL https://claude.ai/install.sh | bash"

# The 1Password Environments MCP server, user-scoped. It ships INSIDE the desktop app
# (`/Applications/1Password.app/Contents/MacOS/1password-mcp`, a stdio server — verified by
# speaking a JSON-RPC `initialize` to it directly), so there is nothing to install and, unlike
# every other server here, nothing to authenticate: it takes no token, no `op://` ref and no
# `headersHelper`. `boom mcp add` is deliberately NOT used — it wraps its argument in
# `op run --env-file`, which is exactly wrong for a server whose whole design is that no secret
# ever passes through it.
#
# `unless` keys off the registration, not the binary, so this converges once and stays quiet.
# Registration lives in `~/.claude.json`, which nothing tracks — that is the same gap CLAUDE.md
# records for the project-scoped `github`/`render` servers ("neither is declared in the boomfile,
# so a fresh machine reproduces neither"). This step closes it for this one server.
[[section.run]]
on = "sync"
unless = '''test ! -x /Applications/1Password.app/Contents/MacOS/1password-mcp || jq -e '.mcpServers["1password"]' ~/.claude.json >/dev/null 2>&1'''
cmd = "claude mcp add --scope user 1password -- /Applications/1Password.app/Contents/MacOS/1password-mcp"

# A `run` bound to `on = "sync"` is invisible to `verify` BY CONSTRUCTION — the lesson the
# `gh extensions` section records after a hand-removed extension went unnoticed until the next
# sync silently reinstalled it. There is no boom package manager for MCP servers, so the
# sync step above cannot become a `pkg` entry; this is the verify half, hand-written.
#
# It asserts registration only. Health is already covered by the existing `claude mcp list`
# check — and note that server reports `✔ Connected` even with nobody at the keyboard, because
# its human approval gate is at TOOL-CALL time, per Environment, not at connect. That was
# measured before adopting it precisely because a server that needed auth to connect would have
# failed `boom verify` on every unattended nightly run.
[[section.run]]
on = "verify"
cmd = '''
[ -x /Applications/1Password.app/Contents/MacOS/1password-mcp ] || exit 0
jq -e '.mcpServers["1password"]' ~/.claude.json >/dev/null 2>&1 || { echo "1Password Environments MCP not registered (user scope) — boom source, or: claude mcp add --scope user 1password -- /Applications/1Password.app/Contents/MacOS/1password-mcp"; exit 1; }
'''

# The three settings.json guardrails below were escaping-heavy `grep`-in-a-`run` steps; they
# are now declarative `check` resources (boom >= 0.13.0), evaluated on `boom verify` and folded
# into its exit code + `--json` report. `missing_file = "skip"` preserves the old `|| exit 0`
# (an absent settings.json is not a failure). Note the Fable pattern is a JS regex (`\s`), not
# the POSIX `[[:space:]]` the grep used.

[[section.check]]
# CVE-2025-59536 class: the auto-approve MCP keys run .mcp.json commands before the trust
# dialog (pre-consent RCE). A prose rule isn't enforced; this is.
path = "~/.claude/settings.json"
absent = ["enableAllProjectMcpServers", "enabledMcpjsonServers"]
missing_file = "skip"
message = "forbidden auto-approve MCP key in ~/.claude/settings.json"

[[section.check]]
# Agent git auth must resolve the PAT through the single `op` primitive
# (`op-agent git-credential`), never a cached PAT via `osxkeychain`.
path = "~/.claude/settings.json"
present = ["op-agent git-credential"]
absent = ["osxkeychain"]
missing_file = "skip"
message = "agent git helper drifted off op-agent git-credential (or an osxkeychain cached-PAT regression) in ~/.claude/settings.json"

[[section.check]]
# No model pinned as the default, and Fable in particular is /model per-session only —
# `/model`'s "set as default" silently rewrites settings.json, so drift is caught here.
path = "~/.claude/settings.json"
absent = ['"model"\s*:\s*"[^"]*fable']
missing_file = "skip"
message = "Fable pinned as default model in ~/.claude/settings.json (Fable is /model per-session only)"

# The deny floor — the Bash path to a *resolved* secret, not just to `op`.
# `op-agent header` and `op-agent git-credential get` each print a live credential
# to stdout, and stdout is model context. `op-agent header` is the exact command
# that put a live PAT into a session transcript on 2026-07-25; that postmortem
# produced a prose rule ("never echo a secret") and no deny entry, so the command
# with a confirmed incident stayed reachable while `op-agent secret`, which never
# leaked, was blocked twice. This is that gap closed in enforcement.
#
# Until 2026-08-05 this array had NO assertion anywhere: it could be deleted
# wholesale and lefthook, CI and `boom verify` all stayed green. A floor with no
# regression test is not a floor.
#
# This was a `[[section.check]]` until 2026-08-08, and a check could not express
# the assertion that actually matters. `present` matches file CONTENT, so
# `"Bash(op:*)"` appearing anywhere satisfied it — moving an entry out of `deny`
# and into `allow` INVERTED the control while this check, lefthook and CI all
# stayed green. It also asserted only 3 of the 7 entries, leaving the keychain
# read, both `Read()` rules, and `Bash(~/.local/bin/op-agent:*)` (the path
# spelling this repo's own docs call the most likely to be copied) deletable with
# every gate green. `jq index` asserts membership of the deny ARRAY, and --arg
# passes each value as data rather than a pattern — which is what the regex
# escaping was working around. The `[ -f ]` guard preserves `missing_file = "skip"`.
[[section.run]]
on = "verify"
cmd = '''
f=~/.claude/settings.json
[ -f "$f" ] || exit 0
# The allow-list guard must be wired wherever `Bash(op run:*)` is pre-approved.
grep -q 'op-guard.sh' "$f" || { echo "op-guard PreToolUse hook not wired in ~/.claude/settings.json, but permissions.allow pre-approves Bash(op run:*)"; exit 1; }
for d in 'Bash(security find-generic-password:*)' 'Bash(op read:*)' 'Bash(op item get:*)' 'Bash(op document get:*)' 'Bash(op-agent:*)' 'Bash(~/.local/bin/op-agent:*)' 'Bash(git credential:*)' 'Read(~/.ssh/id_*)' 'Read(~/.aws/credentials)' 'Bash(*/op *)' 'Bash(*/op-agent *)'; do
  jq -e --arg d "$d" '.permissions.deny | index($d)' "$f" >/dev/null || { echo "secret-path deny floor: missing $d in .permissions.deny of ~/.claude/settings.json"; exit 1; }
done
'''

# An MCP server can die silently and stay dead. Two of three configured servers
# were failing to connect for an unknown period — spacebase (its resolver command
# word-split an op:// ref containing spaces) and github (same bug, so no auth
# header, so the client fell back to OAuth discovery and reported a misleading
# "dynamic client registration" error). Nothing surfaced either one; the only
# symptom was zero usage, which reads identically to "didn't need it". With
# `notify = true` this now desktop-notifies instead of dying in a log.
[[section.run]]
on = "verify"
# Retry before failing: MCP health is inherently flappy — remote servers 502 and
# stdio plugin servers cold-start — and back-to-back `boom verify` runs went green,
# red, green on servers that were all fine. This timer desktop-notifies, so a check
# that cries wolf is worse than no check: it trains you to ignore the alarm. Exits
# on the first clean read; only a fault that survives three reads is real.
#
# Matches `!` as well as `✘` (fixed 2026-08-08). `claude mcp list` reports a
# server needing re-auth as "! Needs authentication", not "✘", so a server that
# cannot answer at all passed this check silently — observed live on Google
# Calendar. Different symbol, same outcome: the server does not work.
#
# KNOWN LIMIT, do not read this check as broader than it is: `claude mcp list`
# reports the servers visible from the CWD. `github` and `render` are
# project-scoped to ~/Code/SU-SRD in ~/.claude.json, and the launchd job sets no
# WorkingDirectory, so this cannot see either of them — the two 1Password-wired
# servers whose silent breakage on 2026-07-25 is the reason this check exists.
# Fixing that means declaring them somewhere reproducible (they are in no
# boomfile today), not hardcoding a path here.
cmd = '''
for i in 1 2 3; do
  claude mcp list 2>&1 | grep -qE '✘|! Needs authentication' || exit 0
  sleep 3
done
claude mcp list 2>&1 | grep -E '✘|! Needs authentication'
echo 'an MCP server is failing to connect or needs authentication (3 consecutive checks)'
exit 1
'''

# `~/.claude/settings.json` symlinks into boom's own clone, so an uncommitted edit
# THERE is live on the machine while being invisible to both CI (which lints the
# repo's copy) and the checks above (which read the live symlink and so see the
# edit as normal). That is a local override layer the doctrine says does not
# exist. Fail while it is dirty.
[[section.run]]
on = "verify"
cmd = "git diff --quiet -- dot-claude/ || { echo 'live Claude config diverges from the committed contract (dirty boom config-repo)'; exit 1; }"

# `git maintenance` registers repos in ~/.gitconfig.local and installs three launchd agents
# (org.git-scm.git.{hourly,daily,weekly}) that run whether or not those paths still exist. Found
# pointing at /Users/jarvis/dotFiles and /Users/jarvis/Code/dotFiles — neither of which exists,
# a layout from before boom moved the clone into the state dir — so all three agents had been
# firing on schedule and exiting 1 every single time, for as long as they had been installed.
# The real config repo and every ~/Code repo got no maintenance at all.
#
# Exactly the failure class DECISIONS.md already has an incident for ("the scheduled boom verify
# has never run — 28 days, runs=0"): a job that is registered, fires, fails, and reports only
# into a log nobody reads. This asserts the general rule rather than the two paths, so the next
# time a repo is moved or removed it surfaces here instead of rotting.
#
# Verify-only: repointing maintenance is a human call (which repos deserve it), not something to
# repair automatically.
#
# Note the deliberate absence of `--global`. The keys live in ~/.gitconfig.local, pulled in by an
# `[include]` from ~/.gitconfig — and `git config --global --get-all` does NOT follow includes
# into other files, so it returns nothing here and the check would be permanently, silently
# green. Full resolution sees them. (Found the hard way: the first version of this check used
# --global and passed against a machine that was visibly broken.)
[[section.run]]
on = "verify"
timeout = 20
cmd = '''
missing=0
while IFS= read -r r; do
  [ -z "$r" ] && continue
  [ -d "$r" ] || { echo "git maintenance registered for a path that does not exist: $r"; missing=1; }
done <<< "$(git config --get-all maintenance.repo 2>/dev/null)"
[ "$missing" -eq 0 ] || { echo "fix with: git maintenance unregister --force <path>  (or repoint at a repo that exists)"; exit 1; }
'''

[[section]]
name = "zsh fragments"

[[section.link]]
src = "zsh/[0-9]*.zsh"
dst = "~/.config/zsh/"

[[section]]
name = "packages"
# One `pkg` array per manager (boom >= 0.14.0), replacing the old scalar `brewfile` +
# boolean `mise`. `brew` runs `brew bundle` over `file`; `mise` reads the repo's mise config.
pkg = [
  { manager = "brew", file = "Brewfile" },
  { manager = "mise" },
]

[[section]]
name = "gh extensions"

# MUST stay after the `packages` section — `gh` itself comes from mise, and sections run in
# file order, so a fresh machine has no `gh` on PATH until packages has run.
#
# Was four hand-rolled `gh extension list | grep -q <owner>/<ext> || gh extension install …`
# run steps, with a comment explaining that they were "imperative by necessity" because "boom
# has no `gh` pkg manager". boom gained one, so that is no longer true and they collapse to a
# declared list.
#
# The gain over the run steps is not just brevity: a `run` step bound to `on = "sync"` is
# invisible to `verify` by construction, so an extension removed by hand went unnoticed until
# the next sync silently reinstalled it. As a `pkg` entry, verify reports it missing.
pkg = [{ manager = "gh", file = "gh-extensions.txt" }]


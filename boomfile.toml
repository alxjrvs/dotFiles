[[section]]
name = "lefthook"

# `creates` guards the re-run: lefthook install rewrote .git/hooks on every single sync, which
# is harmless but dishonest — the report claimed work that was a no-op. The generated pre-commit
# hook is the artifact, so its existence is the predicate.
[[section.run]]
on = "sync"
creates = ".git/hooks/pre-commit"
timeout = 60
cmd = "lefthook install"

# The one uninstall binding worth adding. Nothing in this file bound `on = "uninstall"` at all,
# so a teardown left lefthook's generated .git/hooks behind, pointing at a lefthook that may no
# longer be installed. Safe and reversible: it removes generated hooks and nothing else.
#
# Deliberately NOT bound for the others, and the reasons are the point:
#   - `op-agent provision` — teardown would destroy a live 1Password service account. Automating
#     credential destruction is worse than leaving one behind; that is a human decision.
#   - the Claude CLI — self-updating and self-managing; boom did not install its updater.
#   - claude-desktop-mcp.sh — it MERGES a key into a file boom does not own, so a blind reversal
#     could clobber unrelated edits made since.
[[section.run]]
on = "uninstall"
timeout = 60
cmd = "lefthook uninstall || true"

[[section]]
name = "tldr cache"

# mise installs the `tldr` binary (packages section, earlier → on PATH
# here), but tealdeer ships no pages — `tldr <cmd>` errors until the archive is
# fetched once. Do it at sync time so a fresh machine is ready. `|| true` keeps
# an offline sync from failing on a non-critical cache; re-run with
# `boom source --only="tldr cache"` once networked.
# `|| true` stays: an offline sync must not fail on a non-critical cache (see above). Only a
# timeout is added — this is a network fetch reachable from an unattended sync.
[[section.run]]
on = "sync"
timeout = 120
cmd = "tldr --update || true"

[[section]]
name = "op-agent"

[[section.link]]
src = "hooks/op-agent.sh"
dst = "~/.local/bin/op-agent"

# No `unless`: op-agent.sh already short-circuits on `security find-generic-password`, so the
# predicate would duplicate logic that lives (correctly) with the thing it guards. Timeout only —
# provisioning talks to 1Password over the network.
[[section.run]]
on = "sync"
timeout = 120
cmd = "op-agent provision"

[[section.run]]
on = "verify"
timeout = 60
cmd = "op-agent status"

# Vault MEMBERSHIP is the only control that stays live on this setup, so it is
# asserted rather than described. Two 1Password facts force that:
#   - SA vault access is IMMUTABLE after creation, so scope can never be
#     tightened in place; only the vault's contents can change.
#   - Activity Log and service-account usage reports are Business/Teams only.
#     This is an Individual/Family account, so no per-item record of what the SA
#     read exists at all — a gap accepted deliberately on 2026-08-19.
# An item added to the vault without a commit is exactly the event the missing
# audit log would have reported; `agent-vault.txt` is how it gets reported.
# Relative path: boom runs verify steps from the config-repo root (same
# convention as the `git diff -- dot-claude/` check above).
# Advisory on tooling gaps, fails closed on real drift.
[[section.run]]
on = "verify"
timeout = 60
cmd = "op-agent audit agent-vault.txt"

# The two `headersHelper` MCP servers are declared in NO boomfile step, so a fresh
# machine reproduces neither, and `boom verify`'s `claude mcp list | grep ✘` check
# cannot see an ABSENT server — only a configured-and-failing one. They are also
# project-scoped (to ~/Code/SU-SRD), so they are invisible from any other CWD.
# Reading ~/.claude.json directly sidesteps both problems. This asserts rather
# than reproduces: that file is app-owned and rewritten continuously, so a sync
# step that wrote into it would fight the client (the same reason
# claude_desktop_config.json is merged, never linked).
# FIXED: this step used to assert only that a helper STRING mentioning each ref appeared
# somewhere in the file. That is why it stayed green while the GitHub MCP was dead — the
# `github` server's helper had been repointed at `~/.local/bin/gh-mcp-auth-header`, a path that
# exists nowhere and is tracked by no repo, so no Authorization header was sent and the client
# reported "does not support dynamic client registration": the same misleading error that once
# got this server deleted instead of fixed. A name match cannot catch that; an executability
# check can.
#   `render-api-key` is dropped — but NOT, as this comment once claimed, because "no `render`
# server exists in any scope". One did, and that false claim is what made the gap below read as
# already-handled. Corrected in place rather than deleted; the incident is in DECISIONS.md.
#   THE GAP, named because nothing here closes it: this proves the helper BINARY is executable,
# never that its `op://` ref RESOLVES. A helper aimed at a deleted vault item is executable, exits
# 0 and emits `{}` — green here while the server is dead. Closing it means resolving a secret on an
# unattended launchd timer, which is a worse trade than the blind spot. `claude mcp list` is the
# control that catches this class.
[[section.run]]
on = "verify"
cmd = '''
f=~/.claude.json
[ -f "$f" ] || exit 0
command -v jq >/dev/null 2>&1 || exit 0
# NO positive assertion that any particular helper EXISTS. There used to be one, requiring a
# `claude-git-pat` helper for the third-party GitHub MCP — and it is gone with that server:
# asserting the presence of plumbing we deliberately deleted is how a check starts failing for
# the opposite of its purpose. What remains is the negative assertion below, which is the part
# that caught a real outage: any helper that IS configured must actually be runnable.
# A `for` over command substitution, NOT `jq | while read`: the right side of a pipe runs in a
# subshell, so an `exit 1` in there only fails the step while the pipeline happens to be the last
# command in this cmd. Appending any line below would have silently turned this assertion into a
# no-op — a fail-open control that still looks like enforcement, which is the exact defect class
# this whole verify step exists to catch. Measured both ways before choosing this form.
# jq emits only the first field, so word-splitting is safe even though a helper string has spaces.
bad=""
for bin in $(jq -r '[.. | objects | .headersHelper? // empty] | .[] | split(" ")[0]' "$f" 2>/dev/null); do
  case "$bin" in "~"*) bin="$HOME${bin#\~}" ;; esac
  command -v "$bin" >/dev/null 2>&1 || [ -x "$bin" ] || bad="$bad $bin"
done
[ -z "$bad" ] || { echo "MCP headersHelper is not executable:$bad — the server fails to connect with a misleading auth error, not a missing-file error"; exit 1; }
'''

# Every skill's `description` frontmatter is injected into EVERY session; only the body is
# on-demand. `~/.claude/skills/` is a glob DESTINATION, so boom places the managed symlinks
# there and has no opinion about anything else sharing the directory. Thirteen hand-installed
# real directories accumulated that way — 5,145 B / ~1,286 tokens, 58% of live skill cost, one
# invocation between them — and nothing could see it: the boomfile globs the SOURCE, and
# lint.yml has no ~/.claude to inspect, so CI is blind to this BY CONSTRUCTION. That is why the
# check lives here and not in the workflow. `boom` is exempt: `[boom] skill_on_sync` generates it.
[[section.run]]
on = "verify"
cmd = '''
d=~/.claude/skills
[ -d "$d" ] || exit 0
orphans=""
for e in "$d"/*/; do
  [ -e "$e" ] || continue
  n=$(basename "$e")
  [ -L "${e%/}" ] && continue
  [ "$n" = "boom" ] && continue
  orphans="$orphans $n"
done
[ -z "$orphans" ] && exit 0
echo "unmanaged skill dirs in ~/.claude/skills — each description loads into every session,"
echo "and no boomfile glob or CI check can see them:$orphans"
exit 1
'''

# NO hand-rolled symlink-integrity check here. boom already does this, natively, for EVERY
# managed link — measured, not assumed: replacing ~/.hushlogin with a real file makes
# `boom verify` report "~/.hushlogin exists but is not our symlink" and exit 1. A bespoke
# version was added here and deleted the same day, because it covered two hardcoded paths where
# boom covers all of them, which is strictly worse and would rot on the next link added.
#
# So the settings.json clobber that made a documented plugin removal a no-op for ~13 days was
# never undetectable. It was DETECTED and unseen: the boom-verify launchd job silently never ran
# for 28 days (a `~` in a plist value, which launchd does not expand — EX_CONFIG 78), and even
# once running, its findings died in a log until `[boom] notify = true` started surfacing them.
# The gap was notification, not detection — so the fix was the plist and `notify`, both already
# in place, and the right amount of new machinery here is none.

# The third-party GitHub MCP is GONE from both clients, in favour of Anthropic's own
# GitHub integration. What was here: a remote `api.githubcopilot.com/mcp/` server in
# ~/.claude.json behind a bespoke `headersHelper`, plus a LOCAL stdio
# `github-mcp-server` for Desktop launched through `op run --env-file`. Two surfaces,
# two mechanisms, one hand-rolled env file, a mise-managed binary, and a guard whose
# only job was to stop someone pasting a plaintext PAT into the config that drove it.
#
# All of it existed to authenticate someone else's MCP server with our own credential.
# The native integration is authenticated by Anthropic, needs no PAT here, no local
# binary, and no plumbing for this repo to reproduce — so the whole surface deletes
# rather than getting fixed. That is "native over special" applied to the largest
# bespoke mechanism left in the file.
#
# Consequence worth knowing: `claude-git-pat` now has exactly ONE consumer, git's
# `credential.helper` for agent pushes. It is no longer an MCP credential.

[[section]]
name = "boom-verify launchd"

# The `boom verify` guardrails above (MCP auto-approve, osxkeychain regression, Fable-default
# drift) only fire when someone runs `boom verify` — so drift can sit undetected. This plist
# runs it on a timer; the `launchd` resource collapses the old link + `launchctl unload;load -w`
# pair into one stanza that owns the load/unload lifecycle itself.
#
# It used to say the plist stayed because a `[boom] schedule` timer for `verify` "doesn't fire a
# desktop notification on drift". That was false, and had been since `notify = true` was adopted:
# notify is VERB-driven, not schedule-gated (settings.ts's applyNotify returns early only on
# `ctx.verb !== "verify"`), so a scheduled verify notifies identically. The plist was also
# carrying its own `|| osascript`, so every drift raised TWO notifications; that half is gone.
#
# What actually keeps it a plist is timing, which is a real difference: this uses
# StartCalendarInterval (21:47 daily, wall-clock), while `[boom] schedule` only renders
# StartInterval — elapsed-time, which drifts relative to the clock. Collapsing it into the
# schedule array would trade a fixed daily slot for a drifting one; that is the trade, stated
# honestly, rather than a capability claim that stopped being true.
[[section.launchd]]
src = "launchd/com.alxjrvs.boom-verify.plist"

[[section]]
name = "capslock-control launchd"

# Caps Lock → Left Control natively via hidutil, replacing the Karabiner kernel extension
# (deleted — a whole kext for one modifier remap failed the "native over special" bar).
# hidutil remaps are lost on reboot/keyboard reconnect, so a RunAtLoad LaunchAgent re-applies
# it every login. Not boom-specific, so it stays a user plist — but the `launchd` resource
# collapses the old link + launchctl pair into one stanza.
[[section.launchd]]
src = "launchd/com.alxjrvs.capslock-control.plist"


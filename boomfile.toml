# boom's own self-wiring, folded into the reconcile it already runs —
# so these stop being hand-rolled `run`/plist steps below:
#   - skill_on_sync: regenerate ~/.claude/skills/boom/SKILL.md from the running binary each
#     sync, so the self-describing skill never lags a `boom upgrade` (replaces the
#     `boom skill --install` run step).
#   - upgrade_on_sync = "check": after a sync, warn (offline-safe, non-fatal) when a newer boom
#     ships — the exact stale-binary drift that let a 0.9.1 machine propagate renamed-away
#     command names before anyone noticed. ("auto" would self-upgrade instead of warning.)
#   - schedule: launchd timers running `boom <cmd>` on an interval. `code fetch` every 15m
#     `git fetch`es every ~/Code repo to keep origin/HEAD warm for agent worktree cuts
#     (replaces the agent-fetch plist + section). One array — any boom command can be scheduled.
[boom]
skill_on_sync = true
upgrade_on_sync = "check"
# Desktop-notify (macOS osascript) when a scheduled `boom verify` finds drift, so the
# boom-verify launchd timer's signal surfaces instead of dying in its log.
notify = true
# `code reap` daily. Claude Code keeps an agent worktree whenever a commit reachable from HEAD is
# on no remote-tracking ref, and refuses to remove it ("Worktree kept at … — has commits that are
# not pushed anywhere") — which is what stops a finished subagent from being closed.
# Measured against 2.1.237 rather than inferred from the message: the client's check (`deleteJob`,
# gated on `rev-list --max-count=1 HEAD --not --remotes`) does carry a second, content-based escape
# — every commit patch-id-matching `origin/<default>` — but that escape is gated on the branch's
# upstream reading exactly `gone`, and an agent worktree is cut `--no-track`, so it has no upstream
# at all and the escape can never fire. Hence a squash-merged branch stays blocked even though its
# content landed. `force` does NOT help: it bypasses the `dirty` arm only, so the condition can
# only be falsified, never waived. That is the whole reason this timer exists.
#   `code reap` falsifies it correctly, and is smarter than the client: it re-decides by content
# (git patch-id), reads `gh stack` topology, and removes only clean, unlocked,
# already-merged-or-pushed worktrees, always leaving the branch ref — so it cannot lose a commit.
#   `--push` was REMOVED on 2026-08-28, and the log is why. Over 14 sweeps this timer recorded
# 0 successful pushes and 84 failures — `grep -c pushed` on
# ~/.local/state/boom/logs/com.boomtube.code-reap---push.log returned zero. The cause is mundane
# (`.gitconfig` resolves GitHub auth through `gh auth git-credential`, and a launchd job runs
# outside any session where that works), but nobody noticed for weeks because the finding died in
# a log nothing reads. It was carrying the entire outward blast radius of the design — those
# branches land on origin, including org repos — for a benefit it never once delivered.
#   The reap half DOES work and stays: one sweep reaped 33 worktrees. What is lost with `--push`
# is a clean worktree whose commits exist nowhere but this machine, which now stays un-closeable
# until someone types `git push`. That was already the state of the world; the flag was not
# achieving otherwise.
schedule = [
  { cmd = "code fetch", every = "15m" },
  # NOT "1d" — boom's schema accepts only s/m/h or a bare seconds count, so "1d" failed
  # validation and this timer never ran at all from the day it was added.
  { cmd = "code reap", every = "24h" },
]

[[section]]
name = "Shell + git"

[[section.link]]
src = ".zshrc"
dst = "~/.zshrc"

[[section.link]]
src = ".zprofile"
dst = "~/.zprofile"

[[section.link]]
src = ".zshenv"
dst = "~/.zshenv"

[[section.link]]
src = ".hushlogin"
dst = "~/.hushlogin"

[[section.link]]
src = ".gitconfig"
dst = "~/.gitconfig"

[[section.link]]
src = ".gitmessage"
dst = "~/.gitmessage"

# Global git excludes → git's XDG default. ONLY universal machine/editor
# cruft; repo-specific ignores live in each project's own .gitignore. (This
# used to be a `.gitignore → ~/.gitignore` link doubling as core.excludesfile,
# which leaked this repo's `.claude/` etc. into every repo on the machine.)
[[section.link]]
src = "git/ignore"
dst = "~/.config/git/ignore"

[[section.link]]
src = ".editorconfig"
dst = "~/.editorconfig"

[[section.link]]
src = ".ripgreprc"
dst = "~/.ripgreprc"

[[section.link]]
src = ".fdignore"
dst = "~/.fdignore"

# npm userconfig → its canonical native location (`npm config get userconfig` is
# ~/.npmrc; npm does NOT use XDG ~/.config/npm for the userconfig). Preferences
# only; the registry token is `${NPM_TOKEN}`, expanded by npm at read time and
# supplied on demand via `op run -- npm publish` — never plaintext in git.
[[section.link]]
src = "npm/npmrc"
dst = "~/.npmrc"

[[section.link]]
src = "git-template/hooks/pre-commit"
dst = "~/.config/git/template/hooks/pre-commit"

[[section]]
name = "SSH"

[[section.link]]
src = "ssh/config"
dst = "~/.ssh/config"
mode = "600"

[[section.link]]
src = "ssh/1password-agent.toml"
dst = "~/.config/1Password/ssh/agent.toml"

[[section]]
name = "Tools"

[[section.link]]
src = "mise.toml"
dst = "~/.config/mise/config.toml"

[[section.link]]
src = "mise-settings.toml"
dst = "~/.config/mise/conf.d/settings.toml"

# The lockfile, and this link is what makes it count. mise resolves a lockfile against the
# *config root*, which for the global config is ~/.config/mise/ — not this repo, because
# ~/.config/mise/config.toml is a symlink INTO the repo rather than the repo itself. Without
# this link, `lockfile = true` would happily maintain ~/.config/mise/mise.lock outside version
# control and the pinning would never actually be committed: the feature would look enabled and
# land nothing.
#
# Linked rather than copied so mise's own updates write through into the repo, keeping the
# committed lockfile current instead of immediately stale.
[[section.link]]
src = "mise.lock"
dst = "~/.config/mise/mise.lock"

[[section.link]]
src = "sheldon/plugins.toml"
dst = "~/.config/sheldon/plugins.toml"

[[section.link]]
src = "starship.toml"
dst = "~/.config/starship.toml"

[[section.link]]
src = "ghostty/config"
dst = "~/.config/ghostty/config"

[[section.link]]
src = "bat/config"
dst = "~/.config/bat/config"

[[section.link]]
src = "atuin/config.toml"
dst = "~/.config/atuin/config.toml"

[[section.link]]
src = "gh/config.yml"
dst = "~/.config/gh/config.yml"

[[section.link]]
src = "nvim/init.lua"
dst = "~/.config/nvim/init.lua"

[[section]]
name = "Claude"

[[section.link]]
src = "dot-claude/CLAUDE.md"
dst = "~/.claude/CLAUDE.md"

[[section.link]]
src = "dot-claude/settings.json"
dst = "~/.claude/settings.json"

# Shared parsing for both PreToolUse guards (quote-aware command splitting, token
# normalization). LOAD-BEARING: each guard sources it as
# `$(dirname "$0")/guard-lib.sh`, so if this link is missing they both fail OPEN
# and every push/checkout sails through. It must sit in the same directory as
# them. Not executable — it is sourced, never run.
[[section.link]]
src = "dot-claude/hooks/guard-lib.sh"
dst = "~/.claude/hooks/guard-lib.sh"

# PreToolUse guard referenced by settings.json `hooks.PreToolUse`: blocks an
# agent's `git push` / `gh pr create` when its branch is behind origin/HEAD, so
# it rebases onto the latest target before publishing. Logic lives in a script
# (not an inline settings.json string) because it parses stdin, fetches, and
# emits a deny-JSON verdict — too much for a legible one-liner.
[[section.link]]
src = "dot-claude/hooks/rebase-guard.sh"
dst = "~/.claude/hooks/rebase-guard.sh"
mode = "755"

# PreToolUse guard (runs before rebase-guard): blocks `git checkout/switch
# <default>` from inside a linked worktree, where it fails "'<default>' is already
# used by worktree". The single highest-frequency mechanical crash agents hit.
[[section.link]]
src = "dot-claude/hooks/worktree-checkout-guard.sh"
dst = "~/.claude/hooks/worktree-checkout-guard.sh"
mode = "755"

# PreToolUse guard: refuses to destroy a worktree whose lock names a LIVE pid.
# The one irreversible action here with no PR and no reflog behind it — the
# commits may exist nowhere else and the working tree certainly does not.
[[section.link]]
src = "dot-claude/hooks/worktree-remove-guard.sh"
dst = "~/.claude/hooks/worktree-remove-guard.sh"
mode = "755"

# PreToolUse guard: refuses a WRITE to a repo outside the owned orgs, and the
# two `gh pr merge` flags that delete a branch. `permissions.deny` can express
# neither — the owner is data, not a spelling, and a deny rule cannot match a
# flag anywhere in argv. Resolves the owner from the local remote, never the
# network: this runs on every Bash call.
[[section.link]]
src = "dot-claude/hooks/repo-scope-guard.sh"
dst = "~/.claude/hooks/repo-scope-guard.sh"
mode = "755"

# PreToolUse guard (runs FIRST): the allow-list that makes `op` usable by agents.
# LOAD-BEARING, and in a way the other two guards are not. `permissions.allow`
# carries `Bash(op run:*)`, which pre-approves the shape this guard is what keeps
# safe — it denies `--no-masking`, a `--`-less invocation, and an env-dumping or
# `git`/`gh` child before the permission system is ever consulted. If this link
# goes missing, that pre-approval is left standing on its own.
#
# That is why it is a LINK and not a copy, and why `boom verify` is the backstop:
# an absent symlink is drift boom reports, so "the guard is gone" is a detected
# state rather than a silent one. Do not add `Bash(op run:*)` to `allow` anywhere
# this guard is not also installed.
[[section.link]]
src = "dot-claude/hooks/op-guard.sh"
dst = "~/.claude/hooks/op-guard.sh"
mode = "755"

# Stop hook: run the repo's OWN commit gate before an agent may call itself done.
# Every other hook here stops a bad ACTION; this is the only one that asks whether the
# WORK is correct. It has no opinion of its own — it runs whatever `lefthook.yml` the
# repo already declares — and it is a no-op unless the tree has uncommitted changes.
# The link is what makes it real: it landed in `settings.json` without one, so the
# handler pointed at a path that did not exist and the gate enforced nothing. That is
# the failure this repo keeps recording, and `settings-guardrails.sh` now names this
# file so un-wiring it fails lefthook, CI and `boom verify` instead of passing all three.
[[section.link]]
src = "dot-claude/hooks/verify-gate.sh"
dst = "~/.claude/hooks/verify-gate.sh"
mode = "755"

# SessionStart/SubagentStart hook: start an agent on CURRENT code. The client's
# `worktree.baseRef: "fresh"` cuts from the local `origin/<default>` ref and only
# refreshes it when .git/FETCH_HEAD is more than 24h old, so an agent can silently
# branch from a day-old base (measured against 2.1.237, both directions). This
# refreshes the ref in the primary checkout and fast-forwards a virgin worktree
# onto it. Unlike the PreToolUse guards it decides nothing — it only ever runs
# `git merge --ff-only`, so it cannot discard a commit.
[[section.link]]
src = "dot-claude/hooks/worktree-freshness.sh"
dst = "~/.claude/hooks/worktree-freshness.sh"
mode = "755"

# SessionStart hook: give each agent worktree its own 10-port block, derived from
# the worktree's name, so two agents told to "run the app" do not race for :3000 —
# where the loser either reports the feature broken (EADDRINUSE) or, on a framework
# that auto-increments, silently drives a browser against the OTHER worktree's
# server and passes a check of code it never loaded. Derived rather than allocated:
# no registry, no lock, no reaper, and stable across sessions, which is what makes
# it safe to append `PORT=` to a worktree's own gitignored `.env` — the four
# conditions gating that write are in the script's header, and the symlink one is
# what keeps it off the user's real `.env`.
[[section.link]]
src = "dot-claude/hooks/worktree-port.sh"
dst = "~/.claude/hooks/worktree-port.sh"
mode = "755"

# The hook SUITES are deliberately not linked. Five of the eight were — run.sh,
# cases.tsv, freshness, port, canary — and verifygate, wtremove and reposcope were
# not, an asymmetry with no stated reason behind it. The runner that replaced
# their gate declarations discovers its roster from the directory it sits in,
# which turns a partial link set into the one failure mode a test runner must not
# have: a green run over a roster missing three suites.
#
# Linking all of them instead would buy a convenience `cd ~/Code/DevEnv/dotFiles &&
# dot-claude/hooks/tests/all.sh` already provides, on a machine that by
# definition has this repo — boom cloned it to get here. So: none, and the
# asymmetry cannot come back.

# Standing prompt for a bare `/loop`. `.claude/loop.md` is a real Claude Code
# config surface (the binary carries `<<loop.md>>` sentinels), so versioning it
# here beats retyping the condition each session. It is byte-capped — the client
# warns "loop.md was truncated to N bytes. Keep the task list concise" — so this
# stays a short task list, never a second CLAUDE.md.
[[section.link]]
src = "dot-claude/loop.md"
dst = "~/.claude/loop.md"

# A glob `src` places every match under `dst` (a directory) — the old `glob` resource, now
# just a `link` whose src carries a wildcard.
[[section.link]]
src = "dot-claude/skills/*"
dst = "~/.claude/skills/"

# Subagent definitions. Same glob-destination shape as skills above, and the same
# caveat: boom places the managed symlinks and has no opinion about anything else
# sharing the directory.
#
# Unlike a skill, an agent definition costs nothing per session — only its
# `description` is read, and only when the Agent tool is offered. That is what
# makes these worth having for work a main session would otherwise do inline:
# `guard-tester` runs seven suites whose ~20s of output never enters the parent
# context, and `drift-triage` is read-only by construction.
[[section.link]]
src = "dot-claude/agents/*"
dst = "~/.claude/agents/"

# Path-scoped rules. Same glob-destination shape again, but a different cost
# model from either neighbour above, and it is the reason these exist:
#
# A rule carrying `paths:` frontmatter loads ONLY when Claude reads a file
# matching one of its globs — "path-scoped rules trigger when Claude reads files
# matching the pattern, not on every tool use". So guidance that is only true
# while editing one kind of file can be written at any length and still cost a
# session nothing until that file is opened.
#
# That closes the gap `scripts/context-budget.sh` had been paying for. The
# ceiling on CLAUDE.md is real and stays, but until now the only way under it was
# DELETION — guidance was destroyed to fit a budget a free mechanism would have
# absorbed. Two rules moved out of the always-loaded file on the first pass (the
# Bash-pattern gotcha and the empty-string env vars, both useful only while
# editing a settings.json) and they now fire exactly when they apply, which is
# also better targeting than always-on ever was.
#
# A rule WITHOUT `paths:` loads at launch with the same priority as CLAUDE.md —
# i.e. it is billed like the file it was supposed to relieve. That is the failure
# mode worth gating, so `scripts/rules-scoped.sh` fails on any rule here that
# omits the key.
[[section.link]]
src = "dot-claude/rules/*"
dst = "~/.claude/rules/"

# Skill refresh moved to the top-level `[boom] skill_on_sync = true` — boom regenerates its
# own SKILL.md from the running binary each sync, no `run` step needed.

[[section.run]]
# Claude Code CLI via the official native installer (self-updating); never
# brew/npm, whose builds do not auto-update. Only installs when `claude` is
# missing; the CLI updates itself thereafter.
#
# The predicate is `unless` rather than hand-rolled into `cmd`: a skipped step
# now says so in the report instead of a `||` short-circuit pretending to converge. `timeout`
# because this is a network fetch piped to a shell — reachable from an unattended sync, where a
# hang would block the whole reconcile with nobody watching.
on = "sync"
unless = "command -v claude >/dev/null 2>&1"
timeout = 180
cmd = "curl -fsSL https://claude.ai/install.sh | bash"

# The 1Password Environments MCP server, user-scoped. It ships INSIDE the desktop app
# (`/Applications/1Password.app/Contents/MacOS/1password-mcp`, a stdio server — verified by
# speaking a JSON-RPC `initialize` to it directly), so there is nothing to install and, unlike
# every other server here, nothing to authenticate: it takes no token, no `op://` ref and no
# `headersHelper`. `boom mcp add` is deliberately NOT used — it wraps its argument in
# `op run --env-file`, which is exactly wrong for a server whose whole design is that no secret
# ever passes through it.
#
# `unless` keys off the registration, not the binary, so this converges once and stays quiet.
# Registration lives in `~/.claude.json`, which nothing tracks — that is the same gap CLAUDE.md
# records for the project-scoped `github`/`render` servers ("neither is declared in the boomfile,
# so a fresh machine reproduces neither"). This step closes it for this one server.
[[section.run]]
on = "sync"
unless = '''test ! -x /Applications/1Password.app/Contents/MacOS/1password-mcp || jq -e '.mcpServers["1password"]' ~/.claude.json >/dev/null 2>&1'''
cmd = "claude mcp add --scope user 1password -- /Applications/1Password.app/Contents/MacOS/1password-mcp"

# A `run` bound to `on = "sync"` is invisible to `verify` BY CONSTRUCTION — the lesson the
# `gh extensions` section records after a hand-removed extension went unnoticed until the next
# sync silently reinstalled it. There is no boom package manager for MCP servers, so the
# sync step above cannot become a `pkg` entry; this is the verify half, hand-written.
#
# It asserts registration only. Health is already covered by the existing `claude mcp list`
# check — and note that server reports `✔ Connected` even with nobody at the keyboard, because
# its human approval gate is at TOOL-CALL time, per Environment, not at connect. That was
# measured before adopting it precisely because a server that needed auth to connect would have
# failed `boom verify` on every unattended nightly run.
[[section.run]]
on = "verify"
cmd = '''
[ -x /Applications/1Password.app/Contents/MacOS/1password-mcp ] || exit 0
jq -e '.mcpServers["1password"]' ~/.claude.json >/dev/null 2>&1 || { echo "1Password Environments MCP not registered (user scope) — boom source, or: claude mcp add --scope user 1password -- /Applications/1Password.app/Contents/MacOS/1password-mcp"; exit 1; }
'''

# The three settings.json guardrails below were escaping-heavy `grep`-in-a-`run` steps; they
# are now declarative `check` resources, evaluated on `boom verify` and folded
# into its exit code + `--json` report. `missing_file = "skip"` preserves the old `|| exit 0`
# (an absent settings.json is not a failure). Note the Fable pattern is a JS regex (`\s`), not
# the POSIX `[[:space:]]` the grep used.

[[section.check]]
# CVE-2025-59536 class: the auto-approve MCP keys run .mcp.json commands before the trust
# dialog (pre-consent RCE). A prose rule isn't enforced; this is.
path = "~/.claude/settings.json"
absent = ["enableAllProjectMcpServers", "enabledMcpjsonServers"]
missing_file = "skip"
message = "forbidden auto-approve MCP key in ~/.claude/settings.json"

[[section.check]]
# Agent git auth must resolve the PAT through the single `op` primitive
# (`op-agent git-credential`), never a cached PAT via `osxkeychain`.
path = "~/.claude/settings.json"
present = ["op-agent git-credential"]
absent = ["osxkeychain"]
missing_file = "skip"
message = "agent git helper drifted off op-agent git-credential (or an osxkeychain cached-PAT regression) in ~/.claude/settings.json"

[[section.check]]
# No model pinned as the default, and Fable in particular is /model per-session only —
# `/model`'s "set as default" silently rewrites settings.json, so drift is caught here.
path = "~/.claude/settings.json"
absent = ['"model"\s*:\s*"[^"]*fable']
missing_file = "skip"
message = "Fable pinned as default model in ~/.claude/settings.json (Fable is /model per-session only)"

# The deny floor and the hook inventory — the Bash path to a *resolved* secret,
# and the guards that must stay wired for the pre-approved shapes to remain safe.
# `op-agent secret` and `op-agent git-credential get` each print a live credential
# to stdout, and stdout is model context. The verb with the confirmed transcript
# leak was `op-agent header`, deleted 2026-08-28 once an audit found it dispatched
# but consumed by nothing. That postmortem produced a prose rule and no deny
# entry, so the one command with an incident stayed reachable while `op-agent
# secret`, which never leaked, was blocked twice — which is the whole reason the
# floor below is asserted by a script rather than described here.
#
# The assertions now live in scripts/settings-guardrails.sh, called here against
# the LIVE file and from lefthook and lint.yml against the staged and committed
# ones. They were written out three times before, hand-synced, each carrying a
# comment telling a human to keep the inventory aligned — and they had already
# drifted in form. This is the consolidation scripts/context-budget.sh already
# argues for, applied a second time.
#
# Two things the script keeps that a `[[section.check]]` could not express, and
# which are why this stays a `run`: `present` matches file CONTENT, so
# `"Bash(op:*)"` appearing anywhere satisfied it — moving an entry out of `deny`
# and into `allow` INVERTED the control with every gate green; and it asserted 3
# of 11 entries, leaving the keychain read, both `Read()` rules and
# `Bash(~/.local/bin/op-agent:*)` deletable unnoticed. `jq index` asserts
# membership of the deny ARRAY, and --arg passes each value as data rather than
# as a pattern. The `[ -f ]` guard preserves the old `missing_file = "skip"`.
#
# It also asserts every wired hook, not just op-guard: un-wiring rebase-guard or
# worktree-checkout-guard used to pass all three gates green.
[[section.run]]
on = "verify"
cmd = '''
f=~/.claude/settings.json
[ -f "$f" ] || exit 0
scripts/settings-guardrails.sh "$f"
'''

# An MCP server can die silently and stay dead. Two of three configured servers
# were failing to connect for an unknown period — spacebase (its resolver command
# word-split an op:// ref containing spaces) and github (same bug, so no auth
# header, so the client fell back to OAuth discovery and reported a misleading
# "dynamic client registration" error). Nothing surfaced either one; the only
# symptom was zero usage, which reads identically to "didn't need it". With
# `notify = true` this now desktop-notifies instead of dying in a log.
[[section.run]]
on = "verify"
# Retry before failing: MCP health is inherently flappy — remote servers 502 and
# stdio plugin servers cold-start — and back-to-back `boom verify` runs went green,
# red, green on servers that were all fine. This timer desktop-notifies, so a check
# that cries wolf is worse than no check: it trains you to ignore the alarm. Exits
# on the first clean read; only a fault that survives three reads is real.
#
# Matches `!` as well as `✘` (fixed 2026-08-08). `claude mcp list` reports a
# server needing re-auth as "! Needs authentication", not "✘", so a server that
# cannot answer at all passed this check silently — observed live on Google
# Calendar. Different symbol, same outcome: the server does not work.
#
# SCOPED to the servers THIS machine configures — the ones in ~/.claude.json.
# `claude mcp list` also reports account-level claude.ai connectors, which it
# prefixes with "claude.ai ", and those are configured at claude.ai rather than
# here. Fourteen of them were unauthenticated when this filter was added (Asana,
# Atlassian, Box, Canva, Figma, HubSpot, Intercom, Linear, monday.com, Notion and
# more), several of which are unlikely ever to be authenticated deliberately. So
# the unfiltered check failed on essentially every run, which is exactly the
# "a check that cries wolf gets bypassed" failure this repo has already paid for
# twice — and it would have trained the nightly notify to be ignored.
#
# The filter is on the client's display prefix rather than a jq read of
# ~/.claude.json, because the failure direction is right: if that prefix ever
# changes, the check goes NOISY, which is visible, rather than silently green.
#
# The stale note that used to sit here described `github` and `render` as
# project-scoped servers this check could not see. Both are gone — `github` was
# deleted with the third-party GitHub MCP, and `render` never existed in any scope.
cmd = '''
for i in 1 2 3; do
  claude mcp list 2>&1 | grep -v '^claude\.ai ' | grep -qE '✘|! Needs authentication' || exit 0
  sleep 3
done
claude mcp list 2>&1 | grep -v '^claude\.ai ' | grep -E '✘|! Needs authentication'
echo 'a locally-configured MCP server is failing to connect or needs authentication (3 consecutive checks)'
exit 1
'''

# `~/.claude/settings.json` symlinks into boom's own clone, so an uncommitted edit
# THERE is live on the machine while being invisible to both CI (which lints the
# repo's copy) and the checks above (which read the live symlink and so see the
# edit as normal). That is a local override layer the doctrine says does not
# exist. Fail while it is dirty.
[[section.run]]
on = "verify"
cmd = "git diff --quiet -- dot-claude/ || { echo 'live Claude config diverges from the committed contract (dirty boom config-repo)'; exit 1; }"

# The remaining worktree workarounds are written against client defects measured
# against 2.1.237, and the client self-updates — so the version those
# measurements describe is replaced silently and repeatedly. A workaround whose
# bug is gone is not inert: worktree-freshness.sh still mutates worktrees, and
# boom's `code reap` still re-decides a removal the client refused. CLAUDE.md
# already names this failure mode ("a measurement recorded against a tool version
# expires unnoticed and nothing owns it"); this step owns it.
#
# The `unpushed` literal below is still load-bearing after worktree-publish.sh was
# deleted on 2026-08-28: `code reap` exists to falsify exactly that refusal, so the
# day the client stops emitting it is the day the reap timer can go too.
#
# INVERTED POLARITY, deliberately: it fails when the workaround looks
# UNNECESSARY. A failure means "go re-measure", never "the bug is fixed" — the
# fingerprints are string literals, which is a monotone signal and not a proof.
# It is also written to fail LOUD when its own method breaks: if the client is
# ever packaged so its strings cannot be read, every fingerprint vanishes at once,
# and reporting that as all-clear would be a canary that lies. The anchor check
# is what separates those two cases, and tests/canary.sh asserts it.
[[section.run]]
on = "verify"
cmd = "hooks/claude-canary.sh"

# Is this machine still reproducible from the Brewfile? `brew bundle` installs
# what the Brewfile names and never removes what it omits, so drift is
# one-directional and silent: 21 casks were installed against 11 declared, and
# the Brewfile's own "NOT here, deliberately" block described removals that had
# never happened. Verify-time because it is a property of the MACHINE, not of
# the file — lefthook only sees it when the Brewfile itself is edited.
[[section.run]]
on = "verify"
cmd = "scripts/brew-drift.sh"

# `settings.local.json` must not exist. One `absent` entry covers both verbs:
# sync removes it, verify fails while it is there.
#
# Machine-local override is not a pattern this setup uses — every divergence
# lives in the committed `settings.json` contract, and .gitignore says so. But
# .gitignore can only stop the file being COMMITTED. Claude Code writes it
# itself on an "always allow" click, so the rule was enforceable against the repo
# and never against the machine.
#
# That gap had teeth. The file found on 2026-08-28 carried `Bash(gh api *)` in
# `permissions.allow`: POST and DELETE against any repo on GitHub, no prompt,
# under defaultMode auto. Nothing could see it — lefthook and CI read tracked
# files, and git had been told to ignore this one.
#
# This was a pair of `run` steps calling a script in `scripts/`. It is now the
# `absent` resource, added to boom for this case (alxjrvs/boom#174). Three things
# came back from moving it:
#
#   - ONE declaration instead of two. A `run` bound to `on = "sync"` is invisible
#     to `verify` BY CONSTRUCTION (the lesson recorded above for gh extensions),
#     so the shell version needed a step per verb and a `--check` flag to tell
#     them apart. A resource reports on both from one entry.
#   - ROLLBACK-ABLE removal. The file is displaced into the run's backup tree, so
#     `boom rollback` restores it — better than the script's own archive
#     directory, which only a human reading the path would ever have found.
#   - The directory guard and the symlink handling (`lstat`, so a link is removed
#     rather than its target) are the engine's, tested there, not re-derived here.
[[section.absent]]
path = "~/.claude/settings.local.json"
message = "machine-local override is not a pattern this setup uses"

# `git maintenance` registers repos in ~/.gitconfig.local and installs three launchd agents
# (org.git-scm.git.{hourly,daily,weekly}) that run whether or not those paths still exist. Found
# pointing at /Users/jarvis/dotFiles and /Users/jarvis/Code/dotFiles — neither of which exists,
# a layout from before boom moved the clone into the state dir — so all three agents had been
# firing on schedule and exiting 1 every single time, for as long as they had been installed.
# The real config repo and every ~/Code repo got no maintenance at all.
#
# Exactly the failure class DECISIONS.md already has an incident for ("the scheduled boom verify
# has never run — 28 days, runs=0"): a job that is registered, fires, fails, and reports only
# into a log nobody reads. This asserts the general rule rather than the two paths, so the next
# time a repo is moved or removed it surfaces here instead of rotting.
#
# Verify-only: repointing maintenance is a human call (which repos deserve it), not something to
# repair automatically.
#
# Note the deliberate absence of `--global`. The keys live in ~/.gitconfig.local, pulled in by an
# `[include]` from ~/.gitconfig — and `git config --global --get-all` does NOT follow includes
# into other files, so it returns nothing here and the check would be permanently, silently
# green. Full resolution sees them. (Found the hard way: the first version of this check used
# --global and passed against a machine that was visibly broken.)
[[section.run]]
on = "verify"
timeout = 20
cmd = '''
missing=0
while IFS= read -r r; do
  [ -z "$r" ] && continue
  [ -d "$r" ] || { echo "git maintenance registered for a path that does not exist: $r"; missing=1; }
done <<< "$(git config --get-all maintenance.repo 2>/dev/null)"
[ "$missing" -eq 0 ] || { echo "fix with: git maintenance unregister --force <path>  (or repoint at a repo that exists)"; exit 1; }
'''

[[section]]
name = "zsh fragments"

[[section.link]]
src = "zsh/[0-9]*.zsh"
dst = "~/.config/zsh/"

[[section]]
name = "packages"
# One `pkg` array per manager, replacing the old scalar `brewfile` +
# boolean `mise`. `brew` runs `brew bundle` over `file`; `mise` reads the repo's mise config.
pkg = [
  { manager = "brew", file = "Brewfile" },
  { manager = "mise" },
]

[[section]]
name = "gh extensions"

# MUST stay after the `packages` section — `gh` itself comes from mise, and sections run in
# file order, so a fresh machine has no `gh` on PATH until packages has run.
#
# Was four hand-rolled `gh extension list | grep -q <owner>/<ext> || gh extension install …`
# run steps, with a comment explaining that they were "imperative by necessity" because "boom
# has no `gh` pkg manager". boom gained one, so that is no longer true and they collapse to a
# declared list.
#
# The gain over the run steps is not just brevity: a `run` step bound to `on = "sync"` is
# invisible to `verify` by construction, so an extension removed by hand went unnoticed until
# the next sync silently reinstalled it. As a `pkg` entry, verify reports it missing.
pkg = [{ manager = "gh", file = "gh-extensions.txt" }]


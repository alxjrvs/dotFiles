[[section]]
name = "lefthook"

# ── boom hands itself over to Homebrew ────────────────────────────────────────────────
# `install.sh` drops boom at ~/.local/bin/boom to bootstrap a fresh machine — you need a
# boom to run this file at all. Once the Brewfile's `brew "boom"` has landed, that copy is
# not a fallback, it is a SHADOW: `.zprofile` puts ~/.local/bin ahead of brew's prefix, so
# the bootstrap binary keeps winning `command -v boom` and every `brew upgrade boom` is
# inert. Exactly the double-install shape the Brewfile documents for gh, node and six
# others — closed here instead of described.
#
# Guarded inside the command rather than with `unless`, so the predicate and the action
# read as one statement: remove the bootstrap copy ONLY when brew's boom is actually in
# place. If the formula failed to install, this is a no-op and the machine keeps the only
# boom it has. Removing a running executable is safe — the kernel holds the inode until
# this process exits, and the next run resolves brew's.
[[section.run]]
on = "sync"
timeout = 30
cmd = '''
command -v brew >/dev/null 2>&1 || exit 0
[ -x "$(brew --prefix)/bin/boom" ] || exit 0
[ -e "$HOME/.local/bin/boom" ] || exit 0
rm -f "$HOME/.local/bin/boom"
echo "removed the install.sh bootstrap copy — brew owns boom now"
'''

# The assertion, because arranging it is not the same as it being true. `command -v boom`
# must resolve inside brew's prefix: that is the whole point of declaring the formula, and
# it is invisible to every file-reading gate because it is a property of PATH on a real
# machine. Skips cleanly where brew or boom is absent (a Linux checkout, a CI runner) so
# this stays a drift check rather than a portability failure.
[[section.run]]
on = "verify"
timeout = 30
cmd = '''
command -v brew >/dev/null 2>&1 || exit 0
command -v boom >/dev/null 2>&1 || exit 0
resolved=$(command -v boom)
case "$resolved" in
  "$(brew --prefix)"/*) exit 0 ;;
esac
echo "boom resolves to $resolved, not $(brew --prefix)/bin/boom — the Brewfile declares it, so something ahead of brew on PATH is shadowing it (\`install.sh\` drops one at ~/.local/bin/boom)"
exit 1
'''

# `creates` guards the re-run: the generated pre-commit hook is the artifact, so its existence
# is the predicate — without it every sync rewrites .git/hooks and reports a no-op as work.
[[section.run]]
on = "sync"
creates = ".git/hooks/pre-commit"
timeout = 60
cmd = "lefthook install"

# The one uninstall binding worth having: a teardown otherwise leaves lefthook's generated
# .git/hooks behind, pointing at a lefthook that may no longer be installed. Safe and
# reversible — it removes generated hooks and nothing else.
#
# Deliberately NOT bound for the others, and the reasons are the point:
#   - `op-agent provision` — teardown would destroy a live 1Password service account. Automating
#     credential destruction is worse than leaving one behind; that is a human decision.
#   - the Claude CLI — self-updating and self-managing; boom did not install its updater.
[[section.run]]
on = "uninstall"
timeout = 60
cmd = "lefthook uninstall || true"

[[section]]
name = "tldr cache"

# mise installs the `tldr` binary (packages section, earlier → on PATH here), but tealdeer
# ships no pages — `tldr <cmd>` errors until the archive is fetched once. Do it at sync time
# so a fresh machine is ready. `|| true` keeps an offline sync from failing on a non-critical
# cache; re-run with `boom source --only="tldr cache"` once networked.
[[section.run]]
on = "sync"
timeout = 120
cmd = "tldr --update || true"

[[section]]
name = "op-agent"

[[section.link]]
src = "hooks/op-agent.sh"
dst = "~/.local/bin/op-agent"

# No `unless`: op-agent.sh already short-circuits on `security find-generic-password`, so the
# predicate would duplicate logic that lives (correctly) with the thing it guards. Timeout only —
# provisioning talks to 1Password over the network.
[[section.run]]
on = "sync"
timeout = 120
cmd = "op-agent provision"

[[section.run]]
on = "verify"
timeout = 60
cmd = "op-agent status"

# `headersHelper` MCP servers are declared in NO boomfile step, so a fresh machine reproduces
# none, and the `claude mcp list` check cannot see an ABSENT server — only a
# configured-and-failing one. They are also project-scoped (to ~/Code/SU-SRD), so they are
# invisible from any other CWD. Reading ~/.claude.json directly sidesteps both. This asserts
# rather than reproduces: that file is app-owned and rewritten continuously, so a sync step
# writing into it would fight the client.
#
# The assertion is that each configured helper is EXECUTABLE, not that its name appears
# somewhere in the file: a helper repointed at a path that exists nowhere sends no
# Authorization header, and the client then reports "does not support dynamic client
# registration" — a misleading auth error that a name match cannot catch.
#
# THE GAP, named because nothing here closes it: this proves the helper BINARY is executable,
# never that its `op://` ref RESOLVES. A helper aimed at a deleted vault item is executable,
# exits 0 and emits `{}` — green here while the server is dead. Closing that means resolving a
# secret on an unattended run, a worse trade than the blind spot. `claude mcp list` is the
# control that catches this class.
[[section.run]]
on = "verify"
cmd = '''
f=~/.claude.json
[ -f "$f" ] || exit 0
command -v jq >/dev/null 2>&1 || exit 0
# NO positive assertion that any particular helper EXISTS. There used to be one, requiring a
# `claude-git-pat` helper for the third-party GitHub MCP — and it is gone with that server:
# asserting the presence of plumbing we deliberately deleted is how a check starts failing for
# the opposite of its purpose. What remains is the negative assertion below, which is the part
# that caught a real outage: any helper that IS configured must actually be runnable.
# A `for` over command substitution, NOT `jq | while read`: the right side of a pipe runs in a
# subshell, so an `exit 1` in there only fails the step while the pipeline happens to be the last
# command in this cmd. Appending any line below would have silently turned this assertion into a
# no-op — a fail-open control that still looks like enforcement, which is the exact defect class
# this whole verify step exists to catch. Measured both ways before choosing this form.
# jq emits only the first field, so word-splitting is safe even though a helper string has spaces.
bad=""
for bin in $(jq -r '[.. | objects | .headersHelper? // empty] | .[] | split(" ")[0]' "$f" 2>/dev/null); do
  case "$bin" in "~"*) bin="$HOME${bin#\~}" ;; esac
  command -v "$bin" >/dev/null 2>&1 || [ -x "$bin" ] || bad="$bad $bin"
done
[ -z "$bad" ] || { echo "MCP headersHelper is not executable:$bad — the server fails to connect with a misleading auth error, not a missing-file error"; exit 1; }
'''

# Every skill's `description` frontmatter is injected into EVERY session; only the body is
# on-demand. `~/.claude/skills/` is a glob DESTINATION, so boom places the managed symlinks
# there and has no opinion about anything else sharing the directory — hand-installed real
# directories accumulate there unseen, because the boomfile globs the SOURCE and lint.yml has
# no ~/.claude to inspect. That is why the check lives here and not in the workflow. `boom`
# is exempt: `[boom] skill_on_sync` generates it.
[[section.run]]
on = "verify"
cmd = '''
d=~/.claude/skills
[ -d "$d" ] || exit 0
orphans=""
for e in "$d"/*/; do
  [ -e "$e" ] || continue
  n=$(basename "$e")
  [ -L "${e%/}" ] && continue
  [ "$n" = "boom" ] && continue
  orphans="$orphans $n"
done
[ -z "$orphans" ] && exit 0
echo "unmanaged skill dirs in ~/.claude/skills — each description loads into every session,"
echo "and no boomfile glob or CI check can see them:$orphans"
exit 1
'''

# NO hand-rolled symlink-integrity check here. boom already does it natively for EVERY managed
# link, so a bespoke version would cover a hardcoded subset and rot on the next link added.
#
# And nothing runs `boom verify` on a schedule: it runs when it is run. Every check in this
# file is only as live as the last time someone invoked it.

# The third-party GitHub MCP is GONE from both clients, in favour of Anthropic's own GitHub
# integration — authenticated by Anthropic, so no PAT here, no local binary, and no plumbing
# for this repo to reproduce. Consequence worth knowing: `claude-git-pat` now has exactly ONE
# consumer, git's `credential.helper` for agent pushes. It is no longer an MCP credential.

[[section]]
name = "capslock-control launchd"

# Caps Lock → Left Control natively via hidutil, replacing the Karabiner kernel extension.
# hidutil remaps are lost on reboot/keyboard reconnect, so a RunAtLoad LaunchAgent re-applies
# it every login. Not boom-specific, so it stays a user plist.
[[section.launchd]]
src = "launchd/com.alxjrvs.capslock-control.plist"

[[section]]
name = "git-signing"

[[section.hook]]
name = "git-signing"

[section.hook.with]
key = "GitHubSSH"

[[section]]
name = "claude_statusline"

[[section.hook]]
name = "claude_statusline"

[section.hook.with]
repo = "github.com/TheGnarCo/claude-statusline"

[[section.link]]
src = ".gitconfig"
dst = "~/.gitconfig"

[[section.link]]
src = ".gitmessage"
dst = "~/.gitmessage"

# Global git excludes → git's XDG default. ONLY universal machine/editor cruft;
# repo-specific ignores live in each project's own .gitignore.

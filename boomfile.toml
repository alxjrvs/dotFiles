# boom's own self-wiring, folded into the reconcile it already runs:
#   - skill_on_sync: regenerate ~/.claude/skills/boom/SKILL.md from the running binary each
#     sync, so the self-describing skill never lags a `boom upgrade`.
#   - upgrade_on_sync = "check": after a sync, warn (offline-safe, non-fatal) when a newer boom
#     ships. NOT "auto": brew owns this binary now (see `brew "boom"` in the Brewfile), so the
#     remedy is `brew upgrade boom`. "auto" runs `boom upgrade`, which rewrites the binary in
#     place — under a brew-managed prefix that desynchronises brew's manifest from what is
#     actually on disk, and the next `brew upgrade` silently reverts it. Warn, then let the
#     package manager do the swap.
[boom]
skill_on_sync = true
upgrade_on_sync = "check"
# Desktop-notify (macOS osascript) when `boom verify` finds drift.
notify = true

[[section]]
name = "Shell + git"

[[section.link]]

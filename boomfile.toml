# control-master dir exist at 0700 (idempotent; verify reports mode drift).
[[section.dir]]
path = "~/.ssh"
mode = "700"

[[section.dir]]
path = "~/.ssh/cm"
mode = "700"

[[section]]
name = "lefthook"

# `creates` guards the re-run: lefthook install rewrote .git/hooks on every single sync, which
# is harmless but dishonest — the report claimed work that was a no-op. The generated pre-commit
# hook is the artifact, so its existence is the predicate.
[[section.run]]
on = "sync"
creates = ".git/hooks/pre-commit"
timeout = 60
cmd = "lefthook install"

# The one uninstall binding worth adding. Nothing in this file bound `on = "uninstall"` at all,
# so a teardown left lefthook's generated .git/hooks behind, pointing at a lefthook that may no
# longer be installed. Safe and reversible: it removes generated hooks and nothing else.
#
# Deliberately NOT bound for the others, and the reasons are the point:
#   - `op-agent provision` — teardown would destroy a live 1Password service account. Automating
#     credential destruction is worse than leaving one behind; that is a human decision.
#   - the Claude CLI — self-updating and self-managing; boom did not install its updater.
#   - claude-desktop-mcp.sh — it MERGES a key into a file boom does not own, so a blind reversal
#     could clobber unrelated edits made since.
[[section.run]]
on = "uninstall"
timeout = 60
cmd = "lefthook uninstall || true"

[[section]]
name = "tldr cache"

# mise installs the `tldr` binary (packages section, earlier → on PATH
# here), but tealdeer ships no pages — `tldr <cmd>` errors until the archive is
# fetched once. Do it at sync time so a fresh machine is ready. `|| true` keeps
# an offline sync from failing on a non-critical cache; re-run with
# `boom source --only="tldr cache"` once networked.
# `|| true` stays: an offline sync must not fail on a non-critical cache (see above). Only a
# timeout is added — this is a network fetch reachable from an unattended sync.
[[section.run]]
on = "sync"
timeout = 120
cmd = "tldr --update || true"

[[section]]
name = "op-agent"

[[section.link]]
src = "hooks/op-agent.sh"
dst = "~/.local/bin/op-agent"

# No `unless`: op-agent.sh already short-circuits on `security find-generic-password`, so the
# predicate would duplicate logic that lives (correctly) with the thing it guards. Timeout only —
# provisioning talks to 1Password over the network.
[[section.run]]
on = "sync"
timeout = 120
cmd = "op-agent provision"

[[section.run]]
on = "verify"
timeout = 60
cmd = "op-agent status"

# Vault MEMBERSHIP is the only control that stays live on this setup, so it is
# asserted rather than described. Two 1Password facts force that:
#   - SA vault access is IMMUTABLE after creation, so scope can never be
#     tightened in place; only the vault's contents can change.
#   - Activity Log and service-account usage reports are Business/Teams only.
#     This is an Individual/Family account, so no per-item record of what the SA
#     read exists at all — a gap accepted deliberately on 2026-08-19.
# An item added to the vault without a commit is exactly the event the missing
# audit log would have reported; `agent-vault.txt` is how it gets reported.
# Relative path: boom runs verify steps from the config-repo root (same
# convention as the `git diff -- dot-claude/` check above).
# Advisory on tooling gaps, fails closed on real drift.
[[section.run]]
on = "verify"
timeout = 60
cmd = "op-agent audit agent-vault.txt"

# The two `headersHelper` MCP servers are declared in NO boomfile step, so a fresh
# machine reproduces neither, and `boom verify`'s `claude mcp list | grep ✘` check
# cannot see an ABSENT server — only a configured-and-failing one. They are also
# project-scoped (to ~/Code/SU-SRD), so they are invisible from any other CWD.
# Reading ~/.claude.json directly sidesteps both problems. This asserts rather
# than reproduces: that file is app-owned and rewritten continuously, so a sync
# step that wrote into it would fight the client (the same reason
# claude_desktop_config.json is merged, never linked).
[[section.run]]
on = "verify"
cmd = '''
f=~/.claude.json
[ -f "$f" ] || exit 0
command -v jq >/dev/null 2>&1 || exit 0
for ref in claude-git-pat render-api-key; do
  jq -e --arg r "$ref" '[.. | objects | .headersHelper? // empty] | map(select(test($r))) | length > 0' "$f" >/dev/null 2>&1 \
    || { echo "MCP headersHelper resolving op://<agent-vault>/$ref is missing from ~/.claude.json — the GitHub/render MCP servers are declared by no boomfile step, so this is the only signal a fresh machine never got them"; exit 1; }
done
'''

[[section]]
name = "Claude Desktop MCP"

# The GitHub MCP is configured twice, deliberately, because the two clients cannot
# share a mechanism:
#   Claude Code    → remote HTTP server (api.githubcopilot.com/mcp/) in the
#                    user-scoped ~/.claude.json, authenticated by a `headersHelper`
#                    running `op-agent header`. No local binary involved.
#   Claude Desktop → local stdio server (mise: aqua:github/github-mcp-server),
#                    launched by `op run --env-file` (below). Desktop has no
#                    headersHelper, and it cannot use the remote server either:
#                    GitHub's remote MCP authenticates through a registered
#                    GitHub App and Desktop's "Add custom connector" OAuth flow
#                    does not support it. GitHub's own install-claude.md says to
#                    run it locally.
# Both resolve the SAME vault item, so there is still exactly one credential and
# one source of truth — which is why the PAT is NOT duplicated into a 1Password
# Environment (see dot-claude/DECISIONS.md, 2026-08-20).
#
# The `gh-mcp-stdio` launcher this section used to link is GONE. Its whole job
# was to read the PAT and export it into the server's environment, which is what
# `op run` does natively and is 1Password's own published shape for securing an
# MCP config. What remains is a committable env-file holding a REFERENCE.
[[section.link]]
src = "gh/mcp.env"
dst = "~/.config/gh/mcp.env"

# Merges one key into Claude Desktop's config rather than linking it — the app
# owns that file and rewrites it continuously. See the script header.
[[section.run]]
on = "sync"
cmd = "./hooks/claude-desktop-mcp.sh"

[[section.check]]
# The Desktop entry must never carry an inline token. GitHub's documented config
# hardcodes GITHUB_PERSONAL_ACCESS_TOKEN in an `env` block; if anyone ever pastes
# that in, a live classic PAT is sitting in plaintext in the app's config file.
# The registered entry names only an env-file of `op://` references, so the
# variable NAME must never appear in this file at all.
path = "~/Library/Application Support/Claude/claude_desktop_config.json"
absent = ["GITHUB_PERSONAL_ACCESS_TOKEN"]
missing_file = "skip"
message = "a plaintext GitHub PAT is configured in claude_desktop_config.json (it should launch via `op run --env-file`, which resolves the reference from 1Password — see hooks/claude-desktop-mcp.sh)"

# The agent-fetch launchd job (every 15m, `git fetch` every ~/Code repo to keep origin/HEAD
# warm for agent worktree cuts) is now the top-level `[boom] schedule` entry
# `{ cmd = "code fetch", every = "15m" }` — boom owns the timer and runs `boom code fetch`
# (which walks the recorded code dir), so the hand-authored com.alxjrvs.agent-fetch.plist +
# its link/launchctl section are gone.

[[section]]
name = "boom-verify launchd"

# The `boom verify` guardrails above (MCP auto-approve, osxkeychain regression, Fable-default
# drift) only fire when someone runs `boom verify` — so drift can sit undetected. This plist
# runs it on a timer; the `launchd` resource collapses the old link + `launchctl unload;load -w`
# pair into one stanza that owns the load/unload lifecycle itself.
#
# It used to say the plist stayed because a `[boom] schedule` timer for `verify` "doesn't fire a
# desktop notification on drift". That was false, and had been since `notify = true` was adopted:
# notify is VERB-driven, not schedule-gated (settings.ts's applyNotify returns early only on
# `ctx.verb !== "verify"`), so a scheduled verify notifies identically. The plist was also
# carrying its own `|| osascript`, so every drift raised TWO notifications; that half is gone.
#
# What actually keeps it a plist is timing, which is a real difference: this uses
# StartCalendarInterval (21:47 daily, wall-clock), while `[boom] schedule` only renders
# StartInterval — elapsed-time, which drifts relative to the clock. Collapsing it into the
# schedule array would trade a fixed daily slot for a drifting one; that is the trade, stated
# honestly, rather than a capability claim that stopped being true.
[[section.launchd]]
src = "launchd/com.alxjrvs.boom-verify.plist"

[[section]]
name = "capslock-control launchd"

# Caps Lock → Left Control natively via hidutil, replacing the Karabiner kernel extension
# (deleted — a whole kext for one modifier remap failed the "native over special" bar).
# hidutil remaps are lost on reboot/keyboard reconnect, so a RunAtLoad LaunchAgent re-applies
# it every login. Not boom-specific, so it stays a user plist — but the `launchd` resource
# collapses the old link + launchctl pair into one stanza.
[[section.launchd]]
src = "launchd/com.alxjrvs.capslock-control.plist"


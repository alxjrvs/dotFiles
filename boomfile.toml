[[section.link]]
src = "mise-settings.toml"
dst = "~/.config/mise/conf.d/settings.toml"

# The lockfile, and this link is what makes it count. mise resolves a lockfile against the
# *config root* — for the global config that is ~/.config/mise/, not this repo, because
# ~/.config/mise/config.toml is only a symlink into it. Without this link, `lockfile = true`
# would maintain ~/.config/mise/mise.lock outside version control and pin nothing.
#
# Linked rather than copied so mise's own updates write through into the repo.
[[section.link]]
src = "mise.lock"
dst = "~/.config/mise/mise.lock"

[[section.link]]
src = "sheldon/plugins.toml"
dst = "~/.config/sheldon/plugins.toml"

[[section.link]]
src = "starship.toml"
dst = "~/.config/starship.toml"

[[section.link]]
src = "ghostty/config"
dst = "~/.config/ghostty/config"

[[section.link]]
src = "bat/config"
dst = "~/.config/bat/config"

[[section.link]]
src = "atuin/config.toml"
dst = "~/.config/atuin/config.toml"

[[section.link]]
src = "gh/config.yml"
dst = "~/.config/gh/config.yml"

[[section.link]]
src = "nvim/init.lua"
dst = "~/.config/nvim/init.lua"

[[section]]
name = "Claude"

[[section.link]]
src = "dot-claude/CLAUDE.md"
dst = "~/.claude/CLAUDE.md"

[[section.link]]
src = "dot-claude/settings.json"
dst = "~/.claude/settings.json"

# Shared parsing for the PreToolUse guards (quote-aware command splitting, token
# normalization). LOAD-BEARING: each guard sources it as
# `$(dirname "$0")/guard-lib.sh`, so if this link is missing they all fail OPEN and
# every guarded command sails through. It must sit in the same directory as them.
# Not executable — it is sourced, never run.
[[section.link]]
src = "dot-claude/hooks/guard-lib.sh"
dst = "~/.claude/hooks/guard-lib.sh"

# PreToolUse guard referenced by settings.json `hooks.PreToolUse`: blocks an
# agent's `git push` / `gh pr create` when its branch is behind origin/HEAD, so
# it rebases onto the latest target before publishing.
[[section.link]]
src = "dot-claude/hooks/rebase-guard.sh"
dst = "~/.claude/hooks/rebase-guard.sh"
mode = "755"

# PreToolUse guard: refuses to destroy a worktree whose lock names a LIVE pid.
# The one irreversible action here with no PR and no reflog behind it — the
# commits may exist nowhere else and the working tree certainly does not.
[[section.link]]
src = "dot-claude/hooks/worktree-remove-guard.sh"
dst = "~/.claude/hooks/worktree-remove-guard.sh"
mode = "755"

# PreToolUse guard: refuses a WRITE to a repo outside the owned orgs, and the
# two `gh pr merge` flags that delete a branch. `permissions.deny` can express
# neither — the owner is data, not a spelling, and a deny rule cannot match a
# flag anywhere in argv. Resolves the owner from the local remote, never the
# network: this runs on every Bash call.
[[section.link]]
src = "dot-claude/hooks/repo-scope-guard.sh"
dst = "~/.claude/hooks/repo-scope-guard.sh"
mode = "755"

# PreToolUse guard (runs FIRST): the allow-list that makes `op` usable by agents.
# LOAD-BEARING, and in a way the other guards are not. `permissions.allow` carries
# `Bash(op run:*)`, which pre-approves the shape this guard is what keeps safe — it
# denies `--no-masking`, a `--`-less invocation, and an env-dumping or `git`/`gh`
# child before the permission system is ever consulted. If this link goes missing,
# that pre-approval is left standing on its own.
#
# A LINK and not a copy, so an absent symlink is drift `boom verify` reports. Do not
# add `Bash(op run:*)` to `allow` anywhere this guard is not also installed.
[[section.link]]
src = "dot-claude/hooks/op-guard.sh"
dst = "~/.claude/hooks/op-guard.sh"
mode = "755"

# Stop hook: run the repo's OWN commit gate before an agent may call itself done.
# It has no opinion of its own — it runs whatever `lefthook.yml` the repo already
# declares — and it is a no-op unless the tree has uncommitted changes. The link is what
# makes it real: without it the `settings.json` handler points at a path that does not
# exist and the gate enforces nothing, which is why `settings-guardrails.sh` names this
# file — un-wiring it fails lefthook, CI and `boom verify` instead of passing all three.
[[section.link]]
src = "dot-claude/hooks/verify-gate.sh"
dst = "~/.claude/hooks/verify-gate.sh"
mode = "755"

# SessionStart/SubagentStart hook: start an agent on CURRENT code. The client's
# `worktree.baseRef: "fresh"` cuts from the local `origin/<default>` ref and only
# refreshes it when .git/FETCH_HEAD is more than 24h old (measured against 2.1.237), so
# an agent can silently branch from a day-old base. This refreshes the ref in the primary
# checkout and fast-forwards a virgin worktree onto it; it only ever runs
# `git merge --ff-only`, so it cannot discard a commit.
[[section.link]]
src = "dot-claude/hooks/worktree-freshness.sh"
dst = "~/.claude/hooks/worktree-freshness.sh"
mode = "755"

# SessionStart hook: give each agent worktree its own 10-port block, derived from
# the worktree's name, so two agents told to "run the app" do not race for :3000 —
# where the loser either reports the feature broken (EADDRINUSE) or, on a framework that
# auto-increments, drives a browser against the OTHER worktree's server. Derived rather
# than allocated: no registry, no lock, no reaper, and stable across sessions, which is
# what makes it safe to append `PORT=` to a worktree's own gitignored `.env` — the four
# conditions gating that write are in the script's header.
[[section.link]]
src = "dot-claude/hooks/worktree-port.sh"
dst = "~/.claude/hooks/worktree-port.sh"
mode = "755"

# The hook SUITES are deliberately not linked, none of them. The runner discovers its
# roster from the directory it sits in, so a partial link set produces the one failure a
# test runner must not have: a green run over a roster missing suites. Run them from the
# repo instead — `dot-claude/hooks/tests/all.sh`, on a machine that by definition has it.

# Standing prompt for a bare `/loop`. It is byte-capped — the client warns "loop.md was
# truncated to N bytes. Keep the task list concise" — so this stays a short task list,
# never a second CLAUDE.md.
[[section.link]]
src = "dot-claude/loop.md"
dst = "~/.claude/loop.md"

# A glob `src` places every match under `dst` (a directory).
[[section.link]]
src = "dot-claude/skills/*"
dst = "~/.claude/skills/"

# Subagent definitions. Same glob-destination shape as skills above, and the same
# caveat: boom places the managed symlinks and has no opinion about anything else
# sharing the directory. Unlike a skill, an agent definition costs nothing per
# session — only its `description` is read, and only when the Agent tool is offered.
[[section.link]]
src = "dot-claude/agents/*"
dst = "~/.claude/agents/"

# Path-scoped rules. A rule carrying `paths:` frontmatter loads ONLY when Claude reads a
# file matching one of its globs, so guidance that is only true while editing one kind of
# file can be written at any length and still cost a session nothing until that file is
# opened. A rule WITHOUT `paths:` loads at launch with the same priority as CLAUDE.md —
# billed like the file it was supposed to relieve — so `scripts/rules-scoped.sh` fails on
# any rule here that omits the key.
[[section.link]]
src = "dot-claude/rules/*"
dst = "~/.claude/rules/"

[[section.run]]
# Claude Code CLI via the official native installer (self-updating); never
# brew/npm, whose builds do not auto-update. Only installs when `claude` is missing;
# the CLI updates itself thereafter. `timeout` because this is a network fetch piped
# to a shell, reachable from an unattended sync where a hang would block the reconcile.
on = "sync"
unless = "command -v claude >/dev/null 2>&1"
timeout = 180
cmd = "curl -fsSL https://claude.ai/install.sh | bash"

# The 1Password Environments MCP server, user-scoped. It ships INSIDE the desktop app
# (`/Applications/1Password.app/Contents/MacOS/1password-mcp`, a stdio server), so there is
# nothing to install and, unlike every other server here, nothing to authenticate: it takes
# no token, no `op://` ref and no `headersHelper`.
#
# `unless` keys off the registration, not the binary, so this converges once and stays quiet.
# Registration lives in `~/.claude.json`, which nothing tracks, so a fresh machine reproduces
# no MCP server at all; this step closes that for this one server.
[[section.run]]
on = "sync"
unless = '''test ! -x /Applications/1Password.app/Contents/MacOS/1password-mcp || jq -e '.mcpServers["1password"]' ~/.claude.json >/dev/null 2>&1'''
cmd = "claude mcp add --scope user 1password -- /Applications/1Password.app/Contents/MacOS/1password-mcp"

# A `run` bound to `on = "sync"` is invisible to `verify` BY CONSTRUCTION, and there is no
# boom package manager for MCP servers, so the sync step above cannot become a `pkg` entry.
# This is the verify half, hand-written, and it asserts registration only.
#
# Health is covered by the `claude mcp list` check below — note that this server reports
# `✔ Connected` even with nobody at the keyboard, because its human approval gate is at
# TOOL-CALL time, per Environment, not at connect.
[[section.run]]
on = "verify"
cmd = '''
[ -x /Applications/1Password.app/Contents/MacOS/1password-mcp ] || exit 0
jq -e '.mcpServers["1password"]' ~/.claude.json >/dev/null 2>&1 || { echo "1Password Environments MCP not registered (user scope) — boom source, or: claude mcp add --scope user 1password -- /Applications/1Password.app/Contents/MacOS/1password-mcp"; exit 1; }
'''

# The deny floor and the hook inventory — the Bash path to a *resolved* secret, and the
# guards that must stay wired for the pre-approved shapes to remain safe. `op-agent secret`
# and `op-agent git-credential get` each print a live credential to stdout, and stdout is
# model context. The assertions live in scripts/settings-guardrails.sh, called here against
# the LIVE file and from lefthook and lint.yml against the staged and committed ones, and
# they cover every wired hook, not just op-guard.
#
# Why a `run` and not a `[[section.check]]`: `present` matches file CONTENT, so
# `"Bash(op:*)"` appearing anywhere satisfies it, and moving an entry out of `deny` and into
# `allow` INVERTS the control with every gate green. `jq index` asserts membership of the
# deny ARRAY, and --arg passes each value as data rather than as a pattern. The `[ -f ]`
# guard preserves the old `missing_file = "skip"`.
[[section.run]]
on = "verify"
cmd = '''
f=~/.claude/settings.json
[ -f "$f" ] || exit 0
scripts/settings-guardrails.sh "$f"
'''

# An MCP server can die silently and stay dead: nothing surfaces a server that fails to
# connect, and the only symptom is zero usage, which reads identically to "didn't need it".
# With `notify = true` this desktop-notifies instead of dying in a log.
[[section.run]]
on = "verify"
# Retry before failing: MCP health is inherently flappy — remote servers 502 and stdio
# plugin servers cold-start — and this check desktop-notifies, so one that cries wolf is
# worse than no check: it trains you to ignore the alarm. Exits on the first clean read;
# only a fault that survives three reads is real.
#
# Matches `!` as well as `✘`: `claude mcp list` reports a server needing re-auth as
# "! Needs authentication", not "✘". Different symbol, same outcome: it does not work.
#
# SCOPED to the servers THIS machine configures — the ones in ~/.claude.json. `claude mcp
# list` also reports account-level claude.ai connectors, prefixed "claude.ai ", which are
# configured at claude.ai rather than here and are mostly unauthenticated on purpose;
# unfiltered, this check fails on essentially every run. The filter is on the client's
# display prefix rather than a jq read of ~/.claude.json because the failure direction is
# right: if that prefix ever changes, the check goes NOISY rather than silently green.
cmd = '''
for i in 1 2 3; do
  claude mcp list 2>&1 | grep -v '^claude\.ai ' | grep -qE '✘|! Needs authentication' || exit 0
  sleep 3
done
claude mcp list 2>&1 | grep -v '^claude\.ai ' | grep -E '✘|! Needs authentication'
echo 'a locally-configured MCP server is failing to connect or needs authentication (3 consecutive checks)'
exit 1
'''

# `~/.claude/settings.json` symlinks into boom's own clone, so an uncommitted edit THERE is
# live on the machine while invisible to both CI (which lints the repo's copy) and the checks
# above (which read the live symlink and see the edit as normal). That is a local override
# layer the doctrine says does not exist. Fail while it is dirty.
[[section.run]]
on = "verify"
cmd = "git diff --quiet -- dot-claude/ || { echo 'live Claude config diverges from the committed contract (dirty boom config-repo)'; exit 1; }"

# worktree-freshness.sh is written against a client defect measured against 2.1.237, and the
# client self-updates — so a workaround whose bug is gone is not inert: it still mutates
# worktrees. This step owns that expiry.
#
# INVERTED POLARITY, deliberately: it fails when the workaround looks UNNECESSARY. A failure
# means "go re-measure", never "the bug is fixed" — the fingerprints are string literals, a
# monotone signal and not a proof. It also fails LOUD when its own method breaks: if the
# client is ever packaged so its strings cannot be read, every fingerprint vanishes at once,
# and reporting that as all-clear would be a canary that lies. The anchor check separates
# those two cases, and tests/canary.sh asserts it.
[[section.run]]
on = "verify"
cmd = "hooks/claude-canary.sh"

# Is this machine still reproducible from the Brewfile? `brew bundle` installs what the
# Brewfile names and never removes what it omits, so drift is one-directional and silent.
# Verify-time because it is a property of the MACHINE, not of the file — lefthook only
# sees it when the Brewfile itself is edited.
[[section.run]]
on = "verify"
cmd = "scripts/brew-drift.sh"

# Do the names in the Brewfile still RESOLVE? Different question from the drift check
# above, and only brew can answer it: a cask retired upstream leaves a perfectly
# well-formed line that every file-reading gate passes, then fails `brew bundle` outright
# on a fresh machine. Not a required CI check — it depends on Homebrew's live API, and a
# transient upstream outage must not block an unattended agent — so it lives here, where
# `notify` reaches a human.
[[section.run]]
on = "verify"
cmd = "scripts/brew-resolves.sh"

# NOTE — scheduled-job liveness is boom's job, not a check here. `boom verify` covers every
# scheduled job on this machine whichever mechanism installed it, so a hand-rolled version
# would be a second implementation of an assertion the engine already tests.

# Interactive shell startup has not got structurally slower. The drift it watches is six
# `eval`s of six independently upgrading tools, none of which announces getting heavier —
# a baseline comment in zsh/30-plugins.zsh explains it, but only this fires.
#
# A ceiling well above the baseline, not a baseline comparison: load, a cold cache and a
# Rosetta shell all move the number, and a check that fires on those is one you ignore.
[[section.run]]
on = "verify"
timeout = 60
cmd = "scripts/startup-budget.sh"

# `settings.local.json` must not exist. One `absent` entry covers both verbs: sync removes
# it, verify fails while it is there.
#
# Machine-local override is not a pattern this setup uses — every divergence lives in the
# committed `settings.json` contract. .gitignore can only stop the file being COMMITTED,
# and Claude Code writes it itself on an "always allow" click, so that rule is enforceable
# against the repo and never against the machine. This is the half that reaches the machine.
#
# Removal is recoverable: the file is displaced into the run's backup tree rather than
# destroyed, and restoring it is a hand copy from there.
[[section.absent]]
path = "~/.claude/settings.local.json"
message = "machine-local override is not a pattern this setup uses"

# `git maintenance` registers repos in ~/.gitconfig.local and installs three launchd agents
# (org.git-scm.git.{hourly,daily,weekly}) that fire whether or not those paths still exist,
# exiting 1 into a log nobody reads. This asserts the general rule rather than any particular
# path, so a repo moved or removed surfaces here instead of rotting.
#
# Verify-only: repointing maintenance is a human call (which repos deserve it), not something
# to repair automatically.
#
# Note the deliberate absence of `--global`. The keys live in ~/.gitconfig.local, pulled in by
# an `[include]` from ~/.gitconfig — and `git config --global --get-all` does NOT follow
# includes into other files, so it would return nothing here and the check would be
# permanently, silently green. Full resolution sees them.
[[section.run]]
on = "verify"
timeout = 20
cmd = '''
missing=0
while IFS= read -r r; do
  [ -z "$r" ] && continue
  [ -d "$r" ] || { echo "git maintenance registered for a path that does not exist: $r"; missing=1; }
done <<< "$(git config --get-all maintenance.repo 2>/dev/null)"
[ "$missing" -eq 0 ] || { echo "fix with: git maintenance unregister --force <path>  (or repoint at a repo that exists)"; exit 1; }
'''

[[section]]
name = "zsh fragments"

[[section.link]]
src = "zsh/[0-9]*.zsh"
dst = "~/.config/zsh/"

[[section]]
name = "packages"
# One `pkg` array per manager: `brew` runs `brew bundle` over `file`; `mise` reads the
# repo's mise config.
pkg = [
  { manager = "brew", file = "Brewfile" },
  { manager = "mise" },
]

[[section]]
name = "gh extensions"

# MUST stay after the `packages` section — `gh` itself comes from mise, and sections run in
# file order, so a fresh machine has no `gh` on PATH until packages has run.
#
# A `pkg` entry rather than `run` steps: a `run` bound to `on = "sync"` is invisible to
# `verify` by construction, so an extension removed by hand goes unnoticed until the next
# sync silently reinstalls it. As a `pkg` entry, verify reports it missing.
pkg = [{ manager = "gh", file = "gh-extensions.txt" }]


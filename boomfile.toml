# boom's own self-wiring, folded into the reconcile it already runs (boom >= 0.14.0) —
# so these stop being hand-rolled `run`/plist steps below:
#   - skill_on_sync: regenerate ~/.claude/skills/boom/SKILL.md from the running binary each
#     sync, so the self-describing skill never lags a `boom upgrade` (replaces the
#     `boom skill --install` run step).
#   - upgrade_on_sync = "check": after a sync, warn (offline-safe, non-fatal) when a newer boom
#     ships — the exact stale-binary drift that let a 0.9.1 machine propagate renamed-away
#     command names before anyone noticed. ("auto" would self-upgrade instead of warning.)
#   - schedule: launchd timers running `boom <cmd>` on an interval. `code fetch` every 15m
#     `git fetch`es every ~/Code repo to keep origin/HEAD warm for agent worktree cuts
#     (replaces the agent-fetch plist + section). One array — any boom command can be scheduled.
[boom]
skill_on_sync = true
upgrade_on_sync = "check"
# Desktop-notify (macOS osascript) when a scheduled `boom verify` finds drift, so the
# boom-verify launchd timer's signal surfaces instead of dying in its log. (needs boom >= 0.17.0)
notify = true
# `code reap --push` daily: Claude Code keeps an agent worktree whenever a HEAD commit exists on
# no remote *by SHA*, which every squash-merge violates even though the content landed — so spent
# worktrees pile up and agent sessions can't be closed ("Worktree kept at … — has commits that
# are not pushed anywhere"). `code reap` re-decides that by content (git patch-id) and removes
# only clean, unlocked, already-merged-or-pushed ones, always leaving the branch ref — so it can
# never lose a commit. `--push` covers the remaining blocker: a clean worktree whose commits
# exist nowhere but this machine is published first (never forced), so nothing is ever stuck
# un-closeable. It's outward-facing — these branches land on origin, including org repos — which
# is the deliberate trade for "closing a session is never blocked". Dirty trees, live sessions
# and detached HEADs are never pushed. Daily, not 15m: it's cleanup, and each run walks every
# repo's worktrees.
schedule = [
  { cmd = "code fetch", every = "15m" },
  # Daily. NOT "1d" — boom's schema accepts only s/m/h or a bare seconds count, so
  # "1d" failed validation and this timer never ran at all from the day it was added.
  { cmd = "code reap --push", every = "24h" },
]


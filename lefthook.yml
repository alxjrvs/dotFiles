# Lefthook config for this repo (a boom config / dotfiles repo).
#
# pre-commit: lint staged shell + JS/TS/JSON, guard secrets and settings.json.
#
# no_auto_install: boom owns hook installation (the `lefthook` hook runs
# `lefthook install` when it converges). After a lefthook.yml change, re-run
# `boom source --only=lefthook` (or `lefthook install`) to refresh the checksum.
no_auto_install: true

pre-commit:
  parallel: true
  commands:
    shellcheck:
      # `*.sh` matches the hooks + boominit.sh recursively.
      glob: "{*.sh,git-template/hooks/*}"
      run: shellcheck -x {staged_files}
    shfmt-check:
      # boomfile is DSL config (an aligned link table by design) — validated by
      # `boom source --dry-run`, not shfmt, so it's deliberately not formatted here.
      glob: "{*.sh,git-template/hooks/*}"
      # -d prints a unified diff and exits nonzero — won't auto-rewrite on commit
      run: shfmt -d -i 2 -ci -sr {staged_files}
    biome-check:
      # JS/TS/JSON lint + format gate (the only JS/TS here is the boom hooks;
      # JSON includes dot-claude/settings.json). `check` reports without
      # rewriting — like shfmt-check, it won't auto-fix on commit; run
      # `biome check --write` to fix. Config: biome.json (2-space, gitignore-aware).
      glob: "{*.ts,*.tsx,*.js,*.jsx,*.json,*.jsonc}"
      run: biome check {staged_files}
    gitleaks:
      run: gitleaks protect --staged --redact -v --no-banner
    settings-json-validity:
      # Runs the same script CI and `boom verify` run, against the STAGED file,
      # so a bad commit is caught immediately rather than at the nightly verify.
      # The assertions and their reasoning live in the script, once — this was
      # sixty lines here and sixty more in lint.yml, hand-synced, each carrying a
      # comment telling a human to keep the inventory aligned by hand.
      glob: "dot-claude/settings*.json"
      run: scripts/settings-guardrails.sh {staged_files}
    dead-verbs:
      # `boom apply` is not a boom command and never has been — the verbs are
      # verify | status | plan | source | where | edit | rollback | ... A stale
      # reference to it sat in five files, including the git template's
      # pre-commit error text, which is copied into every new repo on the machine
      # via init.templateDir: a newcomer's first failed commit handed them a
      # command that does not exist, next to one that does (`or: mise install`),
      # which is why it survived so long.
      #
      # Brewfile carries the one legitimate mention, documenting the absence.
      # Anything else is drift, and drift in a command name is the kind that
      # only ever surfaces in front of someone new.
      run: |
        hits=$(git grep -n 'boom apply' -- ':!Brewfile' ':!lefthook.yml' || true)
        [ -z "$hits" ] || { echo "$hits"; echo "'boom apply' is not a boom verb — use 'boom source'"; exit 1; }

    context-budget:
      # Runs the same script CI runs, so the ceiling is hit at commit time rather
      # than after the push, and a green commit is a green build by construction —
      # the numbers cannot drift apart because there is only one copy of them.
      # Reasoning, ceilings, and the capped set: scripts/context-budget.sh.
      glob: "{CLAUDE.md,dot-claude/CLAUDE.md}"
      run: scripts/context-budget.sh {staged_files}

    plist-validity:
      # Runs the same script CI runs. Two assertions, not one: structural
      # validity does not catch a `~` in a path value, and that is the bug that
      # cost 28 days of un-run `boom verify`. See the script header.
      glob: "launchd/*.plist"
      run: scripts/plist-validity.sh {staged_files}
    zsh-syntax:
      # The interactive shell payload runs on EVERY shell startup and was linted
      # by nothing: shellcheck's glob is `*.sh`, and shellcheck cannot parse zsh
      # at all ("Unknown shell: zsh"), so excluding these was correct — but
      # nothing replaced it. `zsh -n` is the native no-exec syntax check.
      glob: "{*.zsh,.zshrc,.zprofile,.zshenv}"
      run: |
        for f in {staged_files}; do
          zsh -n "$f" || { echo "zsh syntax error in $f"; exit 1; }
        done
    toml-validity:
      # The boomfile.toml IS the repo — a parse error only surfaces at `boom
      # apply` time on a real machine otherwise. --no-schema = pure syntax check
      # (hermetic, offline); won't reformat the hand-aligned link tables.
      glob: "*.toml"
      run: taplo check --no-schema {staged_files}
    hook-tests:
      # Every suite under dot-claude/hooks/tests/, one command. This was eight
      # commands here and eight steps in lint.yml — sixteen declarations of nine
      # scripts, each with its own glob and its own paragraph. Four of those globs
      # were byte-identical and three more were strict subsets, so one guard edit
      # forked five suites off a single trigger while the wiring implied they were
      # separately scoped.
      #
      # The glob is the union of what the eight covered, so nothing narrowed: a
      # change to a guard, to the repo's own hooks/, to a suite, or to cases.tsv
      # runs all of them. The roster lives in the directory, not here — all.sh
      # discovers it, which is why adding a suite needs no edit to this file or to
      # lint.yml. Hermetic, no network.
      glob: "{hooks/*.sh,dot-claude/hooks/*.sh,dot-claude/hooks/tests/*}"
      run: dot-claude/hooks/tests/all.sh
    description-cap:
      # This existed ONLY in CI — the one asymmetry in the whole setup, and the
      # inverse of every other gate here: editing a SKILL.md description
      # committed clean locally and failed after the push.
      glob: "{dot-claude/skills/*/SKILL.md,dot-claude/agents/*.md}"
      run: scripts/description-cap.sh {staged_files}

    brew-drift:
      # Machine state, not file state: `brew bundle` installs what the Brewfile
      # names but never uninstalls what it omits, so a hand-installed package
      # stays forever and a fresh machine silently does not get it. Runs only
      # when the Brewfile is touched; no-ops where brew is absent.
      glob: "Brewfile"
      run: scripts/brew-drift.sh

    identity-drift:
      # Keeps README's "Forking this repo" list honest. A new hardcoded owner
      # somewhere the list does not mention breaks a fork silently — the forker's
      # agent commits get authored as someone else, or `boom verify` fails
      # against a 1Password vault that was never theirs.
      run: scripts/identity-drift.sh

    decisions-toc:
      # Generated, not maintained — a hand-written index is a second copy of the
      # headings, which is the drift this repo keeps finding elsewhere.
      glob: "dot-claude/DECISIONS.md"
      run: scripts/decisions-toc.sh --check
    actionlint:
      # The workflows are the remote gate, and were the only config here with no
      # linter. Declared in mise.toml and checksummed in mise.lock all along —
      # `brew-drift.sh` even excludes it BECAUSE mise owns it — but wired into
      # neither gate. It also reaches the embedded shell in every `run:`, which
      # the shellcheck glob above cannot.
      glob: ".github/workflows/*.yml"
      run: actionlint

    gate-tests:
      # The same property the canary suite above asserts, for the three shared
      # assertions in scripts/: a gate that checked nothing must not print `ok`.
      # All three used to — `settings-guardrails.sh` handed a nonexistent path
      # printed `ok` and exited 0, so renaming the settings file would have left
      # this very gate green with the deny floor unchecked.
      glob: "scripts/*.sh"
      run: scripts/tests/gates.sh

# commit-msg: forward-only hygiene guard. Rejects throwaway subjects (bare
# "WIP"/"wip" or a single character) so they don't land in permanent history.
# Existing history is untouched. Convention: `scope: summary` or
# `type(scope): summary` (see CLAUDE.md). Bypass once with: git commit --no-verify
commit-msg:
  commands:
    no-wip:
      run: |
        subject=$(head -1 "{1}")
        if printf '%s' "$subject" | grep -qiE '^(wip|.)$'; then
          printf 'commit-msg: refusing throwaway subject "%s" — write a real summary (bypass: --no-verify)\n' "$subject" >&2
          exit 1
        fi

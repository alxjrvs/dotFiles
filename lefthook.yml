# Lefthook config for this repo (a boom config / dotfiles repo).
#
# pre-commit: lint staged shell + JS/TS/JSON, guard secrets and settings.json.
#
# no_auto_install: boom owns hook installation (the `lefthook` hook runs
# `lefthook install` on apply). After a lefthook.yml change, re-run
# `boom apply --only=lefthook` (or `lefthook install`) to refresh the checksum.
no_auto_install: true

pre-commit:
  parallel: true
  commands:
    shellcheck:
      # `*.sh` matches the hooks + boominit.sh recursively.
      glob: "{*.sh,git-template/hooks/*}"
      run: shellcheck -x {staged_files}
    shfmt-check:
      # boomfile is DSL config (an aligned link table by design) — validated by
      # `boom apply --dry-run`, not shfmt, so it's deliberately not formatted here.
      glob: "{*.sh,git-template/hooks/*}"
      # -d prints a unified diff and exits nonzero — won't auto-rewrite on commit
      run: shfmt -d -i 2 -ci -sr {staged_files}
    biome-check:
      # JS/TS/JSON lint + format gate (the only JS/TS here is the boom hooks;
      # JSON includes dot-claude/settings.json). `check` reports without
      # rewriting — like shfmt-check, it won't auto-fix on commit; run
      # `biome check --write` to fix. Config: biome.json (2-space, gitignore-aware).
      glob: "{*.ts,*.tsx,*.js,*.jsx,*.json,*.jsonc}"
      run: biome check {staged_files}
    gitleaks:
      run: gitleaks protect --staged --redact -v --no-banner
    settings-json-validity:
      # Backstop against committing a broken settings.json (breaks every Claude
      # session), PLUS the same content guardrails boomfile.toml's `boom verify`
      # runs against the live ~/.claude/settings.json (MCP auto-approve keys,
      # osxkeychain git-helper regression, Fable pinned as default model,
      # secret-path deny floor) — applied here to the staged file so a bad commit
      # is caught immediately instead of waiting for the nightly launchd verify run.
      glob: "dot-claude/settings*.json"
      run: |
        for f in {staged_files}; do
          jq -e . "$f" > /dev/null
          ! grep -qE '(enableAllProjectMcpServers|enabledMcpjsonServers)' "$f" || { echo "forbidden auto-approve MCP key in $f"; exit 1; }
          grep -q 'op-agent git-credential' "$f" || { echo "agent git helper not wired to op-agent git-credential in $f"; exit 1; }
          # op-guard.sh is the allow-list that makes `op` usable without
          # reopening the stdout leak. `permissions.allow` pre-approves
          # `Bash(op run:*)`, and this guard is what strips the unsafe variants
          # of that shape (`--no-masking`, an env-dumping child, `op run -- git
          # push` slipping past rebase-guard) BEFORE the permission system sees
          # it. Un-wiring the hook while leaving the allow entry is the one edit
          # that silently converts this change from "narrower" into "wider".
          grep -q 'op-guard.sh' "$f" || { echo "op-guard PreToolUse hook not wired in $f, but permissions.allow pre-approves Bash(op run:*)"; exit 1; }
          ! grep -q 'osxkeychain' "$f" || { echo "forbidden osxkeychain git helper (cached-PAT regression) in $f"; exit 1; }
          ! grep -qE '"model"[[:space:]]*:[[:space:]]*"[^"]*fable' "$f" || { echo "Fable pinned as default model in $f"; exit 1; }
          # The deny floor — the Bash path to a resolved secret. `op-agent header`
          # and `op-agent git-credential get` each print a live credential to
          # stdout, and stdout is model context; `op-agent header` is the command
          # that leaked a PAT into a transcript on 2026-07-25. Until 2026-08-05 the
          # deny array had no assertion, so it could be deleted and every gate
          # stayed green.
          #
          # ARRAY-AWARE, not a substring grep (changed 2026-08-08). The previous
          # form was `grep -qF '"Bash(op:*)"'`, which only asks whether the string
          # appears ANYWHERE in the file — so moving an entry out of `deny` and
          # into `allow` inverted the control while all three gates stayed green.
          # `jq index` asserts membership of the deny ARRAY specifically. It also
          # sidesteps the metacharacter problem that made `-F` necessary: the
          # value is passed as data via --arg, never as a pattern.
          #
          # All SEVEN entries, not three. The old list asserted `op`/`op-agent`/
          # `git credential` only, so the keychain read and both `Read()` rules
          # could be deleted with every gate green — including
          # `Bash(~/.local/bin/op-agent:*)`, the path spelling this repo's own
          # docs call the one most likely to be copied.
          for d in \
            'Bash(security find-generic-password:*)' \
            'Bash(op read:*)' \
            'Bash(op item get:*)' \
            'Bash(op document get:*)' \
            'Bash(op-agent:*)' \
            'Bash(~/.local/bin/op-agent:*)' \
            'Bash(git credential:*)' \
            'Read(~/.ssh/id_*)' \
            'Read(~/.aws/credentials)' \
            'Bash(*/op *)' \
            'Bash(*/op-agent *)'; do
            jq -e --arg d "$d" '.permissions.deny | index($d)' "$f" > /dev/null \
              || { echo "missing deny entry $d in .permissions.deny of $f (secret-path floor)"; exit 1; }
          done
        done
    plist-validity:
      # launchd does NOT expand `~` or `$HOME` in plist values — it fails the job
      # with EX_CONFIG (78) BEFORE running it, so the symptom is a job that
      # silently never runs. That bug was found and fixed in the capslock plist on
      # 2026-07-13 and not carried across to boom-verify, which then reported
      # runs=0 for 28 days while every `boom verify` guardrail sat un-run.
      #
      # `plutil -lint` does NOT catch this: both plists were structurally valid
      # the whole time. Only the path-value assertion does, which is why this is
      # two checks and not one.
      glob: "launchd/*.plist"
      run: |
        plutil -lint {staged_files}
        for f in {staged_files}; do
          ! grep -nE '<string>[~$]' "$f" || { echo "launchd does not expand ~ or \$HOME in $f — use an absolute path (EX_CONFIG 78, job silently never runs)"; exit 1; }
        done
    zsh-syntax:
      # The interactive shell payload runs on EVERY shell startup and was linted
      # by nothing: shellcheck's glob is `*.sh`, and shellcheck cannot parse zsh
      # at all ("Unknown shell: zsh"), so excluding these was correct — but
      # nothing replaced it. `zsh -n` is the native no-exec syntax check.
      glob: "{*.zsh,.zshrc,.zprofile,.zshenv}"
      run: |
        for f in {staged_files}; do
          zsh -n "$f" || { echo "zsh syntax error in $f"; exit 1; }
        done
    toml-validity:
      # The boomfile.toml IS the repo — a parse error only surfaces at `boom
      # apply` time on a real machine otherwise. --no-schema = pure syntax check
      # (hermetic, offline); won't reformat the hand-aligned link tables.
      glob: "*.toml"
      run: taplo check --no-schema {staged_files}
    guard-tests:
      # The PreToolUse guards are the enforcement floor; a regression there is
      # silent and security-relevant. Runs whenever a guard or its cases change.
      # Hermetic (throwaway git fixtures in $TMPDIR), no network, ~5s.
      #
      # cases.tsv is in the glob because editing ONLY the expectations — which is
      # how you weaken a suite — previously ran nothing. `tests/*` also covers the
      # runner itself. Note this globs guard-lib.sh too, which is correct: it is
      # sourced by both guards, so a change there can regress either one.
      glob: "{dot-claude/hooks/*.sh,dot-claude/hooks/tests/*}"
      run: dot-claude/hooks/tests/run.sh

# commit-msg: forward-only hygiene guard. Rejects throwaway subjects (bare
# "WIP"/"wip" or a single character) so they don't land in permanent history.
# Existing history is untouched. Convention: `scope: summary` or
# `type(scope): summary` (see CLAUDE.md). Bypass once with: git commit --no-verify
commit-msg:
  commands:
    no-wip:
      run: |
        subject=$(head -1 "{1}")
        if printf '%s' "$subject" | grep -qiE '^(wip|.)$'; then
          printf 'commit-msg: refusing throwaway subject "%s" — write a real summary (bypass: --no-verify)\n' "$subject" >&2
          exit 1
        fi

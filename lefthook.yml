# Lefthook config for this repo (a chezmoi source repo).
#
# no_auto_install: chezmoi owns hook installation — home/run_onchange_after_60-lefthook.sh.tmpl
# runs `lefthook install` whenever this file changes. By hand: `lefthook install`.
no_auto_install: true

pre-commit:
  parallel: true
  commands:
    shellcheck:
      # `*.sh` matches every shell payload recursively; the two extensionless
      # scripts are named. chezmoi run scripts (`*.sh.tmpl`) get their own command.
      glob: "{*.sh,home/dot_config/git/template/hooks/*,home/dot_local/bin/op-agent}"
      run: shellcheck -x {staged_files}
    shfmt-check:
      glob: "{*.sh,home/dot_config/git/template/hooks/*,home/dot_local/bin/op-agent}"
      # -d prints a unified diff and exits nonzero — won't auto-rewrite on commit
      run: shfmt -d -i 2 -ci -sr {staged_files}
    chezmoi-scripts:
      # The run_ scripts are shell wrapped in a template. Only two template shapes
      # are used — a whole-line `{{ if }}`/`{{ end }}` guard and an inline
      # `{{ … }}` inside a string or comment — so stripping the first and
      # replacing the second with a placeholder yields shell that shellcheck can
      # read. Not shfmt: the placeholders would reflow.
      glob: "home/run_*.sh.tmpl"
      run: |
        for f in {staged_files}; do
          sed -e '/^{{.*}}$/d' -e 's/{{[^}]*}}/TEMPLATE/g' "$f" | shellcheck -x -s bash - || { echo "shellcheck failed on $f"; exit 1; }
        done
    biome-check:
      # `check` reports without rewriting — like shfmt-check it won't auto-fix on
      # commit; run `biome check --write` to fix. Config: biome.json.
      glob: "{*.ts,*.tsx,*.js,*.jsx,*.json,*.jsonc}"
      run: biome check {staged_files}
    gitleaks:
      # --config: the repo's own copy of the global rules, so this repo's gate and
      # every other repo's template hook enforce the same set.
      run: gitleaks git --staged --redact -v --no-banner --config home/dot_config/gitleaks/gitleaks.toml
    settings-json-validity:
      # Same script CI and scripts/verify.sh run, against the STAGED file, so a
      # bad commit is caught immediately rather than at the next drift check. The
      # assertions and their reasoning live in the script, once.
      glob: "home/dot_claude/settings*.json"
      run: scripts/settings-guardrails.sh {staged_files}

    context-budget:
      # The two CLAUDE.md files are loaded into every session, so they carry a
      # byte ceiling (Anthropic's guidance is "under 200 lines"; 3000 bytes is
      # roughly 40). A rule in home/dot_claude/rules/ is free ONLY with `paths:`
      # frontmatter — without it the rule loads at launch like CLAUDE.md, and
      # nothing about the omission looks wrong. Checked here, whole set, every
      # commit that touches any of them; CI runs the same command --all-files.
      # A date makes a sentence a record, not a rule, and it expires unnoticed; a
      # full YYYY-MM-DD has no business in an instruction file.
      glob: "{CLAUDE.md,home/dot_claude/CLAUDE.md,home/dot_claude/rules/*.md}"
      run: |
        for f in CLAUDE.md home/dot_claude/CLAUDE.md; do
          n=$(wc -c < "$f" | tr -d ' ')
          [ "$n" -le 3000 ] || { echo "$f: $n bytes, ceiling 3000 — it is billed to every request; move it to a skill, a rule, or DECISIONS.md"; exit 1; }
          ! grep -nE '[0-9]{4}-[0-9]{2}-[0-9]{2}' "$f" || { echo "$f: dated claim above — a date makes it a record, not a rule"; exit 1; }
        done
        for r in home/dot_claude/rules/*.md; do
          [ -e "$r" ] || continue
          awk 'NR==1 { if ($0 != "---") exit 1; next } /^---[[:space:]]*$/ { exit } /^paths:/ { f=1 } END { exit !f }' "$r" \
            || { echo "$r: no paths: in frontmatter — it would load into EVERY session"; exit 1; }
        done

    mise-lock-sync:
      # Renovate bumps a pin in mise.toml; the lockfile only follows when
      # `mise install` runs and the result is committed. Under minor/patch automerge
      # that gap would land on main unnoticed and CI would never see it (MISE_LOCKFILE
      # with an unlocked version resolves through the API and passes). So: every pin
      # must have a matching lock entry. Extra lock entries are not checked — mise
      # prunes them itself on the next install.
      glob: "home/dot_config/mise/{config.toml,mise.lock}"
      run: |
        python3 - <<'PY'
        import sys, tomllib
        cfg = tomllib.load(open("home/dot_config/mise/config.toml", "rb"))["tools"]
        lock = tomllib.load(open("home/dot_config/mise/mise.lock", "rb")).get("tools", {})
        bad = []
        for tool, want in cfg.items():
            got = {e.get("version") for e in lock.get(tool, [])}
            if want not in got:
                bad.append(f"{tool}: mise.toml pins {want}, mise.lock has {sorted(got) or 'nothing'}")
        if bad:
            print("mise.toml and mise.lock disagree — run `mise install` and commit the lock:")
            print("\n".join("  " + b for b in bad))
            sys.exit(1)
        print(f"ok mise.lock covers all {len(cfg)} pins")
        PY

    plist-validity:
      # Same script CI runs. Two assertions, not one: structural validity does
      # not catch a `~` in a path value. See the script header.
      # The verify timer is a `.plist.tmpl` (it renders the repo path in); a
      # template is not a plist, so CI's chezmoi dry run renders it instead and
      # `.chezmoiignore` keeps `Library` visible on Linux for exactly that reason.
      glob: "home/Library/LaunchAgents/*.plist"
      run: scripts/plist-validity.sh {staged_files}
    zsh-syntax:
      # shellcheck cannot parse zsh at all ("Unknown shell: zsh"), so the
      # interactive shell payload is out of its scope. `zsh -n` is the native
      # no-exec syntax check.
      glob: "{*.zsh,home/dot_zshrc,home/dot_zprofile,home/dot_zshenv}"
      run: |
        for f in {staged_files}; do
          zsh -n "$f" || { echo "zsh syntax error in $f"; exit 1; }
        done
    toml-validity:
      # A parse error otherwise surfaces at `chezmoi apply` time on a real machine.
      # --no-schema = pure syntax check (hermetic, offline). `.chezmoi.toml.tmpl`
      # is a template, not TOML, and is not matched.
      glob: "*.toml"
      run: taplo check --no-schema {staged_files}
    hook-tests:
      # The glob is the union of what these suites cover: a change to a guard, to
      # the repo's own hooks/, to a suite, or to cases.tsv runs them. Hermetic,
      # no network.
      #
      # `--changed` runs only the suites that cover the staged files — a local
      # latency optimisation. CI passes no argument and runs all of them, so the
      # merge gate is unchanged and a wrong `covers:` line cannot let a
      # regression through.
      glob: "{home/dot_claude/hooks/*.sh,home/dot_claude/hooks/tests/*}"
      run: home/dot_claude/hooks/tests/all.sh --changed {staged_files}
    brew-drift:
      # Machine state, not file state: `brew bundle` installs what the Brewfile
      # names but never uninstalls what it omits. Runs only when the Brewfile is
      # touched; no-ops where brew is absent.
      glob: "home/dot_config/homebrew/Brewfile"
      run: scripts/brew-drift.sh

    actionlint:
      # Also reaches the embedded shell in every `run:`, which the shellcheck
      # glob above cannot.
      glob: ".github/workflows/*.yml"
      run: actionlint

    gate-tests:
      # The property the hook suites assert, for the shared assertions in
      # scripts/: a gate that checked nothing must not print `ok`. The glob
      # reaches the fixtures too, so editing one re-runs the suite locally.
      glob: "{scripts/*.sh,scripts/tests/**}"
      run: scripts/tests/gates.sh

# Forward-only: rejects throwaway subjects (bare "WIP" or a single character) so
# they don't land in permanent history. Convention: `scope: summary` or
# `type(scope): summary`. Bypass once with: git commit --no-verify
commit-msg:
  commands:
    no-wip:
      run: |
        subject=$(head -1 "{1}")
        if printf '%s' "$subject" | grep -qiE '^(wip|.)$'; then
          printf 'commit-msg: refusing throwaway subject "%s" — write a real summary (bypass: --no-verify)\n' "$subject" >&2
          exit 1
        fi
